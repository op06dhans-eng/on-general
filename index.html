utton\">攻</button>\n</div>\n\n<div class=\"over\" id=\"intro\">\n  <div class=\"card\">\n    <p class=\"kicker\">孫子論將・五德之四</p>\n    <h1>勇</h1>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>《孫子・計篇》</span></p>\n    <p>這一關看的是<b>什麼才算將之勇</b>：什麼時候該忍、什麼時候該拚、什麼時候該斷了自己的退路。</p>\n    <p>第一段畫面上方有「<b>我軍之氣</b>」與「<b>敵軍之氣</b>」。右下出現藍色的「<b>擊鼓</b>」或「<b>令</b>」時按下。</p>\n    <ul class=\"keys\">\n      <li><b>移動</b>　左半邊螢幕拖曳 <kbd>WASD</kbd></li>\n      <li><b>攻</b>　連按四段 <kbd>J</kbd></li>\n      <li><b>擋</b>　按住格擋 <kbd>K</kbd></li>\n      <li><b>令</b>　出現時按下 <kbd>O</kbd></li>\n      <li><b>無雙</b>　氣滿後按下 <kbd>L</kbd></li>\n    </ul>\n    <p id=\"glWarn\" hidden style=\"color:#ff8a66;font-weight:700\"></p>\n    <button type=\"button\" class=\"cta\" id=\"bStart\">出兵</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu\">回目錄</button>\n    <p class=\"hint port\">手機橫放，戰場看得比較廣。</p>\n  </div>\n</div>\n\n<div class=\"over\" id=\"book\" hidden>\n  <div class=\"card\">\n    <h2>兵書</h2>\n    <ol class=\"lines\">\n      <li><b>將者，智、信、仁、勇、嚴也。</b><span>〈計篇〉做將領要具備的五種德行，勇排第四。</span></li>\n      <li><b>勇者，決勝乘勢，不逡巡也。</b><span>杜牧注〈計篇〉：勇，是抓住勝機、順著形勢果決出手，不猶豫退縮。</span></li>\n      <li><b>將有五危：必死，可殺也；必生，可虜也；忿速，可侮也；廉潔，可辱也；愛民，可煩也。</b><span>〈九變〉一味拚死的會被殺，一心求生的會被俘，急躁易怒的會被激怒。</span></li>\n      <li><b>朝氣銳，晝氣惰，暮氣歸。故善用兵者，避其銳氣，擊其惰歸，此治氣者也。</b><span>〈軍爭〉士氣有起落：避開對方最旺的時候，打他懈怠、想回家的時候。</span></li>\n      <li><b>勇者不得獨進，怯者不得獨退，此用眾之法也。</b><span>〈軍爭〉全軍一體：勇的不能自己衝出去，怕的也不能自己逃回來。</span></li>\n      <li><b>帥與之深入諸侯之地，而發其機，焚舟破釜，若驅群羊。</b><span>〈九地〉帶兵深入敵境，燒船砸鍋、斷絕退路，士卒就會一往無前。</span></li>\n      <li><b>勇怯，勢也。</b><span>〈兵勢〉勇敢或怯懦，是形勢造成的，不只是個人的性格。</span></li>\n    </ol>\n    <h3>史料</h3>\n    <ol class=\"lines\">\n      <li id=\"src-1\"><b>曹劌論戰</b><span>《左傳・莊公十年》：公與之乘，戰于長勺。公將鼓之。劌曰：「未可。」齊人三鼓。劌曰：「可矣。」齊師敗績。……公問其故。對曰：「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。彼竭我盈，故克之。」</span></li>\n      <li id=\"src-2\"><b>鉅鹿之戰</b><span>《史記・項羽本紀》：項羽乃悉引兵渡河，皆沉船，破釜甑，燒廬舍，持三日糧，以示士卒必死，無一還心。……楚戰士無不一以當十，楚兵呼聲動天，諸侯軍無不人人惴恐。</span></li>\n      <li id=\"src-3\"><b>吾寧鬥智，不能鬥力</b><span>《史記・項羽本紀》：項王謂漢王曰：「願與漢王挑戰決雌雄。」漢王笑謝曰：「吾寧鬥智，不能鬥力。」</span></li>\n      <li id=\"src-4\"><b>吳起論將</b><span>《吳子・論將》：凡人論將，常觀於勇。勇之於將，乃數分之一爾。夫勇者必輕合，輕合而不知利，未可也。</span></li>\n    </ol>\n    <button type=\"button\" class=\"cta\" id=\"bBookClose\">回到戰場</button>\n  </div>\n</div>\n\n<div class=\"over choice\" id=\"choice\" hidden>\n  <div class=\"card\">\n    <p class=\"kicker\" id=\"chK\"></p>\n    <p id=\"chQ\" style=\"font-size:17px\"></p>\n    <div class=\"row\" id=\"chBtns\"></div>\n  </div>\n</div>\n\n<div class=\"over\" id=\"end\" hidden>\n  <div class=\"card wide\">\n    <p class=\"kicker\">關卡結算</p>\n    <h2>勇・三次抉擇　<span id=\"endScore\"></span></h2>\n    <div class=\"stats\"><div><small>擊破</small><b id=\"eKills\">0</b></div><div><small>最大連擊</small><b id=\"eCombo\">0</b></div><div><small>用時</small><b id=\"eTime\">0:00</b></div></div>\n    <div class=\"tw\"><table><thead><tr><th></th><th>情境</th><th>你怎麼做</th><th>結果</th><th>兵書怎麼說</th></tr></thead><tbody id=\"endRows\"></tbody></table></div>\n    <h3>什麼是「勇」</h3>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>〈計篇〉</span></p>\n    <p class=\"q\">「勇者，決勝乘勢，不逡巡也。」<span>杜牧注〈計篇〉</span></p>\n    <p class=\"q\">「勇者不得獨進，怯者不得獨退。」<span>〈軍爭〉</span></p>\n    <p class=\"q\">「勇之於將，乃數分之一爾。夫勇者必輕合，輕合而不知利，未可也。」<span>《吳子・論將》</span></p>\n    <p>這一關的三次抉擇，就是「勇」：齊人一鼓、再鼓時忍住不動，等到三鼓氣竭才一鼓作氣（<b>避其銳氣，擊其惰歸</b>）；渡河之後沉船破釜，讓全軍沒有退路可想（<b>焚舟破釜</b>）；不為敵將叫罵所激，卻在敵人暮歸時果決出擊（<b>決勝乘勢，不逡巡</b>）。將之勇，不是一個人敢衝，而是讓全軍的氣在對的時候一起用出來；只會拚死的，正是〈九變〉說的「必死，可殺也」。</p>\n    <button type=\"button\" class=\"cta\" id=\"bAgain\">再打一次</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu2\">回目錄</button>\n  </div>\n</div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=Math.PI*2;\nconst rand=(a,b)=>a+Math.random()*(b-a);\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};\nconst angLerp=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);\nconst EASE={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,snap:t=>1-Math.pow(1-t,4),sine:t=>.5-.5*Math.cos(Math.PI*t)};\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ================= 渲染器與場景 ================= */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\nfunction glNotice(t){const el=document.getElementById('cap');if(el){el.hidden=false;el.textContent=t;}const w=document.getElementById('glWarn');if(w){w.hidden=false;w.textContent=t;}}\ncanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glNotice('畫面資源被手機系統回收了（開太多頁面）。請關閉其他分頁後重新整理這一頁。');},false);\ncanvas.addEventListener('webglcontextrestored',()=>{try{renderer.resetState();}catch(e){}},false);\nif(!renderer.getContext())glNotice('這個瀏覽器無法建立立體畫面，請改用 Safari 或 Chrome 重新開啟。');\nconst scene=new THREE.Scene();\nconst HORIZON=0xe2a46a;\nscene.background=new THREE.Color(HORIZON);\nscene.fog=new THREE.Fog(HORIZON,70,200);\nconst camera=new THREE.PerspectiveCamera(50,1,.4,400);\nlet portrait=false;\nlet sky;\n{\n  const g=new THREE.SphereGeometry(260,24,14),p=g.attributes.position,cols=[];\n  const top=new THREE.Color(0x56577f),hor=new THREE.Color(HORIZON),low=new THREE.Color(0xb98058),c=new THREE.Color();\n  for(let i=0;i<p.count;i++){const y=p.getY(i)/260;if(y>=0)c.copy(hor).lerp(top,Math.pow(y,.55));else c.copy(hor).lerp(low,Math.min(1,-y*3));cols.push(c.r,c.g,c.b);}\n  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));\n  sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));\n  scene.add(sky);\n}\nconst hemi=new THREE.HemisphereLight(0xffe6c4,0x6a5040,.8);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(0xffcf98,.95);sun.position.set(-30,45 ion updFoe(u,dt){\n  if(!u.active)return;\n  if(!u.alive){\n    u.deadT+=dt;\n    if(u.flying){u.vy-=24*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.y+=u.vy*dt;u.tilt+=u.spin*dt;\n      if(u.y<=0&&u.vy<0){u.y=0;u.flying=false;u.tilt=-Math.PI/2;u.vx*=.2;u.vz*=.2;u.deadT=Math.min(u.deadT,.4);dust(u.x,u.z,3);}}\n    else{u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.004,dt);u.vx*=f;u.vz*=f;u.tilt+=(-Math.PI/2-u.tilt)*Math.min(1,dt*10);\n      if(u.deadT>2.6){u.y-=dt*.7;if(u.y<-.8)u.active=false;}}\n    return;\n  }\n  if(u.hidden)return;\n  u.sink=lerp(u.sink,inWater(u.x,u.z)?.45:0,Math.min(1,dt*6));\n  if(u.cheer>0){u.cheer-=dt;u.y=Math.abs(Math.sin(u.cheer*9))*.35;u.moving=false;if(u.cheer<=0)u.y=0;return;}\n  if(u.air){u.vy-=24*dt;u.y+=u.vy*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.tilt=lerp(u.tilt,-.9,dt*6);\n    if(u.y<=0&&u.vy<0){u.y=0;u.air=false;u.down=.7;u.tilt=-Math.PI/2;dust(u.x,u.z,2);}return;}\n  if(u.down>0){u.down-=dt;u.tilt=-Math.PI/2;if(u.down<=0)u.rise=.4;return;}\n  if(u.rise>0){u.rise-=dt;u.tilt=-Math.PI/2*Math.max(0,u.rise/.4);return;}\n  u.cd-=dt;\n  if(u.stun>0){u.stun-=dt;u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.003,dt);u.vx*=f;u.vz*=f;u.tilt=-.45*Math.max(0,u.stun/.34);u.moving=false;return;}\n  u.tilt*=.82;\n  if(u.ai>0)u.ai-=dt;\n  const mv=(tx,tz,sp,face)=>{const ddx=tx-u.x,ddz=tz-u.z,dd=Math.hypot(ddx,ddz);if(dd<.05){u.moving=false;return true;}const s=Math.min(sp,dd/Math.max(dt,1e-4));\n    u.x+=ddx/dd*s*dt;u.z+=ddz/dd*s*dt;u.yaw=angLerp(u.yaw,face!=null?face:Math.atan2(ddx,ddz),dt*8);u.moving=s>.3;u.phase+=dt*s*2.8;return dd<.3;};\n  // 攻擊動作\n  if(u.atkT>0){\n    const prev=u.atkT;u.atkT-=dt;u.moving=false;const t=u.target;\n    if(t)u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*3);\n    if(prev>.28&&u.atkT<=.28&&!u.glinted){u.glinted=true;flash(u.x+Math.sin(u.yaw)*.9,1.7,u.z+Math.cos(u.yaw)*.9,.9,0xfff2c0,.25);}\n    if(prev>.13&&u.atkT<=.13&&t){\n      if(t===P){const d=Math.hypot(P.x-u.x,P.z-u.z);if(d<2.2){if(P.blocking&&facingTo(u.x,u.z)){snd('clang');sparks(P.x+(u.x-P.x)/d*.9,1.4,P.z+(u.z-P.z)/d*.9,10,false);u.stun=.5;u.vx=(u.x-P.x)/d*3;u.vz=(u.z-P.z)/d*3;u.atkT=0;}else hurtHero((u.keen?12:8)*FOE.dmg,u.x,u.z,3);}}\n      else if(t.alive&&Math.hypot(t.x-u.x,t.z-u.z)<2.2)hurtFoe(t,{dmg:(u.team===1?2:1)*(u.power||1),kb:2.2,src:'unit'},u.x,u.z);\n    }\n    return;\n  }\n  u.retarget-=dt;\n  switch(u.mode){\n    case 'attn':case 'hold':{u.moving=false;u.attn=u.mode==='attn';if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6){u.attn=false;mv(u.home[0],u.home[1],3.2);}else if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*4);return;}\n    case 'rush':case 'carry':case 'walkTo':{\n      u.attn=false;if(!u.dest){u.mode='attn';return;}\n      const arrived=mv(u.dest[0],u.dest[1],(u.cspd||5)*(inWater(u.x,u.z)?.45:1));\n      if(arrived||Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z)<.5){if(u.path&&u.path.length){u.dest=u.path.shift();return;}u.moving=false;const cb=u.onArrive;u.onArrive=null;u.dest=null;if(cb)cb(u);}\n      return;}\n    case 'kneel':{u.kneel=true;u.moving=false;return;}\n    case 'huddle':{u.huddle=true;u.moving=false;u.kneel=true;return;}\n    case 'rout':{u.noSpear=true;u.attn=false;const dx=u.x-P.x,dz=u.z-P.z,d=Math.hypot(dx,dz)||1;const a=Math.atan2(dx,dz)+Math.sin(clock*2.6+u.seed)*.6;\n      const sp=u.stuck?1.2:4.6;u.x+=Math.sin(a)*sp*dt;u.z+=Math.cos(a)*sp*dt;u.yaw=angLerp(u.yaw,a,dt*6);u.moving=true;u.phase+=dt*sp*2.8;if(d>60){u.active=false;u.alive=false;}return;}\n    case 'stuck':{u.moving=false;u.tilt=Math.sin(clock*3+u.seed)*.12;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*2);return;}\n    case 'wall':{u.attn=false;const W=ST.wall;if(!W)return;const tx=W.x0+(u.rank%W.cols)*W.sp,tz=W.z+Math.floor(u.rank/W.cols)*-(W.rsp||1.3);\n      const d=Math.hypot(tx-u.x,tz-u.z);if(d>.15){mv(tx,tz,W.speed||1.2,0);u.phase+=dt*2;}else{u.moving=false;u.yaw=angLerp(u.yaw,0,dt*6);}\n      if(W.active&&u.cd<=0&&Math.hypot(P.x-u.x,P.z-u.z)<2.6){u.target=P;u.atkT=.52;u.glinted=false;u.cd=rand(1.2,2.2);}\n      return;}\n    case 'desert':{u.attn=false;u.noSpear=true;mv(u.x+Math.sign(u.x||1)*2,u.z+40,4.2);if(Math.hypot(u.x-P.x,u.z-P.z)>38){u.active=false;u.alive=false;}return;}\n    case 'follow':{\n      u.attn=false;const idx=allies().indexOf(u);const [sx,sz]=slotPos(Math.max(0,idx));\n      const ds=Math.hypot(sx-u.x,sz-u.z);if(ds>.4)mv(sx,sz,clamp(2+ds*1.1,2,6.5));else{u.moving=false;u.yaw=angLerp(u.yaw,P.yaw,dt*4);}\n      // 跟隨時若敵人逼近也會還手\n      if(u.fight&&!u.officer&&u.cd<=0){const e=nearestOf(u,enemiesAlive(),2.2);if(e){u.target=e;u.atkT=.52;u.glinted=false;u.cd=rand(1.4,2.4);}}\n      return;}\n    case 'charge':{\n      u.attn=false;if(u.officer){u.mode='follow';return;}\n      if(u.retarget<=0||(u.target&&(!u.target.alive||u.target===P))){u.retarget=rand(.3,.6);u.target=nearestOf(u,enemiesAlive(),30);}\n      const t=u.target;\n      if(t){const d=Math.hypot(t.x-u.x,t.z-u.z);if(d>1.7)mv(t.x,t.z,4.6);else{u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*8);if(u.cd<=0){u.atkT=.52;u.glinted=false;u.cd=rand(1.2,2.2);}}}\n      else if(u.dest){const d=Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z);if(d>4)mv(u.dest[0],u.dest[1],4.6);else u.moving=false;}\n      else u.moving=false;\n      return;}\n    case 'routTo':{u.noSpear=true;const d=Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z);mv(u.dest[0],u.dest[1],5);if(d<1.2){u.active=false;u.alive=false;}return;}\n    case 'guard':{\n      // 守兵：主將或我軍進入警戒範圍才迎戰，否則回原位\n      if(u.ai>0){u.moving=false;return;}\n      const foes=allies();const list=P.locked?foes:foes.concat([P]);\n      const t=nearestOf(u,list,u.leash||20);\n      if(t){u.mode='fight';u.target=t;}else if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6)mv(u.home[0],u.home[1],3);else{u.moving=false;if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*3);}\n      return;}\n    default:{ // fight\n      u.attn=false;\n      if(u.ai>0){u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*3);return;}\n      if(u.retarget<=0||!u.target||(u.target!==P&&!u.target.alive)){u.retarget=rand(.3,.6);const list=allies();if(!ST.cut)list.push(P);u.target=nearestOf(u,list,60)||P;}\n      const t=u.target;const d=Math.hypot(t.x-u.x,t.z-u.z);\n      if(d>1.7)mv(t.x,t.z,(u.spd||3.7)*(inWater(u.x,u.z)?.45:1));\n      else{u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*8);if(u.cd<=0&&!u.noAtk){u.atkT=.52;u.glinted=false;u.cd=rand(1.5,2.8);}}\n    }\n  }\n}\nfunction separate(){\n  for(let i=0;i<N;i++){const a=U[i];if(!a.active||!a.alive||a.hidden||a.air)continue;\n    for(let j=i+1;j<N;j++){const b=U[j];if(!b.active||!b.alive||b.hidden||b.air)continue;\n      const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;const lim=(a.mode==='wall'&&b.mode==='wall')?.6:.85;if(d2<lim*lim&&d2>1e-6){const d=Math.sqrt(d2),p=(lim-d)*.5/d;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}}\n    const dx=a.x-P.x,dz=a.z-P.z,d2=dx*dx+dz*dz;if(d2<1.2&&d2>1e-6){const d=Math.sqrt(d2),p=(1.1-d)/d;a.x+=dx*p;a.z+=dz*p;}\n    if(!a.noClip)collideWalls(a,.4);\n    a.x=clamp(a.x,BND.x0-6,BND.x1+6);a.z=clamp(a.z,BND.z0-30,BND.z1+30);\n  }\n}\n/* ---------- 主將 ---------- */\nfunction startAttack(){\n  if(phase!=='play'||P.locked||P.mu)return;\n  if(P.clip&&CHAIN.includes(P.clip)){const c=HC[P.clip];if(c.chain&&P.ct<c.chain){P.queued=true;return;}if(P.lastAtk<3){nextAtk(P.lastAtk+1);}return;}\n  if(P.clip==='hurt'&&P.ct<200){P.queued=true;return;}\n  nextAtk(P.comboWin>0&&P.lastAtk>=0&&P.lastAtk<3?P.lastAtk+1:0);\n}\nfunction nextAtk(i){\n  P.lastAtk=i;P.queued=false;\n  let best=null,bd=6.5;for(const u of U){if(!u.active||!u.alive||u.hidden||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n  if(best)P.yaw=Math.atan2(best.x-P.x,best.z-P.z);\n  play(CHAIN[i]);snd('swing');\n}\nfunction startMusou(){\n  if(phase!=='play'||P.locked||P.mu||P.musou<100)return;\n  P.mu={ph:'gather',t:0,n:0,used:new Set(),dash:null};P.musou=100;play('mGather');\n  flash(P.x,1.6,P.z,5,0xffd27a,.5);shockRing(P.x,.15,P.z,0xffd27a,.6,.5);snd('boom');addShake(.25);\n}\nfunction updMusou(dt){\n  const M=P.mu;M.t+=dt;P.musou=Math.max(0,P.musou-dt*38);\n  if(M.ph==='gather'){\n    if(Math.random()<.8){const a=rand(0,TAU),r=rand(3,5);const i=spIdx++%SPN,d=spD[i];spPos[i*3]=P.x+Math.cos(a)*r;spPos[i*3+1]=rand(.3,2);spPos[i*3+2]=P.z+Math.sin(a)*r;\n      d.vx=-Math.cos(a)*r*2.2;d.vz=-Math.sin(a)*r*2.2;d.vy=2;d.life=d.max=.45;d.r=1;d.g=.85;d.b=.4;}\n    if(M.t>.48){M.ph='dash';M.t=0;M.dash=null;}\n    return;\n  }\n  if(M.ph==='dash'){\n    if(!M.dash){\n      let best=null,bd=11;for(const u of U){if(!u.active||!u.alive||u.hidden||M.used.has(u)||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n      let tx,tz;if(best){M.used.add(best);const a=Math.atan2(best.x-P.x,best.z-P.z);tx=best.x-Math.sin(a)*1.5;tz=best.z-Math.cos(a)*1.5;P.yaw=a;}\n      else{const a=P.yaw+(M.n%2?.9:-.9);tx=P.x+Math.sin(a)*3.5;tz=P.z+Math.cos(a)*3.5;P.yaw=a;}\n      tx=clamp(tx,BND.x0,BND.x1);tz=clamp(tz,BND.z0,BND.z1);\n      M.dash={fx:P.x,fz:P.z,tx,tz,t:0,hit:false};play(M.n%2?'mSlashB':'mSlashA');snd('swing');\n    }\n    const D=M.dash;D.t+=dt;const k=EASE.out(clamp(D.t/.085,0,1));\n    P.x=lerp(D.fx,D.tx,k);P.z=lerp(D.fz,D.tz,k);\n    if(D.t<.1&&Math.floor(D.t/.025)!==Math.floor((D.t-dt)/.025))spawnGhost();\n    if(!D.hit&&D.t>.1){D.hit=true;const n=heroHit({r:3,arc:1.6,dmg:3,kb:5,launch:7,fwd:.6});if(n){snd('hit');hitStop=.04;addShake(.12);}}\n    if(D.t>.17){M.n++;M.dash=null;if(M.n>=6){M.ph='leap';M.t=0;play('mLeap');trail.color.setHex(0xffd27a);}}\n    return;\n  }\n  if(M.ph==='leap'){\n    P.flip=-TAU*EASE.io(clamp(M.t/.5,0,1));if(Math.floor(M.t/.06)!==Math.floor((M.t-dt)/.06))spawnGhost(0xffb050);\n    if(M.t>.52){M.ph='slam';M.t=0;P.flip=0;play('mSlam');\n      heroHit({r:7.5,arc:Math.PI,dmg:6,kb:12,fly:true});\n      shockRing(P.x,.15,P.z,0xffb050,2.8,.6);shockRing(P.x,.2,P.z,0xffe6b0,1.6,.4);flash(P.x,1.5,P.z,13,0xffb060,.6);sparks(P.x,1,P.z,70,true,1.4);\n      crack.m.position.set(P.x,.05,P.z);crack.t=0;crack.m.visible=true;\n      pillars.forEach((p,i)=>{const a=i/pillars.length*TAU,r=i?rand(2.5,5.5):0;p.m.position.set(P.x+Math.cos(a)*r,0,P.z+Math.sin(a)*r);p.t=-i*.04;p.m.visible=true;});\n      dust(P.x,P.z,10,true);addShake(.8);hitStop=.12;snd('boom');}\n    return;\n  }\n  if(M.ph==='slam'&&M.t>.8){P.mu=null;P.musou=0;trail.color.setHex(0xd8f4ff);}\n}\nfunction inputVec(){\n  let x=joy.x,y=joy.y;\n  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);\n  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}\n  return [x,y];\n}\nfunction updHero(dt){\n  P.inv=Math.max(0,P.inv-dt);P.comboWin-=dt;\n  const [jx,jz]=ST.auto?ST.auto:(P.locked||phase!=='play'?[0,0]:inputVec());const mag=Math.min(1,Math.hypot(jx,jz));\n  if(P.mu)updMusou(dt);\n  // 格擋\n  if(!P.mu&&!P.locked&&blkHeld&&(!P.clip||P.clip==='guard'||P.clip==='hurt'&&P.ct>250)){if(P.clip!=='guard')play('guard');}\n  else if(P.clip==='guard'&&!blkHeld){P.clip=null;}\n  P.blocking=P.clip==='guard'&&P.ct>70;\n  // 移動\n  let speed=7*mag;\n  if(P.mu)speed=0;else if(P.clip==='guard')speed=1.4*mag;else if(P.clip&&P.clip!=='hurt')speed=0;else if(P.clip==='hurt')speed=0;\n  P.moving=speed>.4;\n  if(P.moving){P.yaw=angLerp(P.yaw,Math.atan2(jx,jz),dt*(P.clip==='guard'?4:15));P.x+=jx/mag*speed*dt;P.z+=jz/mag*speed*dt;}\n  P.speed=speed;\n  P.x+=P.kvx*dt;P.z+=P.kvz*dt;const f=Math.pow(.002,dt);P.kvx*=f;P.kvz*=f;\n  // 招式推進\n  if(P.clip){\n    P.ct+=dt*1000;const C=HC[P.clip];\n    if(C.adv&&P.ct>C.adv[0]&&P.ct-dt*1000<C.adv[1]){const a=Math.max(P.ct-dt*1000,C.adv[0]),b=Math.min(P.ct,C.adv[1]);const dist=C.adv[2]*(b-a)/(C.adv[1]-C.adv[0]);\n      let near=99;for(const u of U){if(u.active&&u.alive&&!u.hidden&&isEnemyTeam(u.team)){const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<near&&Math.abs(angDiff(P.yaw,Math.atan2(u.x-P.x,u.z-P.z)))<1)near=d;}}\n      const k=near<1.5?.15:1;P.x+=Math.sin(P.yaw)*dist*k;P.z+=Math.cos(P.yaw)*dist*k;}\n    if(C.hit&&!P.hitDone&&P.ct>=C.hit[0]){P.hitDone=true;const h=C.hit[1];const n=heroHit(h);\n      if(n){snd('hit');hitStop=P.clip==='c4'?.08:.04;addShake(P.clip==='c4'?.35:.12);}}\n    if(C.slam&&!P.slamDone&&P.ct>=C.slam){P.slamDone=true;const fx=P.x+Math.sin(P.yaw)*1.9,fz=P.z+Math.cos(P.yaw)*1.9;\n      shockRing(fx,.12,fz,0xffe6b0,1.25,.4);dust(fx,fz,7,true);flash(fx,.6,fz,4,0xffc070,.3);sparks(fx,.4,fz,24,true);snd('boom');addShake(.25);}\n    if(CHAIN.includes(P.clip)){\n      if((P.queued||atkHeld)&&C.chain&&P.ct>=C.chain&&P.lastAtk<3){nextAtk(P.lastAtk+1);}\n    }\n    if(P.clip==='hurt'&&P.queued&&P.ct>=200){P.clip=null;nextAtk(0);}\n    const last=C.k[C.k.length-1][0];\n    if(P.clip&&!C.hold&&P.ct>=last){if(CHAIN.includes(P.clip)){P.comboWin=.3;if(P.lastAtk>=3)P.lastAtk=-1;}P.clip=null;}\n  }\n  // 範圍\n  collideWalls(P,.6);P.x=clamp(P.x,BND.x0,BND.x1);P.z=clamp(P.z,BND.z0,BND.z1);\n  P.vzN=lerp(P.vzN,(P.lastZ-P.z)/Math.max(dt,1e-4),Math.min(1,dt*10));P.lastZ=P.z;\n}\nconst vA=new THREE.Vector3(),vB=new THREE.Vector3();\nfunction poseHero(dt){\n  let p;\n  if(P.clip){p=evalClip(HC[P.clip],P.ct);}\n  else{\n    P.runW=lerp(P.runW,P.speed>.4?Math.min(1,P.speed/5):0,Math.min(1,dt*10));\n    const prevS=Math.sin(P.phase);P.phase+=dt*(4+P.speed*1.25);const s=Math.sin(P.phase);\n    if(P.runW>.5&&Math.sign(s)!==Math.sign(prevS)){puff(P.x+rand(-.3,.3),.2,P.z+rand(-.3,.3),.4,1.2,.5,.4,0,.6,0);}\n    const br=Math.sin(clock*1.8);const idle=Object.assign({},PD,{gy:PD.gy+br*.015,ux:PD.ux+br*.02,y:br*.01});\n    const run=Object.assign({},PD,POSE.run,{lL:s*.95,lR:-s*.95,y:Math.abs(Math.cos(P.phase))*.1,uy:POSE.run.uy+s*.15,uz:s*.05});\n    const target=lerpPose(idle,run,P.runW);\n    p=lerpPose(P.pose,target,Math.min(1,dt*16));\n  }\n  P.pose=p;\n  H.root.position.set(P.x,0,P.z);H.root.rotation.y=P.yaw;\n  H.body.position.y=(pv(p,'y')-pv(p,'cr')*.3)*S;\n  H.body.rotation.set(pv(p,'bx')+P.flip,pv(p,'by'),0);\n  H.upper.rotation.set(pv(p,'ux' h2));});}\n}\n\n/* ---------- 二、破釜沉舟（鉅鹿之戰） ---------- */\nlet CH2=null;\nfunction startCh2(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=2;ST.step='camp';ST.t=0;ST.showQi=false;setMorale(.6);updProg();\n  BND={x0:CH2X-8,x1:CH2X+24,z0:-90,z1:22};\n  placeHero(CH2X,0,Math.PI);\n  const A=spawnAllies(9,CH2X,4,Math.PI,'hold','chu',14);if(A[0])attachFlag(A[0],BMAT.chu);\n  const off=spawnOfficer(CH2X+3.2,-1,Math.PI);off.mode='attn';off.home=[CH2X+3.2,-1];off.faceYaw=Math.PI;\n  CH2=CUR={allies:A,officer:off,commit:null,t0:0,spawned:false,won:false,lost:false,look:false,fl:0,fleeMsg:false,ws:0,ended:false};\n  ST.cut=true;P.locked=true;focus(CH2X-6,-2,1.2,24,40);\n  chapterTitle('二　破釜沉舟','鉅鹿之戰・《史記・項羽本紀》');\n  setCap('項羽率楚軍渡過漳河，去救被秦將王離圍住的鉅鹿。遠處諸侯的營壘，莫敢縱兵。');\n  later.add(3.2,()=>bubble(off,'船還在，留條退路吧。',2.4));\n  later.add(5.4,()=>askChoice('渡河之後','船隻、釜甑、營舍都還在。部將說：「留著船，萬一戰事不利，還能退回河北。」',[\n    {t:'沉船、破釜甑、燒廬舍，持三日糧',fn:()=>burn2(true)},{t:'留下船隻，以備退路',fn:()=>burn2(false)}]));\n}\nfunction burn2(c){const C=CH2;C.commit=c;ST.step='ready';\n  if(c){showOrder('皆沉船，破釜甑，燒廬舍，持三日糧。','以示士卒必死，無一還心');setMorale(1);\n    BOATS.forEach((b,i)=>later.add(.4+i*.3,()=>{b.sinkT=0;snd('boom');sparks(b.x,.6,b.z,10,false);}));\n    POTS.forEach((p,i)=>later.add(1+i*.25,()=>{p.broken=true;snd('hit');sparks(p.x,1,p.z,8,false);flash(p.x,1,p.z,1.4,0xfff0c0,.2);}));\n    HUTS.forEach((h,i)=>later.add(1.6+i*.35,()=>{h.burn=.01;snd('boom');}));\n    C.allies.forEach((a,i)=>{later.add(1.8+i*.25,()=>bubble(a,['有進無退！','不破秦軍，誓不還！','死戰！','無一還心！'][i%4],2));boost(a,3);});\n    later.add(4.6,()=>{focus(null);ST.cut=false;P.locked=false;setCap('船沉了，釜破了，營舍燒了——只剩三日糧。按「令」進擊秦軍。');setOrder('進擊',fight2,'令');});}\n  else{showOrder('留船以備退路。','戰事不利，還可退回河北');setMorale(.45);harden();\n    C.allies.forEach((a,i)=>later.add(.8+i*.35,()=>bubble(a,['還好有船……','打不過就退','先看看再說'][i%3],2)));\n    later.add(3.6,()=>{focus(null);ST.cut=false;P.locked=false;setCap('船都還泊在河邊。按「令」進擊秦軍。');setOrder('進擊',fight2,'令');});}\n}\nfuncti 1>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>《孫子・計篇》</span></p>\n    <p>這一關看的是<b>軍令怎麼立起來</b>：號令不聽的時候怎麼辦、違令的是權貴怎麼辦、違令的是自己又怎麼辦。</p>\n    <p>左上的「<b>軍紀</b>」是全軍聽令的程度。右下出現藍色的「<b>令</b>」時按下，號令就會傳下去——部下聽不聽，要看你前面怎麼做。</p>\n    <ul class=\"keys\">\n      <li><b>移動</b>　左半邊螢幕拖曳 <kbd>WASD</kbd></li>\n      <li><b>攻</b>　連按四段 <kbd>J</kbd></li>\n      <li><b>擋</b>　按住格擋 <kbd>K</kbd></li>\n      <li><b>令</b>　出現時按下 <kbd>O</kbd></li>\n      <li><b>無雙</b>　氣滿後按下 <kbd>L</kbd></li>\n    </ul>\n    <p id=\"glWarn\" hidden style=\"color:#ff8a66;font-weight:700\"></p>\n    <button type=\"button\" class=\"cta\" id=\"bStart\">出兵</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu\">回目錄</button>\n    <p class=\"hint port\">手機橫放，戰場看得比較廣。</p>\n  </div>\n</div>\n\n<div class=\"over\" id=\"book\" hidden>\n  <div class=\"card\">\n    <h2>兵書</h2>\n    <ol class=\"lines\">\n      <li><b>將者，智、信、仁、勇、嚴也。</b><span>〈計篇〉做將領要具備的五種德行，嚴排第五。</span></li>\n      <li><b>嚴者，以威刑肅三軍也。</b><span>杜牧注〈計篇〉：嚴，是用威信和刑罰讓全軍整肅。</span></li>\n      <li><b>約束不明，申令不熟，將之罪也；既已明而不如法者，吏士之罪也。</b><span>《史記・孫子吳起列傳》孫武語：號令沒講清楚是將領的錯；講清楚了還不照做，就是士卒和軍官的錯。</span></li>\n      <li><b>卒未親附而罰之，則不服；卒已親附而罰不行，則不可用也。故令之以文，齊之以武。</b><span>〈行軍〉先讓士卒親附，再用刑罰整齊他們；恩與威要一起用。</span></li>\n      <li><b>令素行以教其民，則民服；令不素行以教其民，則民不服。</b><span>〈行軍〉平時就貫徹的命令，士卒才會服。</span></li>\n      <li><b>厚而不能使，愛而不能令，亂而不能治，譬若驕子，不可用也。</b><span>〈地形〉只愛不管，兵就像寵壞的孩子：嚴是仁的另一面。</span></li>\n      <li><b>佯北勿從。</b><span>〈軍爭〉敵人假裝敗退，不要追——追不追，要看軍令管不管得住。</span></li>\n    </ol>\n    <h3>史料</h3>\n    <ol class=\"lines\">\n      <li id=\"src-1\"><b>孫武練女兵</b><span>《史記・孫子吳起列傳》：闔廬曰：「可試以婦人乎？」……約束既布，乃設鈇鉞，即三令五申之。於是鼓之右，婦人大笑。孫子曰：「約束不明，申令不熟，將之罪也。」復三令五申而鼓之左，婦人復大笑。孫子曰：「……既已明而不如法者，吏士之罪也。」乃欲斬左右隊長。吳王……曰：「寡人非此二姬，食不甘味，願勿斬也。」孫子曰：「臣既已受命為將，將在軍，君命有所不受。」遂斬隊長二人以徇。……婦人左右前後跪起皆中規矩繩墨，無敢出聲。</span></li>\n      <li id=\"src-2\"><b>穰苴斬莊賈</b><span>《史記・司馬穰苴列傳》：穰苴與莊賈約曰：「旦日日中會於軍門。」穰苴先馳至軍，立表下漏待賈。賈……親戚左右送之，留飲。日中而賈不至。穰苴則仆表決漏……召軍正問曰：「軍法期而後至者云何？」對曰：「當斬。」……遂斬莊賈以徇三軍。……景公遣使者持節赦賈，馳入軍中。穰苴曰：「將在軍，君令有所不受。」……士卒次舍、井灶、飲食、問疾、醫藥，身自拊循之。……病者皆求行，爭奮出為之赴戰。晉師聞之，為罷去；燕師聞之，渡水而解。</span></li>\n      <li id=\"src-3\"><b>曹操割髮代首</b><span>《三國志・武帝紀》裴注引《曹瞞傳》：常出軍，行經麥中，令「士卒無敗麥，犯者死」。騎士皆下馬，付麥以相持。於是太祖馬騰入麥中，敕主簿議罪；主簿對以《春秋》之義，罰不加於尊。太祖曰：「制法而自犯之，何以帥下？然孤為軍帥，不可自殺，請自刑。」因援劍割髮以置地。</span></li>\n    </ol>\n    <button type=\"button\" class=\"cta\" id=\"bBookClose\">回到戰場</button>\n  </div>\n</div>\n\n<div class=\"over choice\" id=\"choice\" hidden>\n  <div class=\"card\">\n    <p class=\"kicker\" id=\"chK\"></p>\n    <p id=\"chQ\" style=\"font-size:17px\"></p>\n    <div class=\"row\" id=\"chBtns\"></div>\n  </div>\n</div>\n\n<div class=\"over\" id=\"end\" hidden>\n  <div class=\"card wide\">\n    <p class=\"kicker\">關卡結算</p>\n    <h2>嚴・三次抉擇　<span id=\"endScore\"></span></h2>\n    <div class=\"stats\"><div><small>擊破</small><b id=\"eKills\">0</b></div><div><small>最大連擊</small><b id=\"eCombo\">0</b></div><div><small>用時</small><b id=\"eTime\">0:00</b></div></div>\n    <div class=\"tw\"><table><thead><tr><th></th><th>情境</th><th>你怎麼做</th><th>結果</th><th>兵書怎麼說</th></tr></thead><tbody id=\"endRows\"></tbody></table></div>\n    <h3>什麼是「嚴」</h3>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>〈計篇〉</span></p>\n    <p class=\"q\">「嚴者，以威刑肅三軍也。」<span>杜牧注〈計篇〉</span></p>\n    <p class=\"q\">「令之以文，齊之以武，是謂必取。」<span>〈行軍〉</span></p>\n    <p class=\"q\">「制法而自犯之，何以帥下？」<span>《曹瞞傳》</span></p>\n    <p>這一關的三次抉擇，就是「嚴」：號令講清楚了還不聽，就要動刑，哪怕違令的是君王的寵姬（<b>既已明而不如法者，吏士之罪也</b>）；違令的是君王派來的監軍，也照軍法辦，君令有所不受（<b>以威刑肅三軍</b>）；自己犯了法，也要自刑示眾（<b>制法而自犯之，何以帥下</b>）。嚴不是嚴苛，而是讓「令」真的能行：令行了，部下才會在該停的時候停住、該衝的時候一起衝——這就回到了五德的第一個字，智。</p>\n    <button type=\"button\" class=\"cta\" id=\"bAgain\">再打一次</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu2\">回目錄</button>\n  </div>\n</div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=Math.PI*2;\nconst rand=(a,b)=>a+Math.random()*(b-a);\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};\nconst angLerp=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);\nconst EASE={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,snap:t=>1-Math.pow(1-t,4),sine:t=>.5-.5*Math.cos(Math.PI*t)};\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ================= 渲染器與場景 ================= */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\nfunction glNotice(t){const el=document.getElementById('cap');if(el){el.hidden=false;el.textContent=t;}const w=document.getElementById('glWarn');if(w){w.hidden=false;w.textContent=t;}}\ncanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glNotice('畫面資源被手機系統回收了（開太多頁面）。請關閉其他分頁後重新整理這一頁。');},false);\ncanvas.addEventListener('webglcontextrestored',()=>{try{renderer.resetState();}catch(e){}},false);\nif(!renderer.getContext())glNotice('這個瀏覽器無法建立立體畫面，請改用 Safari 或 Chrome 重新開啟。');\nconst scene=new THREE.Scene();\nconst HORIZON=0xe2a46a;\nscene.background=new THREE.Color(HORIZON);\nscene.fog=new THREE.Fog(HORIZON,70,200);\nconst camera=new THREE.PerspectiveCamera(50,1,.4,400);\nlet portrait=false;\nlet sky;\n{\n  const g=new THREE.SphereGeometry(260,24,14),p=g.attributes.position,cols=[];\n  const top=new THREE.Color(0x56577f),hor=new THREE.Color(HORIZON),low=new THREE.Color(0xb98058),c=new THREE.Color();\n  for(let i=0;i<p.count;i++){const y=p.getY(i)/260;if(y>=0)c.copy(hor).lerp(top,Math.pow(y,.55));else c.copy(hor).lerp(low,Math.min(1,-y*3));cols.push(c.r,c.g,c.b);}\n  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));\n  sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));\n  scene.add(sky);\n}\nconst hemi=new THREE.HemisphereLight(0xffe6c4,0x6a5040,.8);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(0xffcf98,.95);sun.position.set(-30,45,22);scene.add(sun);\nconst matCache={};\nconst lam=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));\nfunction block(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(BOX,lam(c));m.scale.set(w,h,d);m.position.set(x,y,z);(parent||scene).add(m);return m;}\nconst BOX=new THREE.BoxGeometry(1,1,1);\nfunction noiseTex(base,amt,size,dots){\n  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');\n  g.fillStyle=base;g.fillRect(0,0,size,size);\n  for(let i=0;i<dots;i++){const v=Math.random()-.5,s=Math.random()<.15?4:2;g.fillStyle=v>0?`rgba(255,236,200,${v*amt})`:`rgba(40,22,10,${-v*amt})`;g.fillRect(Math.random()*size|0,Math.random()*size|0,s,s);}\n  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t;\n}\nfunction flashTexLater(){return flashTexLater.t||(flashTexLater.t=radialTex([[0,'rgba(255,255,240,1)'],[.25,'rgba(255,214,120,.9)'],[.55,'rgba(255,120,40,.35)'],[1,'rgba(255,80,20,0)']]));}\nfunction radialTex(stops){\n  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');\n  const gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,128,128);\n  return new THREE.CanvasTexture(c);\n}\n\nconst m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),e4=new THREE.Euler(),p4=new THREE.Vector3(),s4=new THREE.Vector3();\nfunction scatter(list,colors,geo){\n  const im=new THREE.InstancedMesh(geo||BOX,new THREE.MeshLambertMaterial({color:0xffffff}),list.length);\n  const c=new THREE.Color();\n  list.forEach((o,i)=>{e4.set(o.rx||0,o.ry||0,o.rz||0);q4.setFromEuler(e4);p4.set(o.x,o.y,o.z);s4.set(o.sx,o.sy,o.sz);m4.compose(p4,q4,s4);im.setMatrixAt(i,m4);\n    c.setHex(o.c!=null?o.c:colors[i%colors.length]);c.offsetHSL(0,0,rand(-.04,.04));im.setColorAt(i,c);});\n  scene.add(im);return im;\n}\n/* ================= 吳宮教場、齊軍軍門、麥田：三片戰場 ================= */\nconst CH1X=0,CH2X=190,CH3X=380;\nconst LINE3=-30;                                // 第三段：追擊的界線（令：勿追）\nconst ARCHER_SPOTS=[];\nfunction halfW(z){return 80;}\nlet beaconFire=null;\nconst REED={flat:0,revealed:false};function updReeds(){}\nconst WALLS=[];\nfunction wallBox(x0,x1,z0,z1,h,c,y0){const m=block(x1-x0,h,z1-z0,c,(x0+x1)/2,(y0||0)+h/2,(z0+z1)/2);WALLS.push({x0,x1,z0,z1});return m;}\nfunction collideWalls(o,r){\n  for(const w of WALLS){\n    if(o.x<w.x0-r||o.x>w.x1+r||o.z<w.z0-r||o.z>w.z1+r)continue;\n    const dx0=o.x-(w.x0-r),dx1=(w.x1+r)-o.x,dz0=o.z-(w.z0-r),dz1=(w.z1+r)-o.z;\n    const m=Math.min(dx0,dx1,dz0,dz1);\n    if(m===dx0)o.x=w.x0-r;else if(m===dx1)o.x=w.x1+r;else if(m===dz0)o.z=w.z0-r;else o.z=w.z1+r;\n  }\n}\nlet BND={x0:-40,x1:40,z0:-110,z1:40};\nfunction textPlane(txt,w,h,bg,fg,fs){\n  const c=document.createElement('canvas');c.width=256;c.height=Math.round(256*h/w);const g=c.getContext('2d');\n  g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.strokeStyle=fg;g.lineWidth=6;g.strokeRect(8,8,c.width-16,c.height-16);\n  g.fillStyle=fg;g.font='900 '+(fs||120)+'px \"Noto Serif TC\",\"Songti TC\",\"PMingLiU\",serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,c.width/2,c.height/2+6);\n  const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshLambertMaterial({map:t,side:THREE.DoubleSide}));return m;\n}\nconst PM=new THREE.Matrix4(),CM=new THREE.Matrix4();\nfunction instParts(parts,places){\n  if(!places.length)return;const col=new THREE.Color();\n  for(const pt of parts){\n    const im=new THREE.InstancedMesh(pt.geo||BOX,new THREE.MeshLambertMaterial({color:0xffffff}),places.length);\n    places.forEach((pl,i)=>{\n      e4.set(0,pl.ry||0,0);q4.setFromEuler(e4);p4.set(pl.x,pl.y||0,pl.z);s4.setScalar(pl.s||1);PM.compose(p4,q4,s4);\n      e4.set(pt.rx||0,pt.ry||0,pt.rz||0);q4.setFromEuler(e4);p4.set(pt.x||0,pt.y||0,pt.z||0);s4.set(pt.w,pt.h,pt.d);CM.c ency.value=1250;p2.Q.value=1.8;p2.gain.value=4;\n    const p3=AC.createBiquadFilter();p3.type='peaking';p3.frequency.value=3200;p3.Q.value=1.2;p3.gain.value=3;\n    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;\n    hp.connect(p1).connect(p2).connect(p3).connect(lp);const out=AC.createGain();out.gain.value=.9;lp.connect(out);out.connect(master);const rg=AC.createGain();rg.gain.value=.35;out.connect(rg).connect(rev);\n    pipaBody={inp:hp};return pipaBody;}\n  // 琵琶單撥：撥片擦弦的短促雜音 + 弦；bend=推拉（起音時音高微降）\n  function pluck(f,t,v,dur,bend){const s=AC.createBufferSource();s.buffer=ksBuffer(f,'pipa');\n    s.playbackRate.setValueAtTime(bend?1.03:1.012,t);s.playbackRate.exponentialRampToValueAtTime(1,t+(bend?.12:.03));\n    const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+Math.max(.05,dur));g.gain.exponentialRampToValueAtTime(.001,t+Math.max(.05,dur)+.5);\n    s.connect(g).connect(pipaChain().inp);s.start(t);s.stop(t+dur+.55);\n    const n=AC.createBufferSource();n.buffer=noiseBuf;const nb=AC.createBiquadFilter();nb.type='bandpass';nb.frequency.value=4200;nb.Q.value=.9;const ng=AC.createGain();ng.gain.setValueAtTime(v*.45,t);ng.gain.exponentialRampToValueAtTime(.001,t+.012);n.connect(nb).connect(ng).connect(pipaChain().inp);n.start(t);n.stop(t+.02);}\n  // 輪指：長音用快速連撥，音量先漲後落\n  function lun(f,t,v,dur){const rate=13;const n=Math.max(2,Math.floor(dur*rate));for(let i=0;i<n;i++){const k=i/n;const env=Math.sin(Math.PI*Math.min(1,k*1.2+.15));pluck(f,t+i/rate,v*(.45+.55*env)*(i%2?.8:1),.18,false);}}\n  // 掃弦：四條弦（四度、五度音）急掃；up=由低到高\n  function sweep(deg,t,v,up){const degs=[deg-7,deg-5,deg-2,deg];(up?degs:degs.slice().reverse()).forEach((d,i)=>pluck(F(d,0),t+i*.028,v*(i===3?1:.75),.35,false));}\n  // 彈挑快速音型（武曲）\n  function tanTiao(deg,t,v,dt16){[0,2,4,2].forEach((d,i)=>pluck(F(deg+d,0),t+i*dt16/2,v*(i?.7:1),.12,false));}\n  // 古琴低音、簫\n  function qin(f,t,v,dur){const s=AC.createBufferSource();s.buffer=ksBuffer(f,'qin');const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+dur);g.gain.exponentialRampToValueAtTime(.001,t+dur+1.2);\n    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(3600,f*5);s.connect(lp).connect(g);g.connect(master);g.connect(rev);s.start(t);s.stop(t+dur+1.3);}\n  function xiao(f,t,dur,v){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*.985,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);\n    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=4.6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.006,t+.5);lfo.connect(lg).connect(o.frequency);\n    const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=6;const ng=AC.createGain();ng.gain.setValueAtTime(v*.4,t);ng.gain.exponentialRampToValueAtTime(v*.1,t+.25);ng.gain.setValueAtTime(v*.1,t+dur);ng.gain.exponentialRampToValueAtTime(.0001,t+dur+.1);\n    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.18);g.gain.setValueAtTime(v,t+Math.max(.2,dur-.12));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);\n    o.connect(g);n.connect(bp).connect(ng).connect(g);g.connect(master);g.connect(rev);lfo.start(t);o.start(t);n.start(t);o.stop(t+dur+.15);n.stop(t+dur+.15);lfo.stop(t+dur+.15);}\n  // 鑼鼓\n  function drum(kind,t,v){\n    if(kind==='ban'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(900,t+.03);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.045);o.connect(g).connect(master);o.start(t);o.stop(t+.05);return;}\n    if(kind==='bo'){const n=AC.createBufferSource();n.buffer=noiseBuf;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=4200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);n.connect(hp).connect(g).conn ('hurt').animate([{opacity:dmg>15?1:.55},{opacity:0}],{duration:dmg>15?600:320});\n  addShake(dmg>15?.45:.12);snd('hurt');\n  if(kb){let dx=P.x-fx,dz=P.z-fz;const d=Math.hypot(dx,dz)||1;P.kvx=dx/d*kb;P.kvz=dz/d*kb;}\n  if(!P.clip||P.clip==='guard'||P.clip==='hurt'||CHAIN.indexOf(P.clip)<2)play('hurt');\n  return true;\n}\nfunction facingTo(x,z,lim){return Math.abs(angDiff(P.yaw,Math.atan2(x-P.x,z-P.z)))<(lim||1.25);}\nfunction nearestOf(u,list,maxD){let best=null,bd=maxD;for(const t of list){if(t===u)continue;const d=Math.hypot(t.x-u.x,t.z-u.z);if(d<bd){bd=d;best=t;}}return best;}\nfunction slotPos(k){const row=(k/4)|0,col=k%4,back=2.6+row*1.5,side=(col-1.5)*1.5,s=Math.sin(P.yaw),c=Math.cos(P.yaw);return [P.x-s*back+c*side,P.z-c*back-s*side];}\n\nfunction updFoe(u,dt){\n  if(!u.active)return;\n  if(!u.alive){\n    u.deadT+=dt;\n    if(u.flying){u.vy-=24*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.y+=u.vy*dt;u.tilt+=u.spin*dt;\n      if(u.y<=0&&u.vy<0){u.y=0;u.flying=false;u.tilt=-Math.PI/2;u.vx*=.2;u.vz*=.2;u.deadT=Math.min(u.deadT,.4);dust(u.x,u.z,3);}}\n    else{u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.004,dt);u.vx*=f;u.vz*=f;u.tilt+=(-Math.PI/2-u.tilt)*Math.min(1,dt*10);\n      if(u.deadT>2.6){u.y-=dt*.7;if(u.y<-.8)u.active=false;}}\n    return;\n  }\n  if(u.hidden)return;\n  u.sink=lerp(u.sink,inWater(u.x,u.z)?.45:0,Math.min(1,dt*6));\n  if(u.cheer>0){u.cheer-=dt;u.y=Math.abs(Math.sin(u.cheer*9))*.35;u.moving=false;if(u.cheer<=0)u.y=0;return;}\n  if(u.air){u.vy-=24*dt;u.y+=u.vy*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.tilt=lerp(u.tilt,-.9,dt*6);\n    if(u.y<=0&&u.vy<0){u.y=0;u.air=false;u.down=.7;u.tilt=-Math.PI/2;dust(u.x,u.z,2);}return;}\n  if(u.down>0){u.down-=dt;u.tilt=-Math.PI/2;if(u.down<=0)u.rise=.4;return;}\n  if(u.rise>0){u.rise-=dt;u.tilt=-Math.PI/2*Math.max(0,u.rise/.4);return;}\n  u.cd-=dt;\n  if(u.stun>0){u.stun-=dt;u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.003,dt);u.vx*=f;u.vz*=f;u.tilt=-.45*Math.max(0,u.stun/.34);u.moving=false;return;}\n  u.tilt*=.82;\n  if(u.ai>0)u.ai-=dt;\n  const mv=(tx,tz,sp,face)=>{const ddx=tx-u.x,ddz=tz-u.z,dd=Math.hypot(ddx,ddz);if(dd<.05){u.moving=false;return true;}const s=Math.min(sp,dd/Math.max(dt,1e-4));\n    u.x+=ddx/dd*s*dt;u.z+=ddz/dd*s*dt;u.yaw=angLerp(u.yaw,face!=null?face:Math.atan2(ddx,ddz),dt*8);u.moving=s>.3;u.phase+=dt*s*2.8;return dd<.3;};\n  // 攻擊動作\n  if(u.atkT>0){\n    const prev=u.atkT;u.atkT-=dt;u.moving=false;const t=u.target;\n    if(t)u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*3);\n    if(prev>.28&&u.atkT<=.28&&!u.glinted){u.glinted=true;flash(u.x+Math.sin(u.yaw)*.9,1.7,u.z+Math.cos(u.yaw)*.9,.9,0xfff2c0,.25);}\n    if(prev>.13&&u.atkT<=.13&&t){\n      if(t===P){const d=Math.hypot(P.x-u.x,P.z-u.z);if(d<2.2){if(P.blocking&&facingTo(u.x,u.z)){snd('clang');sparks(P.x+(u.x-P.x)/d*.9,1.4,P.z+(u.z-P.z)/d*.9,10,false);u.stun=.5;u.vx=(u.x-P.x)/d*3;u.vz=(u.z-P.z)/d*3;u.atkT=0;}else hurtHero((u.keen?12:8)*FOE.dmg,u.x,u.z,3);}}\n      else if(t.alive&&Math.hypot(t.x-u.x,t.z-u.z)<2.2)hurtFoe(t,{dmg:(u.team===1?2:1)*(u.power||1),kb:2.2,src:'unit'},u.x,u.z);\n    }\n    return;\n  }\n  u.retarget-=dt;\n  switch(u.mode){\n    case 'attn':case 'hold':{u.moving=false;u.attn=u.mode==='attn';if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6){u.attn=false;mv(u.home[0],u.home[1],3.2);}else if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*4);return;}\n    case 'rush':case 'carry':case 'walkTo':{\n      u.attn=false;if(!u.dest){u.mode='attn';return;}\n      const arrived=mv(u.dest[0],u.dest[1],(u.cspd||5)*(inWater(u.x,u.z)?.45:1));\n      if(arrived||Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z)<.5){if(u.path&&u.path.length){u.dest=u.path.shift();return;}u.moving=false;const cb=u.onArrive;u.onArrive=null;u.dest=null;if(cb)cb(u);}\n      return;}\n    case 'kneel':{u.kneel=true;u.moving=false;return;}\n    case 'huddle':{u.huddle=true;u.moving=false;u.kneel=true;return;}\n    case 'rout':{u.noSpear=true;u.attn=false;const dx=u.x-P.x,dz=u.z-P.z,d=Math.hypot(dx,dz)||1;const a=Math.atan2(dx,dz)+Math.sin(clock*2.6+u.seed)*.6;\n      const sp=u.stuck?1.2:4.6;u.x+=Math.sin(a)*sp*dt;u.z+=Math.cos(a)*sp*dt;u.yaw=angLerp(u.yaw,a,dt*6);u.moving=true;u.phase+=dt*sp*2.8;if(d>60){u.active=false;u.alive=false;}return;}\n    case 'stuck':{u.moving=false;u.tilt=Math.sin(clock*3+u.seed)*.12;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*2);return;}\n    case 'wall':{u.attn=false;const W=ST.wall;if(!W)return;const tx=W.x0+(u.rank%W.cols)*W.sp,tz=W.z+Math.floor(u.rank/W.cols)*-(W.rsp||1.3);\n      const d=Math.hypot(tx-u.x,tz-u.z);if(d>.15){mv(tx,tz,W.speed||1.2,0);u.phase+=dt*2;}else{u.moving=false;u.yaw=angLerp(u.yaw,0,dt*6);}\n      if(W.active&&u.cd<=0&&Math.hypot(P.x-u.x,P.z-u.z)<2.6){u.target=P;u.atkT=.52;u.glinted=false;u.cd=rand(1.2,2.2);}\n      return;}\n    case 'desert':{u.attn=false;u.noSpear=true;mv(u.x+Math.sign(u.x||1)*2,u.z+40,4.2);if(Math.hypot(u.x-P.x,u.z-P.z)>38){u.active=false;u.alive=false;}return;}\n    case 'follow':{\n      u.attn=false;const idx=allies().indexOf(u);const [sx,sz]=slotPos(Math.max(0,idx));\n      const ds=Math.hypot(sx-u.x,sz-u.z);if(ds>.4)mv(sx,sz,clamp(2+ds*1.1,2,6.5));else{u.moving=false;u.yaw=angLerp(u.yaw,P.yaw,dt*4);}\n      // 跟隨時若敵人逼近也會還手\n      if(u.fight&&!u.officer&&u.cd<=0){const e=nearestOf(u,enemiesAlive(),2.2);if(e){u.target=e;u.atkT=.52;u.glinted=false;u.cd=rand(1.4,2.4);}}\n      return;}\n    case 'charge':{\n      u.attn=false;if(u.officer){u.mode='follow';return;}\n      if(u.retarget<=0||(u.target&&(!u.target.alive||u.target===P))){u.retarget=rand(.3,.6);u.target=nearestOf(u,enemiesAlive(),30);}\n      const t=u.target;\n      if(t){const d=Math.hypot(t.x-u.x,t.z-u.z);if(d>1.7)mv(t.x,t.z,4.6);else{u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*8);if(u.cd<=0){u.atkT=.52;u.glinted=false;u.cd=rand(1.2,2.2);}}}\n      else if(u.dest){const d=Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z);if(d>4)mv(u.dest[0],u.dest[1],4.6);else u.moving=false;}\n      else u.moving=false;\n      return;}\n    case 'routTo':{u.noSpear=true;const d=Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z);mv(u.dest[0],u.dest[1],5);if(d<1.2){u.active=false;u.alive=false;}return;}\n    case 'guard':{\n      // 守兵：主將或我軍進入警戒範圍才迎戰，否則回原位\n      if(u.ai>0){u.moving=false;return;}\n      const foes=allies();const list=P.locked?foes:foes.concat([P]);\n      const t=nearestOf(u,list,u.leash||20);\n      if(t){u.mode='fight';u.target=t;}else if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6)mv(u.home[0],u.home[1],3);else{u.moving=false;if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*3);}\n      return;}\n    default:{ // fight\n      u.attn=false;\n      if(u.ai>0){u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*3);return;}\n      if(u.retarget<=0||!u.target||(u.target!==P&&!u.target.alive)){u.retarget=rand(.3,.6);const list=allies();if(!ST.cut)list.push(P);u.target=nearestOf(u,list,60)||P;}\n      const t=u.target;const d=Math.hypot(t.x-u.x,t.z-u.z);\n      if(d>1.7)mv(t.x,t.z,(u.spd||3.7)*(inWater(u.x,u.z)?.45:1));\n      else{u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*8);if(u.cd<=0&&!u.noAtk){u.atkT=.52;u.glinted=false;u.cd=rand(1.5,2.8);}}\n    }\n  }\n}\nfunction separate(){\n  for(let i=0;i<N;i++){const a=U[i];if(!a.active||!a.alive||a.hidden||a.air)continue;\n    for(let j=i+1;j<N;j++){const b=U[j];if(!b.active||!b.alive||b.hidden||b.air)continue;\n      const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;const lim=(a.mode==='wall'&&b.mode==='wall')?.6:.85;if(d2<lim*lim&&d2>1e-6){const d=Math.sqrt(d2),p=(lim-d)*.5/d;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}}\n    const dx=a.x-P.x,dz=a.z-P.z,d2=dx*dx+dz*dz;if(d2<1.2&&d2>1e-6){const d=Math.sqrt(d2),p=(1.1-d)/d;a.x+=dx*p;a.z+=dz*p;}\n    if(!a.noClip)collideWalls(a,.4);\n    a.x=clamp(a.x,BND.x0-6,BND.x1+6);a.z=clamp(a.z,BND.z0-30,BND.z1+30);\n  }\n}\n/* ---------- 主將 ---------- */\nfunction startAttack(){\n  if(phase!=='play'||P.locked||P.mu)return;\n  if(P.clip&&CHAIN.includes(P.clip)){const c=HC[P.clip];if(c.chain&&P.ct<c.chain){P.queued=true;return;}if(P.lastAtk<3){nextAtk(P.lastAtk+1);}return;}\n  if(P.clip==='hurt'&&P.ct<200){P.queued=true;return;}\n  nextAtk(P.comboWin>0&&P.lastAtk>=0&&P.lastAtk<3?P.lastAtk+1:0);\n}\nfunction nextAtk(i){\n  P.lastAtk=i;P.queued=false;\n  let best=null,bd=6.5;for(const u of U){if(!u.active||!u.alive||u.hidden||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n  if(best)P.yaw=Math.atan2(best.x-P.x,best.z-P.z);\n  play(CHAIN[i]);snd('swing');\n}\nfunction startMusou(){\n  if(phase!=='play'||P.locked||P.mu||P.musou<100)return;\n  P.mu={ph:'gather',t:0,n:0,used:new Set(),dash:null};P.musou=100;play('mGather');\n  flash(P.x,1.6,P.z,5,0xffd27a,.5);shockRing(P.x,.15,P.z,0xffd27a,.6,.5);snd('boom');addShake(.25);\n}\nfunction updMusou(dt){\n  const M=P.mu;M.t+=dt;P.musou=Math.max(0,P.musou-dt*38);\n  if(M.ph==='gather'){\n    if(Math.random()<.8){const a=rand(0,TAU),r=rand(3,5);const i=spIdx++%SPN,d=spD[i];spPos[i*3]=P.x+Math.cos(a)*r;spPos[i*3+1]=rand(.3,2);spPos[i*3+2]=P.z+Math.sin(a)*r;\n      d.vx=-Math.cos(a)*r*2.2;d.vz=-Math.sin(a)*r*2.2;d.vy=2;d.life=d.max=.45;d.r=1;d.g=.85;d.b=.4;}\n    if(M.t>.48){M.ph='dash';M.t=0;M.dash=null;}\n    return;\n  }\n  if(M.ph==='dash'){\n    if(!M.dash){\n      let best=null,bd=11;for(const u of U){if(!u.active||!u.alive||u.hidden||M.used.has(u)||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n      let tx,tz;if(best){M.used.add(best);const a=Math.atan2(best.x-P.x,best.z-P.z);tx=best.x-Math.sin(a)*1.5;tz=best.z-Math.cos(a)*1.5;P.yaw=a;}\n      else{const a=P.yaw+(M.n%2?.9:-.9);tx=P.x+Math.sin(a)*3.5;tz=P.z+Math.cos(a)*3.5;P.yaw=a;}\n      tx=clamp(tx,BND.x0,BND.x1);tz=clamp(tz,BND.z0,BND.z1);\n      M.dash={fx:P.x,fz:P.z,tx,tz,t:0,hit:false};play(M.n%2?'mSlashB':'mSlashA');snd('swing');\n    }\n    const D=M.dash;D.t+=dt;const k=EASE.out(clamp(D.t/.085,0,1));\n    P.x=lerp(D.fx,D.tx,k);P.z=lerp(D.fz,D.tz,k);\n    if(D.t<.1&&Math.floor(D.t/.025)!==Math.floor((D.t-dt)/.025))spawnGhost();\n    if(!D.hit&&D.t>.1){D.hit=true;const n=heroHit({r:3,arc:1.6,dmg:3,kb:5,launch:7,fwd:.6});if(n){snd('hit');hitStop=.04;addShake(.12);}}\n    if(D.t>.17){M.n++;M.dash=null;if(M.n>=6){M.ph='leap';M.t=0;play('mLeap');trail.color.setHex(0xffd27a);}}\n    return;\n  }\n  if(M.ph==='leap'){\n    P.flip=-TAU*EASE.io(clamp(M.t/.5,0,1));if(Math.floor(M.t/.06)!==Math.floor((M.t-dt)/.06))spawnGhost(0xffb050);\n    if(M.t>.52){M.ph='slam';M.t=0;P.flip=0;play('mSlam');\n      heroHit({r:7.5,arc:Math.PI,dmg:6,kb:12,fly:true});\n      shockRing(P.x,.15,P.z,0xffb050,2.8,.6);shockRing(P.x,.2,P.z,0xffe6b0,1.6,.4);flash(P.x,1.5,P.z,13,0xffb060,.6);sparks(P.x,1,P.z,70,true,1.4);\n      crack.m.position.set(P.x,.05,P.z);crack.t=0;crack.m.visible=true;\n      pillars.forEach((p,i)=>{const a=i/pillars.length*TAU,r=i?rand(2.5,5.5):0;p.m.position.set(P.x+Math.cos(a)*r,0,P.z+Math.sin(a)*r);p.t=-i*.04;p.m.visible=true;});\n      dust(P.x,P.z,10,true);addShake(.8);hitStop=.12;snd('boom');}\n    return;\n  }\n  if(M.ph==='slam'&&M.t>.8){P.mu=null;P.musou=0;trail.color.setHex(0xd8f4ff);}\n}\nfunction inputVec(){\n  let x=joy.x,y=joy.y;\n  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);\n  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}\n  return [x,y];\n}\nfunction updHero(dt){\n  P.inv=Math.max(0,P.inv-dt);P.comboWin-=dt;\n  const [jx,jz]=ST.auto?ST.auto:(P.locked||phase!=='play'?[0,0]:inputVec());const mag=Math.min(1,Math.hypot(jx,jz));\n  if(P.mu)updMusou(dt);\n  // 格擋\n  if(!P.mu&&!P.locked&&blkHeld&&(!P.clip||P.clip==='guard'||P.clip==='hurt'&&P.ct>250)){if(P.clip!=='guard')play('guard');}\n  else if(P.clip==='guard'&&!blkHeld){P.clip=null;}\n  P.blocking=P.clip==='guard'&&P.ct>70;\n  // 移動\n  let speed=7*mag;\n  if(P.mu)speed=0;else if(P.clip==='guard')speed=1.4*mag;else if(P.clip&&P.clip!=='hurt')speed=0;else if(P.clip==='hurt')speed=0;\n  P.moving=speed>.4;\n  if(P.moving){P.yaw=angLerp(P.yaw,Math.atan2(jx,jz),dt*(P.clip==='guard'?4:15));P.x+=jx/mag*speed*dt;P.z+=jz/mag*speed*dt;}\n  P.speed=speed;\n  P.x+=P.kvx*dt;P.z+=P.kvz*dt;const f=Math.pow(.002,dt);P.kvx*=f;P.kvz*=f;\n  // 招式推進\n  if(P.clip){\n    P.ct+=dt*1000;const C=HC[P.clip];\n    if(C.adv&&P.ct>C.adv[0]&&P.ct-dt*1000<C.adv[1]){const a=Math.max(P.ct-dt*1000,C.adv[0]),b=Math.min(P.ct,C.adv[1]);const dist=C.adv[2]*(b-a)/(C.adv[1]-C.adv[0]);\n      let near=99;for(const u of U){if(u.active&&u.alive&&!u.hidden&&isEnemyTeam(u.team)){const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<near&&Math.abs(angDiff(P.yaw,Math.atan2(u.x-P.x,u.z-P.z)))<1)near=d;}}\n      const k=near<1.5?.15:1;P.x+=Math.sin(P.yaw)*dist*k;P.z+=Math.cos(P.yaw)*dist*k;}\n    if(C.hit&&!P.hitDone&&P.ct>=C.hit[0]){P.hitDone=true;const h=C.hit[1];const n=heroHit(h);\n      if(n){snd('hit');hitStop=P.clip==='c4'?.08:.04;addShake(P.clip==='c4'?.35:.12);}}\n    if(C.slam&&!P.slamDone&&P.ct>=C.slam){P.slamDone=true;const fx=P.x+Math.sin(P.yaw)*1.9,fz=P.z+Math.cos(P.yaw)*1.9;\n      shockRing(fx,.12,fz,0xffe6b0,1.25,.4);dust(fx,fz,7,true);flash(fx,.6,fz,4,0xffc070,.3);sparks(fx,.4,fz,24,true);snd('boom');addShake(.25);}\n    if(CHAIN.includes(P.clip)){\n      if((P.queued||atkHeld)&&C.chain&&P.ct>=C.chain&&P.lastAtk<3){nextAtk(P.lastAtk+1);}\n    }\n    if(P.clip==='hurt'&&P.queued&&P.ct>=200){P.clip=null;nextAtk(0);}\n    const last=C.k[C.k.length-1][0];\n    if(P.clip&&!C.hold&&P.ct>=last){if(CHAIN.includes(P.clip)){P.comboWin=.3;if(P.lastAtk>=3)P.lastAtk=-1;}P.clip=null;}\n  }\n  // 範圍\n  collideWalls(P,.6);P.x=clamp(P.x,BND.x0,BND.x1);P.z=clamp(P.z,BND.z0,BND.z1);\n  P.vzN=lerp(P.vzN,(P.lastZ-P.z)/Math.max(dt,1e-4),Math.min(1,dt*10));P.lastZ=P.z;\n}\nconst vA=new THREE.Vector3(),vB=new THREE.Vector3();\nfunction poseHero(dt){\n  let p;\n  if(P.clip){p=evalClip(HC[P.clip],P.ct);}\n  else{\n    P.runW=lerp(P.runW,P.speed>.4?Math.min(1,P.speed/5):0,Math.min(1,dt*10)) .root.visible=true;bubs.forEach(b=>b.el.style.opacity=0);bubs.length=0;later.clear();camFocus=null;ST.auto=null;P.locked=false;ST.cut=false;ST.chargeTo=null;}\nfunction placeHero(x,z,yaw){P.x=x;P.z=z;P.lastZ=z;P.yaw=yaw;P.clip=null;P.mu=null;P.kvx=P.kvz=0;camLook.set(x,1.2,z-2);updCamera(0,true);}\nfunction spawnAllies(n,cx,cz,yaw,mode,group,hp){const out=[];for(let i=0;i<n;i++){const col=i%4,row=(i/4)|0;const x=cx+(col-1.5)*1.7,z=cz+row*1.7;\n  const u=spawnFoe(x,z,yaw,{team:1,hp:hp||14,mode,group:group||'chu',home:[x,z],faceYaw:yaw,cspd:5,eager:true,fight:true});if(u)out.push(u);}return out;}\nfunction spawnOfficer(x,z,yaw){return spawnFoe(x,z,yaw,{team:1,hp:99,mode:'follow',group:'officer',officer:true,passive:true,fight:false,cspd:5,noSpear:true});}\nfunction setQi(){}\nfunction boost(a,p){a.power=p;a.hp=Math.max(a.hp,8*p);}\nfunction cheerAll(list){list.forEach((a,i)=>{if(a.alive&&!a.fleeing)later.add(i*.08,()=>{a.cheer=1.5;a.mode='attn';a.home=[a.x,a.z];});});}\nfunction volleyFrom(list,n){const live=list.filter(a=>a.on&&!a.fall);if(!live.length)return;for(let i=0;i<(n||live.length*3);i++){const a=live[i%live.length];shootArrow(a.x,a.y+1.4,a.z,P.x+rand(-2.8,2.8),0,P.z+rand(-2.8,2.8),rand(.9,1.2),false,null);}snd('bow');}\n\nfunction stageReset(){\n  clearUnits();Object.assign(P,{hp:300,musou:30,inv:0,blocking:false,queued:false,lastAtk:-1,comboWin:0,flip:0,aim:null});\n  kills=0;combo=0;comboT=0;maxCombo=0;elapsed=0;hitStop=0;shake=0;slowT=0;ST.log={};ST.night=0;ST.dusk=0;ST.sunT=0;ST.disc=0;setDay('');setOrder('',null);resetWheat();\n  if(DUST){DUST=null;dustP.forEach(d=>d.sp.visible=false);}\n  startCh1();\n}\nlet CUR=null;\nfunction endless(group,cap,every,mk){const C=CUR;C.ws=(C.ws||0)+lastDt;if(C.ws>every&&aliveG(group).length<cap){C.ws=0;mk();}}\nfunction laugh(list,n){list.filter(u=>u.alive).sort(()=>Math.random()-.5).slice(0,n).forEach((u,i)=>later.add(i*.12,()=>{u.cheer=1.1;bubble(u,['哈哈哈','嘻嘻','笑死了','這是在做什麼','哈哈'][i%5],1.6);}));}\n/* ---------- 一、教戰（孫武練女兵） ---------- */\nlet CH1=null;\nfunction startCh1(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=1;ST.step='open';ST.t=0;ST.disc=0;setMorale(.2);updProg();\n  BND={x0:CH1X-26,x1:CH1X+14,z0:-46,z1:4};\n  placeHero(CH1X,-12,Math.PI);\n  const G=[];\n  for(let side=-1;side<=1;side+=2)for(let i=0;i<18;i++){const col=i%6,row=(i/6)|0;const x=CH1X+side*9+(col-2.5)*1.6,z=-26-row*1.7;\n    const u=spawnFoe(x,z,0,{team:3,group:'girls',hp:99,passive:true,mode:'attn',home:[x,z],faceYaw:0,side,cspd:3});if(u){u.captain=(i===2);if(u.captain)attachFlag(u,BMAT.wu);G.push(u);}}\n  const king=spawnFoe(CH1X+20,-22,-Math.PI/2,{team:1,group:'king',hp:99,passive:true,mode:'attn',home:[CH1X+20,-22],faceYaw:-Math.PI/2,noSpear:true,scale:1.12,officer:true,fight:false});if(king){king.y=1.2;attachFlag(king,BMAT.wu);}\n  const off=spawnOfficer(CH1X+3.2,-10,Math.PI);off.mode='attn';off.home=[CH1X+3.2,-10];off.faceYaw=Math.PI;\n  CH1=CUR={girls:G,king,officer:off,n:0,executed:null,ended:false};\n  ST.cut=true;P.locked=true;focus(CH1X+2,-24,1.2,24,34);\n  chapterTitle('一　教戰','孫武練女兵・《史記・孫子吳起列傳》');\n  setCap('吳王闔廬讓你以宮女試兵，分為兩隊，以王之寵姬二人為隊長。');\n  later.add(3,()=>{setCap('約束既布，三令五申：鼓之右，就向右轉。按「令」擊鼓。');ST.cut=false;P.locked=false;setOrder('鼓之右',()=>drill('右'),'令');});\n}\nconst DRILL={'右':{yaw:-Math.PI/2,txt:'右！'},'左':{yaw:Math.PI/2,txt:'左！'},'前':{yaw:0,txt:'前！'},'跪':{kneel:true,txt:'跪！'}};\nfunction drill(cmd){const C=CH1;C.n++;const D=DRILL[cmd];[0,.3,.6].forEach(s=>later.add(s,()=>beatDrum(drum1,1)));showOrder(D.txt,'鼓之'+cmd);\n  const obey=ST.disc>0;const G=C.girls.filter(u=>u.alive);\n  if(obey){G.forEach((u,i)=>later.add(.5+(i%6)*.05,()=>{if(D.kneel){u.mode='kneel';}else{u.mode='attn';u.kneel=false;u.faceYaw=D.yaw;if(cmd==='前'){u.mode='walkTo';u.cspd=2.6;u.dest=[u.home[0],u.home[1]+2.5];u.onArrive=(q)=>{q.mode='attn';q.home=[q.x,q.z];q.faceYaw=0;};}}}));\n    later.add(1.6,()=>{popText(CH1X,3.2,-24,'皆中規矩');snd('gong');});\n    later.add(2.8,()=>{if(cmd==='左')setOrder('鼓之右',()=>drill('右'),'令');else if(cmd==='右'&&C.n<4)setOrder('鼓之前',()=>drill('前'),'令');else if(cmd==='前')setOrder('鼓之跪',()=>drill('跪'),'令');else end1(true);});\n    if(C.n===3)setCap('復三令五申而鼓之。這一次，無敢出聲。');}\n  else{later.add(.8,()=>laugh(G,14));\n    if(C.n===1){later.add(1.4,()=>setCap('婦人大笑。你說：「約束不明，申令不熟，將之罪也。」復三令五申。'));later.add(4.2,()=>setOrder('鼓之左',()=>drill('左'),'令'));}\n    else if(C.n===2){later.add(1.4,()=>setCap('婦人復大笑。你說：「既已明而不如法者，吏士之罪也。」'));\n      later.add(3.6,()=>{ST.cut=true;P.locked=true;showOrder('乃欲斬左右隊長！','號令已明仍不聽從，罪在隊長');snd('drum');setCap('你下令：斬左右隊長二人以徇！');\n        const caps=C.girls.filter(u=>u.captain&&u.alive);caps.forEach((u,i)=>{u.cspd=3;goTo(u,[CH1X+(u.side<0?-3:3),-19],'walkTo',(q)=>{q.mode='kneel';q.yaw=0;popText(q.x,2.4,q.z,q.side<0?'左隊長':'右隊長','#ff8a66');});});\n        focus(CH1X,-20,1.2,10,10);});\n      later.add(6.6,()=>{setCap('兩名隊長被押到陣前跪下，鈇鉞已經架好。全場的笑聲停了。');setMarker(CH1X,-19);});\n      later.add(8.6,()=>{setMarker(null);focus(CH1X+8,-22,1.2,16,20);setCap('吳王在臺上看見了，急忙派人下來傳話——');if(C.king)bubble(C.king,'寡人非此二姬，食不甘味，願勿斬也。',3.4);});\n      later.add(11.6,()=>askChoice('你已下令斬隊長，吳王為二姬求情','你剛下令斬左右隊長二人以徇。這兩名隊長是吳王的寵姬，吳王派人傳話：「寡人非此二姬，食不甘味，願勿斬也。」要照軍令斬，還是奉君命赦免？',[\n        {t:'將在軍，君命有所不受：照軍令斬',fn:()=>execute1(true)},{t:'奉君命，赦免二姬',fn:()=>execute1(false)}]));}\n    else{later.add(1.6,()=>{if(C.n===3)setCap('赦免之後，再鼓之——婦人仍然大笑。');});later.add(3.2,()=>{if(C.n<4)setOrder('鼓之右',()=>drill('右'),'令');else end1(false);});}}\n}\nfunction execute1(doIt){const C=CH1;C.executed=doIt;\n  if(doIt){showOrder('臣既已受命為將，將在軍，君命有所不受。','斬隊長二人以徇');ST.disc=1;setMorale(1);\n    const caps=C.girls.filter(u=>u.captain&&u.alive);setMarker(null);\n    caps.forEach((u,i)=>{u.kneel=false;u.cspd=2.6;goTo(u,[CH1X-18,-19+i*6],'walkTo',(q)=>{q.mode='kneel';q.yaw=Math.PI/2;});dropFlag(u);});\n    later.add(4.2,()=>{focus(CH1X-18,-22,1.2,10,8);});\n    later.add(5.6,()=>{caps.forEach((u,i)=>later.add(i*.5,()=>{flash(u.x,1.3,u.z,2.4,0xfff0c0,.3);sparks(u.x,1.2,u.z,12,false);snd('hit');popText(u.x,2.6,u.z,'斬','#ff8a66');u.kneel=false;u.alive=false;u.flying=false;u.deadT=0;u.vx=0;u.vz=0;addShake(.2);}));});\n    later.add(7.2,()=>{C.girls.filter(u=>u.alive).forEach((u,i)=>{if(i%3===0)later.add(i*.05,()=>bubble(u,'……',1.2));});setCap('斬隊長二人以徇。復以其次為隊長。');if(C.king)bubble(C.king,'……',1.5);});\n    later.add(9.4,()=>{focus(null);ST.cut=false;P.locked=false;setCap('再鼓之：按「令」。');setOrder('鼓之左',()=>drill('左'),'令');});}\n  else{showOrder('奉君命，赦二姬。','隊長不斬');ST.disc=0;setMorale(.1);harden();\n    setMarker(null);C.girls.filter(u=>u.captain&&u.alive).forEach(u=>{u.kneel=false;u.cspd=2.6;goTo(u,u.home,'walkTo',(q)=>{q.mode='attn';q.faceYaw=0;});});\n    later.add(1,()=>{if(C.king)bubble(C.king,'善。',1.6);laugh(C.girls,6);});\n    later.add(2.6,()=>{focus(null);ST.cut=false;P.locked=false;setCap('二姬回到隊前，掩口而笑。再鼓之：按「令」。');setOrder('鼓之左',()=>drill('左'),'令');});}\n}\nfunction end1(good){const C=CH1;if(C.ended)return;C.ended=true;ST.cut=true;P.locked=true;focus(CH1X+2,-24,1.2,24,34);\n  if(good){setCap('婦人左右前後跪起皆中規矩繩墨，無敢出聲。');if(C.king)later.add(1,()=>bubble(C.king,'將軍罷休就舍，寡人不願下觀。',3));\n    later.add(2.4,()=>{judge(true,'無敢出聲','既已明而不如法者，吏士之罪也。','令既明，罰必行——兵可用矣');\n      ST.log[1]={did:'君命有所不受，斬隊長二人以徇',out:'左右前後跪起皆中規矩，無敢出聲',good:true};updProg();later.add(4.2,()=>fadeTo(startCh2));});}\n  else{setCap('鼓之再三，婦人笑語如故。這支兵，永遠練不成。');if(C.king)later.add(1,()=>bubble(C.king,'婦人之戲耳。',2.4));\n    later.add(2.4,()=>{judge(false,'令不行','卒已親附而罰不行，則不可用也。','赦了違令的隊長，號令就只是戲言');\n      ST.log[1]={did:'奉君命，赦免二姬',out:'再鼓之，婦人笑語如故，兵不可用',good:false};updProg();later.add(4.2,()=>fadeTo(startCh2));});}\n}\n\n/* ---------- 二、軍門（穰苴斬莊賈） ---------- */\nlet CH2=null;\nfunction startCh2(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=2;ST.step='wait';ST.t=0;ST.sunT=0;ST.dusk=0;ST.disc=0;setMorale(.5);updProg();\n  BND={x0:CH2X-24,x1:CH2X+24,z0:-90,z1:7};\n  placeHero(CH2X,-2,Math.PI);\n  const A=spawnAllies(12,CH2X-9,-6,Math.PI,'attn','qi',14).concat(spawnAllies(12,CH2X+9,-6,Math.PI,'attn','qi',14));if(A[0])attachFlag(A[0],BMAT.qi);if(A[12])attachFlag(A[12],BMAT.qi);\n  const off=spawnOfficer(CH2X+3.2,-3,Math.PI);off.mode='attn';off.home=[CH2X+3.2,-3];off.faceYaw=Math.PI;\n  CH2=CUR={allies:A,officer:off,jia:null,ret:[],envoy:null,kept:null,t0:0,spawned:false,won:false,lost:false,ws:0,ended:false,waveMsg:false};\n  ST.cut=true;P.locked=true;focus(CH2X,-10,1.2,24,36);setDay('旦日');\n  chapterTitle('二　軍門','穰苴斬莊賈・《史記・司馬穰苴列傳》');\n  setCap('燕、晉來犯。你受命為將，景公派寵臣莊賈為監軍。你與莊賈約：「旦日日中會於軍門。」');\n  later.add(3.5,()=>{setCap('你先到軍門，立表下漏，等莊賈。');ST.step='sun';});\n}\nfunction jiaArrive(){const C=CH2;ST.step='jia';setCap('夕時，莊賈才醉醺醺地到軍門，親戚左右還在身後。');\n  const j=spawnFoe(CH2X+1,-46,0,{team:3,group:'jia',hp:99,passive:true,mode:'walkTo',cspd:3.2,dest:[CH2X+1,-9],noSpear:true,drunk:true});\n  C.jia=j;if(j){attachFlag(j,BMAT.white);j.onArrive=(q)=>{q.mode='attn';q.home=[q.x,q.z];q.faceYaw=Math.PI;bubble(q,'來遲了，來遲了……喝了幾杯。',2.6);\n    later.add(2.2,()=>bubble(C.officer,'軍法：期而後至者，當斬。',2.6));\n    later.add(4.6,()=>askChoice('監軍莊賈失期','莊賈是景公的寵臣，過了日中才醉醺醺地到。軍正說：「軍法，期而後至者，當斬。」',[\n      {t:'斬莊賈以徇三軍',fn:()=>verdict2(true)},{t:'寬宥：他是君上的人',fn:()=>verdict2(false)}]));};}\n  for(let i=0;i<2;i++){const r=spawnFoe(CH2X+(i?-1.6:3.2),-49-i,0,{team:3,group:'ret',hp:99,passive:true,mode:'walkTo',cspd:3.2,dest:[CH2X+(i?-1.6:3.2),-12-i],noSpear:true});if(r){r.onArrive=(q)=>{q.mode='attn';q.home=[q.x,q.z];q.faceYaw=Math.PI;};C.ret.push(r);}}\n  focus(CH2X,-20,1.2,20,26);\n}\nfunction verdict2(kill){const C=CH2;C.kept=!kill;ST.step='verdict';\n  const env=spawnFoe(CH2X-2,-70,0,{team:1,group:'envoy',hp:99,passive:true,mode:'walkTo',cspd:7,dest:[CH2X-2,-10],noSpear:true,officer:true,fight:false});C.envoy=env;\n  if(env){attachFlag(env,BMAT.qi);env.onArrive=(q)=>{q.mode='attn';q.home=[q.x,q.z];q.faceYaw=Math.PI;bubble(q,'君令：赦莊賈！',2.4);};}\n  if(kill){showOrder('將在軍，君令有所不受。','斬莊賈以徇三軍');ST.disc=1;setMorale(1);\n    const j=C.jia;if(j){j.cspd=2;dropFlag(j);goTo(j,[CH2X-14,4],'walkTo',(q)=>{q.mode='kneel';q.yaw=0;});}\n    C.ret.forEach(r=>{r.cspd=5;goTo(r,[r.x,-70],'walkTo',(q)=>{q.active=false;q.alive=false;});});\n    later.add(5.5,()=>{focus(CH2X-12,2,1.2,10,8);});\n    later.add(7,()=>{if(j){flash(j.x,1.3,j.z,2.4,0xfff0c0,.3);sparks(j.x,1.2,j.z,12,false);snd('hit');popText(j.x,2.6,j.z,'斬','#ff8a66');j.kneel=false;j.alive=false;j.flying=false;j.deadT=0;j.vx=0;j.vz=0;addShake(.2);}\n      setCap('斬莊賈以徇三軍。三軍之士皆振慄。');C.allies.forEach((a,i)=>{if(i%4===0)later.add(i*.05,()=>bubble(a,'……',1.2));});});\n    later.add(9.4,()=>{focus(null);setCap('使者到了也無用：「將在軍，君令有所不受。」你親自巡視士卒的井灶、飲食、疾病。士卒爭奮出戰。');C.allies.forEach(a=>{a.cheer=1.3;boost(a,2);});});\n    later.add(12.5,()=>toBattle2());}\n  else{showOrder('寬宥莊賈。','君上的人，不敢動');ST.disc=0;setMorale(.2);harden();\n    later.add(2.5,()=>{setCap('莊賈由使者帶回。士卒看在眼裡，竊竊私語。');C.allies.filter((a,i)=>i%3===0).forEach((a,i)=>later.add(i*.3,()=>bubble(a,['權貴失期也沒事','軍法只管小兵','這仗怎麼打','……'][i%4],2)));});\n    later.add(5,()=>{if(C.jia){C.jia.cspd=3;goTo(C.jia,[CH2X+1,-70],'walkTo',(q)=>{q.active=false;q.alive=false;});}C.ret.concat(C.envoy?[C.envoy]:[]).forEach(r=>{r.cspd=3;goTo(r,[r.x,-70],'walkTo',(q)=>{q.active=false;q.alive=false;});});});\n    later.add(7.5,()=>toBattle2());}\n}\nfunction toBattle2(){const C=CH2;ST.step='order';focus(null);ST.cut=false;P.locked=false;setDay('');ST.dusk=0;\n  setCap('燕師渡河來犯。按「令」出戰。');C.allies.forEach(a=>{a.mode='hold';a.home=[a.x,a.z];a.faceYaw=Math.PI;});\n  setOrder('出戰',()=>{ST.step='fight';C.t0=elapsed;showOrder('出戰！','燕師在前');snd('drum');ST.chargeTo=[CH2X,-50];if(C.officer)C.officer.mode='follow';\n    const good=ST.disc>0;\n    C.allies.forEach((a,i)=>{if(!a.alive)return;if(good||i%3===0){a.mode='charge';a.dest=[CH2X,-50];if(good&&i%4===0)later.add(.2+i*.1,()=>bubble(a,['爭先！','隨將軍！','殺！'][i%3],1.4));}\n      else{a.mode='hold';a.home=[a.x,a.z];a.faceYaw=Math.PI;later.add(1+i*.25,()=>bubble(a,['看看再說','軍法又不管我們','莊賈都沒事'][i%3],1.8));}});\n    setCap(good?'士卒爭奮，人人向前。':'只有少數人跟上，其餘的人站在原地觀望。');if(!good)setTimer(13,'燕師增援');\n    for(let i=0;i<30;i++)later.add(i*.18,()=>{const u=spawnFoe(CH2X+(i%8-3.5)*2.6+rand(-.3,.3),-56-((i/8)|0)*4,0,{team:2,group:'yan',hp:7,ai:.6+Math.random()*.9,mode:'fight'});if(u&&i%6===1)attachFlag(u,BMAT.yan);});\n    later.add(30*.18+.3,()=>{C.spawned=true;});},'令');\n}\nfunction ch2Update(dt){const C=CH2;\n  if(ST.step==='sun'){ST.sunT=Math.min(1,ST.sunT+dt/14);const t=ST.sunT;ST.dusk=Math.max(0,(t-.7)/.3)*.8;\n    const lbl=t<.45?'旦日':t<.75?'日中':t<.97?'日晡':'夕時';if(C.lbl!==lbl){C.lbl=lbl;setDay(lbl);if(lbl==='日中')setCap('日中。表影正直，莊賈不至。');if(lbl==='日晡')setCap('日晡。你命人仆表決漏，入營整頓軍隊。莊賈還是沒來。');}\n    if(t>=1&&!C.jia)jiaArrive();}\n  if(ST.step==='fight'){const good=ST.disc>0;\n    if(!good&&elapsed-C.t0>=13&&!C.winClosed){C.winClosed=true;clearTimer();setCap('燕師不再增援。把眼前的燕兵打完！');}\n    if(!good&&elapsed-C.t0<13)endless('yan',30,.55,()=>{const u=spawnFoe(CH2X+rand(-12,12),P.z-44+rand(-4,4),0,{team:2,group:'yan',hp:7,ai:.5,mode:'fight'});if(u&&Math.random()<.2)attachFlag(u,BMAT.yan);});\n    if(!good&&!C.waveMsg&&elapsed-C.t0>6){C.waveMsg=true;setCap('燕師越聚越多，你身邊的人卻越來越少。');}\n    if(good&&C.spawned&&aliveG('yan').length===0&&!C.won){C.won=true;end2(true);}\n    if(!good&&!C.lost&&(P.hp<=P.max*.1+.5||(C.winClosed&&C.spawned&&aliveG('yan').length===0))){C.lost=true;end2(false);}\n    if(good&&!C.lost&&P.hp<=P.max*.1+.5){C.lost=true;end2(false);}}\n}\nfunction end2(win){const C=CH2;if(C.ended)return;C.ended=true;ST.cut=true;clearTimer();ST.chargeTo=null;\n  if(win){cheerAll(C.allies);setCap('燕師聞之，渡水而解；晉師聞之，為罷去。');\n    later.add(1.6,()=>{judge(true,'爭奮出戰','令之以文，齊之以武，是謂必取。','軍法連監軍也斬，士卒才信你的令——爭奮赴戰');\n      ST.log[2]={did:'君令有所不受，斬莊賈以徇三軍',out:'士卒爭奮，燕師渡水而解',good:true};updProg();later.add(4.4,()=>fadeTo(startCh3));});}\n  else{aliveG('yan').forEach(u=>{u.noAtk=true;u.ai=99;});setCap(ST.disc>0?'力戰不支，只能退守營壘。':(P.hp<=P.max*.1+.5?'士卒不肯用命，只能退守營壘。':'燕師退了，但部下大半袖手旁觀，你幾乎是獨力苦戰。'));\n    later.add(1.4,()=>{judge(false,ST.disc>0?'力戰不支':'令不行','卒已親附而罰不行，則不可用也。',ST.disc>0?'軍令雖立，仍須力戰':'赦了失期的監  if(!C.feint&&(dead>=8||elapsed-C.t0>14))feint3();\n    if(!C.lost&&P.hp<=P.max*.1+.5){C.lost=true;end3('fall');}}\n  else if(ST.step==='feint'){C.askT+=dt;if(C.chase==null&&C.askT>4.5)holdOrder3(false);\n    C.allies.forEach(a=>{if(a.alive&&ST.disc>0&&C.chase===false&&a.z<LINE3)a.z=LINE3;});}\n  else if(ST.step==='hold'){C.allies.forEach(a=>{if(a.alive&&a.z<LINE3-3)a.z=LINE3-3;});\n    const live=aliveG('yuan').length+aliveG('amb').length;\n    if(!C.won&&elapsed-C.t0>6&&live===0){C.won=true;end3('win');}\n    if(!C.lost&&P.hp<=P.max*.1+.5){C.lost=true;end3('fall');}}\n  else if(ST.step==='ambush'){const A=C.allies.filter(a=>a.alive);\n    if(elapsed-C.t0>=14&&!C.winClosed){C.winClosed=true;clearTimer();if(A.length)setCap('伏兵不再湧出。把眼前的袁軍打完！');}\n    if(!C.lost&&(P.hp<=P.max*.1+.5||(C.winClosed&&aliveG('yuan').length+aliveG('amb').length===0))){C.lost=true;end3('chase');}}\n}\nfunction end3(k){const C=CH3;if(C.ended)return;C.ended=true;ST.cut=true;clearTimer();ST.chargeTo=null;\n  if(k==='win'){cheerAll(C.allies);\n    later.add(1,()=>{judge(true,'令行禁止','佯北勿從。','主帥自刑，令自上而行——士卒該停就停，伏兵撞上整齊的陣線');\n      ST.log[3]={did:'割髮代首；敵軍佯退時下令勿追',out:'全軍止步列陣，伏兵無功',good:true};updProg();later.add(4.4,finish);});}\n  else if(k==='chase'){U.forEach(u=>{if(u.active&&isEnemyTeam(u.team)){u.noAtk=true;u.ai=99;}});setCap('追進麥田的士卒，沒有幾個回來。');\n    later.add(1.4,()=>{judge(false,'令不行','令不素行以教其民，則民不服。','主帥自己不守令，「勿追」就沒有人聽——追入伏中');\n      ST.log[3]={did:ST.disc>0?'敵軍佯退時沒有及時下令':'罰不加於尊；下令勿追也無人聽',out:'士卒追入伏中，死傷殆盡',good:false};updProg();later.add(4.4,finish);});}\n  else{U.forEach(u=>{if(u.active&&isEnemyTeam(u.team)){u.noAtk=true;u.ai=99;}});setCap('力戰不支，只能退回營壘。');\n    later.add(1.4,()=>{judge(false,'力戰不支','令之以文，齊之以武。','軍令雖立，仍須力戰');\n      ST.log[3]={did:ST.disc>0?'割髮代首':'罰不加於尊',out:'力戰不支而退',good:false};updProg();later.add(4.4,finish);});}\n}\nfunction stageUpdate(dt){\n  ST.t+=dt;lastDt=dt;later.tick(dt);\n  if(ST.ch===1)ch1Update(dt);else if(ST.ch===2)ch2Update(dt);else if(ST.ch===3)ch3Update(dt   const m=e.data||{};
  if(m.wudeMenu)closeLevel();
  if(m.wudeDone){const d=m.wudeDone;const r=REC[d.lvl]||{best:0,n:0};r.score=d.score;r.total=d.total;r.best=Math.max(r.best||0,d.score);r.n=(r.n||0)+1;REC[d.lvl]=r;saveRec();}
});
render();
try{const nx=sessionStorage.getItem('wude.next');if(nx){sessionStorage.removeItem('wude.next');const L=LEVELS.find(l=>l.k===nx);if(L&&!L.soon)setTimeout(()=>open(L),50);}}catch(e){}
</script>
