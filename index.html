class=\"pop\" id=\"pop1\"></div><div class=\"pop\" id=\"pop2\"></div>\n  <div id=\"hurt\"></div>\n  <button class=\"btn\" id=\"bMus\" type=\"button\">無雙</button>\n  <button class=\"btn\" id=\"bBlk\" type=\"button\">擋</button>\n  <button class=\"btn\" id=\"bAtk\" type=\"button\">攻</button>\n</div>\n\n<div class=\"over\" id=\"intro\">\n  <div class=\"card\">\n    <p class=\"kicker\">孫子論將・五德之首</p>\n    <h1>智</h1>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>《孫子・計篇》</span></p>\n    <p>你率軍穿過一處山谷。對面的敵將擅長設局：伏兵、佯敗、誘餌、奇襲。這一關打不過，往往不是刀不夠快，而是<b>沒看懂</b>。</p>\n    <p>右上角的「兵書」收了〈行軍〉〈軍爭〉〈九變〉的幾句話。路上看到奇怪的動靜，就打開兵書對照；不是每一句都用得上。</p>\n    <ul class=\"keys\">\n      <li><b>移動</b>　左半邊螢幕拖曳 <kbd>WASD</kbd></li>\n      <li><b>攻</b>　連按四段斬 <kbd>J</kbd></li>\n      <li><b>擋</b>　按住格擋 <kbd>K</kbd></li>\n      <li><b>無雙</b>　氣滿後按下 <kbd>L</kbd></li>\n      <li><b>聲</b>　右上角可關閉配樂與音效</li>\n    </ul>\n    <p id=\"glWarn\" hidden style=\"color:#ff8a66;font-weight:700\"></p>\n    <button type=\"button\" class=\"cta\" id=\"bStart\">出兵</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu\">回目錄</button>\n    <p class=\"hint port\">手機橫放，戰場看得比較廣。</p>\n  </div>\n</div>\n\n<div class=\"over\" id=\"book\" hidden>\n  <div class=\"card\">\n    <h2>兵書</h2>\n    <ol class=\"lines\">\n      <li id=\"src-1\"><b>鳥起者，伏也。</b><span>〈行軍〉鳥群驚飛，下面藏著伏兵。</span></li>\n      <li><b>獸駭者，覆也。</b><span>〈行軍〉野獸驚逃，有大軍掩襲而來。</span></li>\n      <li id=\"src-4\"><b>塵高而銳者，車來也；卑而廣者，徒來也。</b><span>〈行軍〉塵土高而尖，是車騎來了；低而寬，是步兵來了。</span></li>\n      <li><b>辭卑而益備者，進也。</b><span>〈行軍〉言辭謙卑卻加緊戒備，是準備進攻。</span></li>\n      <li id=\"src-3\"><b>半進半退者，誘也。</b><span>〈行軍〉忽進忽退，是在引誘你。</span></li>\n      <li id=\"src-2\"><b>旌旗動者，亂也。</b><span>〈行軍〉旗幟東倒西歪，是陣腳真的亂了。</span></li>\n      <li><b>佯北勿從，餌兵勿食。</b><span>〈軍爭〉假裝敗逃的不要追；拿來當誘餌的不要吃。</span></li>\n      <li><b>智者之慮，必雜於利害。</b><span>〈九變〉有智的將領，想事情一定同時看到利與害。</span></li>\n    </ol>\n    <button type=\"button\" class=\"cta\" id=\"bBookClose\">回到戰場</button>\n  </div>\n</div>\n\n<div class=\"over choice\" id=\"choice\" hidden>\n  <div class=\"card\">\n    <p class=\"kicker\" id=\"chK\"></p>\n    <p id=\"chQ\" style=\"font-size:17px\"></p>\n    <div class=\"row\" id=\"chBtns\"></div>\n  </div>\n</div>\n\n<div class=\"over\" id=\"end\" hidden>\n  <div class=\"card wide\">\n    <p class=\"kicker\">關卡結算</p>\n    <h2>智・四次判斷　<span id=\"endScore\"></span></h2>\n    <div class=\"stats\"><div><small>擊破</small><b id=\"eKills\">0</b></div><div><small>最大連擊</small><b id=\"eCombo\">0</b></div><div><small>用時</small><b id=\"eTime\">0:00</b></div></div>\n    <div class=\"tw\"><table><thead><tr><th></th><th>你看到</th><th>你怎麼做</th><th>結果</th><th>兵書怎麼說</th></tr></thead><tbody id=\"endRows\"></tbody></table></div>\n    <h3>什麼是「智」</h3>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>〈計篇〉</span></p>\n    <p class=\"q\">「兵家者流，用智為先。蓋智者，能機權、識變通也。」<span>杜牧注〈計篇〉</span></p>\n    <p class=\"q\">「智者之慮，必雜於利害。」<span>〈九變〉</span></p>\n    <p>這一關的四次判斷，就是「智」：先看懂徵兆（<b>先見</b>）；不被眼前的好處，例如逃跑的敵人、路上的輜重牛馬，牽著走（<b>不惑</b>）；同樣是敵人逃跑，第二次該追、第三次不能追，靠的是看旗幟與進退，不是死守一條規則（<b>權變</b>）。</p>\n    <button type=\"button\" class=\"cta\" id=\"bAgain\">再打一次</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu2\">回目錄</button>\n  </div>\n</div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=Math.PI*2;\nconst rand=(a,b)=>a+Math.random()*(b-a);\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};\nconst angLerp=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);\nconst EASE={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,snap:t=>1-Math.pow(1-t,4),sine:t=>.5-.5*Math.cos(Math.PI*t)};\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ================= 渲染器與場景 ================= */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\nfunction glNotice(t){const el=document.getElementById('cap');if(el){el.hidden=false;el.textContent=t;}const w=document.getElementById('glWarn');if(w){w.hidden=false;w.textContent=t;}}\ncanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glNotice('畫面資源被手機系統回收了（開太多頁面）。請關閉其他分頁後重新整理這一頁。');},false);\ncanvas.addEventListener('webglcontextrestored',()=>{try{renderer.resetState();}catch(e){}},false);\nif(!renderer.getContext())glNotice('這個瀏覽器無法建立立體畫面，請改用 Safari 或 Chrome 重新開啟。');\nconst scene=new THREE.Scene();\nconst HORIZON=0xe2a46a;\nscene.background=new THREE.Color(HORIZON);\nscene.fog=new THREE.Fog(HORIZON,60,175);\nconst camera=new THREE.PerspectiveCamera(50,1,.4,400);\nlet portrait=false;\nlet sky;\n{\n  const g=new THREE.SphereGeometry(260,24,14),p=g.attributes.position,cols=[];\n  const top=new THREE.Color(0x56577f),hor=new THREE.Color(HORIZON),low=new THREE.Color(0xb98058),c=new THREE.Color();\n  for(let i=0;i<p.count;i++){const y=p.getY(i)/260;if(y>=0)c.copy(hor).lerp(top,Math.pow(y,.55));else c.copy(hor).lerp(low,Math.min(1,-y*3));cols.push(c.r,c.g,c.b);}\n  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));\n  sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));\n  scene.add(sky);\n}\nscene.add(new THREE.HemisphereLight(0xffe6c4,0x6a5040,.8));\nconst sun=new THREE.DirectionalLight(0xffcf98,.95);sun.position.set(-30,45,22);scene.add(sun);\nconst matCache={};\nconst lam=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));\nfunction block(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(BOX,lam(c));m.scale.set(w,h,d);m.position.set(x,y,z);(parent||scene).add(m);return m;}\nconst BOX=new THREE.BoxGeometry(1,1,1);\nfunction noiseTex(base,amt,size,dots){\n  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d (u.yaw,face!=null?face:Math.atan2(ddx,ddz),dt*8);u.moving=s>.3;u.phase+=dt*s*2.8*(face!=null&&Math.abs(angDiff(face,Math.atan2(ddx,ddz)))>1.6?-1:1);};\n  switch(u.mode){\n    case 'hold':u.moving=false;u.yaw=angLerp(u.yaw,toP,dt*2);return;\n    case 'rout':{\n      if(!u.noSpear){u.noSpear=true;}\n      const a=Math.PI+Math.sin(clock*2.6+u.seed)*.75;const sp=ST.routSpd||4.4;\n      u.x+=Math.sin(a)*sp*dt;u.z+=Math.cos(a)*sp*dt;u.yaw=angLerp(u.yaw,a,dt*6);u.moving=true;u.phase+=dt*sp*2.8;\n      return;}\n    case 'feint':{\n      const F=ST.e.feint;const adv=F&&F.phase==='push';\n      if(u.z>u.stopZ+.3){mv(u.x,u.stopZ,3.1,toP);u.phase+=dt*4;}\n      else if(adv&&u.z<u.stopZ+3.2){mv(u.x,u.stopZ+3.4,2.2,toP);}\n      else{u.moving=false;u.yaw=angLerp(u.yaw,toP,dt*5);if(d<2&&u.cd<=0){u.atkT=.52;u.glinted=false;u.cd=rand(1.6,2.8);}}\n      return;}\n    case 'fallback':{\n      if(u.z>u.stopZ+.4){mv(u.x,u.stopZ,5.2);u.phase+=dt*6;}\n      else{u.mode='feint';u.moving=false;}\n      return;}\n    default:{\n      if(u.ai>0){u.moving=false;u.yaw=angLerp(u.yaw,toP,dt*3);return;}\n      if(d>1.7)mv(P.x,P.z,3.7);\n      else{u.moving=false;u.yaw=angLerp(u.yaw,toP,dt*8);if(u.cd<=0){u.atkT=.52;u.glinted=false;u.cd=rand(1.5,2.8);}}\n    }\n  }\n}\nfunction separate(){\n  for(let i=0;i<N;i++){const a=U[i];if(!a.active||!a.alive||a.hidden||a.air)continue;\n    for(let j=i+1;j<N;j++){const b=U[j];if(!b.active||!b.alive||b.hidden||b.air)continue;\n      const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;if(d2<.72&&d2>1e-6){const d=Math.sqrt(d2),p=(.85-d)*.5/d;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}}\n    const dx=a.x-P.x,dz=a.z-P.z,d2=dx*dx+dz*dz;if(d2<1.2&&d2>1e-6){const d=Math.sqrt(d2),p=(1.1-d)/d;a.x+=dx*p;a.z+=dz*p;}\n    if(a.mode!=='rout'){const hw=halfW(a.z)-.4;a.x=clamp(a.x,-hw,hw);}\n  }\n}\n\n/* ---------- 主將 ---------- */\nfunction startAttack(){\n  if(phase!=='play'||P.locked||P.mu)return;\n  if(P.clip&&CHAIN.includes(P.clip)){const c=HC[P.clip];if(c.chain&&P.ct<c.chain){P.queued=true;return;}if(P.lastAtk<3){nextAtk(P.lastAtk+1);}return;}\n  if(P.clip==='hurt'&&P.ct<200){P.queued=true;return;}\n  nextAtk(P.comboWin>0&&P.lastAtk>=0&&P.lastAtk<3?P.lastAtk+1:0);\n}\nfunction nextAtk(i){\n  P.lastAtk=i;P.queued=false;\n  let best=null,bd=6.5;for(const u of U){if(!u.active||!u.alive||u.hidden)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n  if(best)P.yaw=Math.atan2(best.x-P.x,best.z-P.z);\n  play(CHAIN[i]);snd('swing');\n}\nfunction startMusou(){\n  if(phase!=='play'||P.locked||P.mu||P.musou<100)return;\n  P.mu={ph:'gather',t:0,n:0,used:new Set(),dash:null};P.musou=100;play('mGather');\n  flash(P.x,1.6,P.z,5,0xffd27a,.5);shockRing(P.x,.15,P.z,0xffd27a,.6,.5);snd('boom');addShake(.25);\n}\nfunction updMusou(dt){\n  const M=P.mu;M.t+=dt;P.musou=Math.max(0,P.musou-dt*38);\n  if(M.ph==='gather'){\n    if(Math.random()<.8){const a=rand(0,TAU),r=rand(3,5);const i=spIdx++%SPN,d=spD[i];spPos[i*3]=P.x+Math.cos(a)*r;spPos[i*3+1]=rand(.3,2);spPos[i*3+2]=P.z+Math.sin(a)*r;\n      d.vx=-Math.cos(a)*r*2.2;d.vz=-Math.sin(a)*r*2.2;d.vy=2;d.life=d.max=.45;d.r=1;d.g=.85;d.b=.4;}\n    if(M.t>.48){M.ph='dash';M.t=0;M.dash=null;}\n    return;\n  }\n  if(M.ph==='dash'){\n    if(!M.dash){\n      let best=null,bd=11;for(const u of U){if(!u.active||!u.alive||u.hidden||M.used.has(u))continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n      let tx,tz;if(best){M.used.add(best);const a=Math.atan2(best.x-P.x,best.z-P.z);tx=best.x-Math.sin(a)*1.5;tz=best.z-Math.cos(a)*1.5;P.yaw=a;}\n      else{const a=P.yaw+(M.n%2?.9:-.9);tx=P.x+Math.sin(a)*3.5;tz=P.z+Math.cos(a)*3.5;P.yaw=a;}\n      const hw=halfW(tz)-.8;tx=clamp(tx,-hw,hw);tz=Math.max(tz,gateZ);\n      M.dash={fx:P.x,fz:P.z,tx,tz,t:0,hit:false};play(M.n%2?'mSlashB':'mSlashA');snd('swing');\n    }\n    const D=M.dash;D.t+=dt;const k=EASE.out(clamp(D.t/.085,0,1));\n    P.x=lerp(D.fx,D.tx,k);P.z=lerp(D.fz,D.tz,k);\n    if(D.t<.1&&Math.floor(D.t/.025)!==Math.floor((D.t-dt)/.025))spawnGhost();\n    if(!D.hit&&D.t>.1){D.hit=true;const n=heroHit({r:3,arc:1.6,dmg:3,kb:5,launch:7,fwd:.6});if(n){snd('hit');hitStop=.04;addShake(.12);}}\n    if(D.t>.17){M.n++;M.dash=null;if(M.n>=6){M.ph='leap';M.t=0;play('mLeap');trail.color.setHex(0xffd27a);}}\n    return;\n  }\n  if(M.ph==='leap'){\n    P.flip=-TAU*EASE.io(clamp(M.t/.5,0,1));if(Math.floor(M.t/.06)!==Math.floor((M.t-dt)/.06))spawnGhost(0xffb050);\n    if(M.t>.52){M.ph='slam';M.t=0;P.flip=0;play('mSlam');\n      heroHit({r:7.5,arc:Math.PI,dmg:6,kb:12,fly:true});\n      shockRing(P.x,.15,P.z,0xffb050,2.8,.6);shockRing(P.x,.2,P.z,0xffe6b0,1.6,.4);flash(P.x,1.5,P.z,13,0xffb060,.6);sparks(P.x,1,P.z,70,true,1.4);\n      crack.m.position.set(P.x,.05,P.z);crack.t=0;crack.m.visible=true;\n      pillars.forEach((p,i)=>{const a=i/pillars.length*TAU,r=i?rand(2.5,5.5):0;p.m.position.set(P.x+Math.cos(a)*r,0,P.z+Math.sin(a)*r);p.t=-i*.04;p.m.visible=true;});\n      dust(P.x,P.z,10,true);addShake(.8);hitStop=.12;snd('boom');}\n    return;\n  }\n  if(M.ph==='slam'&&M.t>.8){P.mu=null;P.musou=0;trail.color.setHex(0xd8f4ff);}\n}\nfunction inputVec(){\n  let x=joy.x,y=joy.y;\n  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);\n  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}\n  return [x,y];\n}\nfunction updHero(dt){\n  P.inv=Math.max(0,P.inv-dt);P.comboWin-=dt;\n  const [jx,jz]=ST.auto?ST.auto:(P.locked||phase!=='play'?[0,0]:inputVec());const mag=Math.min(1,Math.hypot(jx,jz));\n  if(P.mu)updMusou(dt);\n  // 格擋\n  if(!P.mu&&!P.locked&&blkHeld&&(!P.clip||P.clip==='guard'||P.clip==='hurt'&&P.ct>250)){if(P.clip!=='guard')play('guard');}\n  else if(P.clip==='guard'&&!blkHeld){P.clip=null;}\n  P.blocking=P.clip==='guard'&&P.ct>70;\n  // 移動\n  let speed=7*mag;\n  if(P.mu)speed=0;else if(P.clip==='guard')speed=1.4*mag;else if(P.clip&&P.clip!=='hurt')speed=0;else if(P.clip==='hurt')speed=0;\n  P.moving=speed>.4;\n  if(P.moving){P.yaw=angLerp(P.yaw,Math.atan2(jx,jz),dt*(P.clip==='guard'?4:15));P.x+=jx/mag*speed*dt;P.z+=jz/mag*speed*dt;}\n  P.speed=speed;\n  P.x+=P.kvx*dt;P.z+=P.kvz*dt;const f=Math.pow(.002,dt);P.kvx*=f;P.kvz*=f;\n  // 招式推進\n  if(P.clip){\n    P.ct+=dt*1000;const C=HC[P.clip];\n    if(C.adv&&P.ct>C.adv[0]&&P.ct-dt*1000<C.adv[1]){const a=Math.max(P.ct-dt*1000,C.adv[0]),b=Math.min(P.ct,C.adv[1]);const dist=C.adv[2]*(b-a)/(C.adv[1]-C.adv[0]);\n      let near=99;for(const u of U){if(u.active&&u.alive&&!u.hidden){const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<near&&Math.abs(angDiff(P.yaw,Math.atan2(u.x-P.x,u.z-P.z)))<1)near=d;}}\n      const k=near<1.5?.15:1;P.x+=Math.sin(P.yaw)*dist*k;P.z+=Math.cos(P.yaw)*dist*k;}\n    if(C.hit&&!P.hitDone&&P.ct>=C.hit[0]){P.hitDone=true;const h=C.hit[1];const n=heroHit(h);\n      if(n){snd('hit');hitStop=P.clip==='c4'?.08:.04;addShake(P.clip==='c4'?.35:.12);}}\n    if(C.slam&&!P.slamDone&&P.ct>=C.slam){P.slamDone=true;const fx=P.x+Math.sin(P.yaw)*1.9,fz=P.z+Math.cos(P.yaw)*1.9;\n      shockRing(fx,.12,fz,0xffe6b0,1.25,.4);dust(fx,fz,7,true);flash(fx,.6,fz,4,0xffc070,.3);sparks(fx,.4,fz,24,true);snd('boom');addShake(.25);}\n    if(CHAIN.includes(P.clip)){\n      if((P.queued||atkHeld)&&C.chain&&P.ct>=C.chain&&P.lastAtk<3){nextAtk(P.lastAtk+1);}\n    }\n    if(P.clip==='hurt'&&P.queued&&P.ct>=200){P.clip=null;nextAtk(0);}\n    const last=C.k[C.k.length-1][0];\n    if(P.clip&&!C.hold&&P.ct>=last){if(CHAIN.includes(P.clip)){P.comboWin=.3;if(P.lastAtk>=3)P.lastAtk=-1;}P.clip=null;}\n  }\n  // 範圍\n  const hw=halfW(P.z)-.8;P.x=clamp(P.x,-hw,hw);P.z=clamp(P.z,gateZ,18);\n  P.vzN=lerp(P.vzN,(P.lastZ-P.z)/Math.max(dt,1e-4),Math.min(1,dt*10));P.lastZ=P.z;\n}\nconst vA=new THREE.Vector3(),vB=new THREE.Vector3();\nfunction poseHero(dt){\n  let p;\n  if(P.clip){p=evalClip(HC[P.clip],P.ct);}\n  else{\n    P.runW=lerp(P.runW,P.speed>.4?Math.min(1,P.speed/5):0,Math.min(1,dt*10));\n    const prevS=Math.sin(P.phase);P.phase+=dt*(4+P.speed*1.25);const s=Math.sin(P.phase);\n    if(P.runW .stats{display:flex;gap:22px;flex-wrap:wrap}.stats small{display:block;font-size:12px;letter-spacing:.15em;color:var(--dim)}.stats b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}\n.hint{font-size:12px;color:var(--dim)}\n@media (orientation:portrait){\n  .bars{width:40vw}\n  #cap{top:calc(128px + env(safe-area-inset-top,0px));max-width:92vw;font-size:14px;padding:6px 26px}\n  #judge{top:30%}#order{top:34%}\n  #combo{top:46%}\n}\n@media (max-height:460px) and (orientation:landscape){\n  #cap{font-size:14px;padding:5px 30px}\n  #bAtk{width:76px;height:76px;font-size:28px}\n  #bBlk,#bMus{width:56px;height:56px;font-size:18px}\n  #bBlk{right:calc(108px + env(safe-area-inset-right,0px))}\n  #bMus{right:calc(60px + env(safe-area-inset-right,0px));bottom:calc(108px + env(safe-area-inset-bottom,0px))}\n  #bOrd{width:62px;height:62px;font-size:19px;right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px))}\n  .card{padding:14px 18px;font-size:14px;line-height:1.55}\n}\n@media (orientation:landscape){.port{display:none}}\n</style>\n</head>\n<body data-next=\"ren\">\n\n<canvas id=\"gl\"></canvas>\n<div class=\"hud\">\n  <div id=\"pad\"></div>\n  <div id=\"joyBase\"><div id=\"joyKnob\"></div></div>\n  <div class=\"pl\">\n    <canvas id=\"face\" width=\"48\" height=\"48\"></canvas>\n    <div class=\"bars\">\n      <div class=\"name\">主將<small>五德・信</small></div>\n      <div class=\"bar\"><i id=\"hpFill\"></i></div>\n      <div class=\"bar mus\" id=\"musBar\"><i id=\"musFill\"></i></div>\n    </div>\n  </div>\n  <div id=\"morale\"><small>軍心</small><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>\n  <div id=\"kills\"><small>擊破</small><b id=\"killsN\">0</b></div>\n  <div class=\"tools\"><button type=\"button\" id=\"bBook\">兵書</button><button type=\"button\" id=\"bMute\">聲</button></div>\n  <div class=\"prog\" id=\"prog\"><span>一</span><span>二</span><span>三</span></div>\n  <div id=\"timer\" hidden><i></i><b>0</b><small></small></div>\n  <div id=\"day\" hidden></div>\n  <div id=\"cap\" hidden></div>\n  <div id=\"ctitle\"><div class=\"m\"></div><div class=\"s\"></div></div>\n  <div id=\"order\"><div class=\"t\"></div><div class=\"s\"></div></div>\n  <div id=\"judge\"><div class=\"t\"></div><div class=\"q\"></div><div class=\"g\"></div></div>\n  <div id=\"combo\"><b id=\"comboNum\">0</b><span>連擊</span></div>\n  <div class=\"pop\" id=\"pop0\"></div><div class=\"pop\" id=\"pop1\"></div><div class=\"pop\" id=\"pop2\"></div>\n  <div class=\"bub\" id=\"bub0\"></div><div class=\"bub\" id=\"bub1\"></div><div class=\"bub\" id=\"bub2\"></div><div class=\"bub\" id=\"bub3\"></div><div class=\"bub\" id=\"bub4\"></div><div class=\"bub\" id=\"bub5\"></div>\n  <div id=\"hurt\"></div>\n  <div id=\"fade\"></div>\n  <button class=\"btn\" id=\"bOrd\" type=\"button\" hidden>令<small id=\"ordL\"></small></button>\n  <button class=\"btn\" id=\"bMus\" type=\"button\">無雙</button>\n  <button class=\"btn\" id=\"bBlk\" type=\"button\">擋</button>\n  <button class=\"btn\" id=\"bAtk\" type=\"button\">攻</button>\n</div>\n\n<div class=\"over\" id=\"intro\">\n  <div class=\"card\">\n    <p class=\"kicker\">孫子論將・五德之二</p>\n    <h1>信</h1>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>《孫子・計篇》</span></p>\n    <p>這一關你要帶兵。部下肯不肯跟你衝，看的是<b>你說過的話算不算數</b>。</p>\n    <p>左上的「<b>軍心</b>」會隨你的作為升降。軍心高，下令時部下爭先恐後；軍心低，他們只會在後面觀望。可以下令的時候，右下會出現藍色的「<b>令</b>」鈕。</p>\n    <ul class=\"keys\">\n      <li><b>移動</b>　左半邊螢幕拖曳 <kbd>WASD</kbd></li>\n      <li><b>攻</b>　連按四段 <kbd>J</kbd></li>\n      <li><b>擋</b>　按住格擋 <kbd>K</kbd></li>\n      <li><b>令</b>　出現時按下，下達號令 <kbd>O</kbd></li>\n      <li><b>無雙</b>　氣滿後按下 <kbd>L</kbd></li>\n    </ul>\n    <p id=\"glWarn\" hidden style=\"color:#ff8a66;font-weight:700\"></p>\n    <button type=\"button\" class=\"cta\" id=\"bStart\">出兵</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu\">回目錄</button>\n    <p class=\"hint port\">手機橫放，戰場看得比較廣。</p>\n  </div>\n</div>\n\n<div class=\"over\" id=\"book\" hidden>\n  <div class=\"card\">\n    <h2>兵書</h2>\n    <ol class=\"lines\">\n      <li><b>將者，智、信、仁、勇、嚴也。</b><span>〈計篇〉做將領要具備的五種德行，信排第二。</span></li>\n      <li><b>信者，使人不惑於刑賞也。</b><span>杜牧注〈計篇〉：信，就是讓部下不懷疑你的賞罰。</span></li>\n      <li><b>信者，號令一也。</b><span>王皙注〈計篇〉：信，就是號令前後一致。</span></li>\n      <li><b>令素行以教其民，則民服；令不素行以教其民，則民不服。令素行者，與眾相得也。</b><span>〈行軍〉平時號令說到做到，部下才會服從；這是將領與部下互相信任的結果。</span></li>\n      <li><b>主孰有道？將孰有能？……法令孰行？……賞罰孰明？</b><span>〈計篇〉比較敵我時要問：誰的法令真的推行了，誰的賞罰分明。</span></li>\n    </ol>\n    <h3>史料</h3>\n    <ol class=\"lines\">\n      <li id=\"src-1\"><b>吳起倚轅立信</b><span>《韓非子・內儲說上》：吳起為西河守，欲攻秦之小亭，乃倚一車轅於北門之外，令曰：「有能徙此南門之外者，賜之上田上宅。」人莫之徙也。及有徙之者，遂賜之如令。俄又置一石赤菽東門之外，令曰：「有能徙此於西門之外者，賜之如初。」人爭徙之。乃下令曰：「明日且攻亭，有能先登者，仕之國大夫，賜之上田宅。」人爭趨之，於是攻亭，一朝而拔之。</span></li>\n      <li id=\"src-2\"><b>晉文公伐原</b><span>《左傳・僖公二十五年》：晉侯圍原，命三日之糧。原不降，命去之。諜出，曰：「原將降矣。」軍吏曰：「請待之。」公曰：「信，國之寶也，民之所庇也。得原失信，何以庇之？所亡滋多。」退一舍而原降。</span></li>\n    </ol>\n    <button type=\"button\" class=\"cta\" id=\"bBookClose\">回到戰場</button>\n  </div>\n</div>\n\n<div class=\"over choice\" id=\"choice\" hidden>\n  <div class=\"card\">\n    <p class=\"kicker\" id=\"chK\"></p>\n    <p id=\"chQ\" style=\"font-size:17px\"></p>\n    <div class=\"row\" id=\"chBtns\"></div>\n  </div>\n</div>\n\n<div class=\"over\" id=\"end\" hidden>\n  <div class=\"card wide\">\n    <p class=\"kicker\">關卡結算</p>\n    <h2>信・三次抉擇　<span id=\"endScore\"></span></h2>\n    <div class=\"stats\"><div><small>擊破</small><b id=\"eKills\">0</b></div><div><small>最大連擊</small><b id=\"eCombo\">0</b></div><div><small>用時</small><b id=\"eTime\">0:00</b></div></div>\n    <div class=\"tw\"><table><thead><tr><th></th><th>情境</th><th>你怎麼做</th><th>結果</th><th>兵書怎麼說</th></tr></thead><tbody id=\"endRows\"></tbody></table></div>\n    <h3>什麼是「信」</h3>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>〈計篇〉</span></p>\n    <p class=\"q\">「信者，使人不惑於刑賞也。」<span>杜牧注〈計篇〉</span></p>\n    <p class=\"q\">「信者，號令一也。」<span>王皙注〈計篇〉</span></p>\n    <p class=\"q\">「令素行者，與眾相得也。」<span>〈行軍〉</span></p>\n    <p>這一關的三次抉擇，就是「信」：一根車轅換上田上宅，看似不值，卻讓部下相信你的賞罰（<b>賞罰必信</b>）；平時說到做到，戰時一聲令下才有人爭先（<b>號令一</b>）；對敵人的約定也要守，晉文公寧可放掉眼前的原城，也不失信（<b>信為國寶</b>）。信不是一時的好處，而是一筆一筆累積、可以在戰場上兌現的力量。</p>\n    <button type=\"button\" class=\"cta\" id=\"bAgain\">再打一次</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu2\">回目錄</button>\n  </div>\n</div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=Math.PI*2;\nconst rand=(a,b)=>a+Math.random()*(b-a);\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};\nconst angLerp=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);\nconst EASE={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,snap:t=>1-Math.pow(1-t,4),sine:t=>.5-.5*Math.cos(Math.PI*t)};\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ================= 渲染器與場景 ================= */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\nfunction glNotice(t){const el=document.getElementById('cap');if(el){el.hidden=false;el.textContent=t;}const w=document.getElementById('glWarn');if(w){w.hidden=false;w.textContent=t;}}\ncanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glNotice('畫面資源被手機系統回收了（開太多頁面）。請關閉其他分頁後重新整理這一頁。');},false);\ncanvas.addEventListener('webglcontextrestored',()=>{try{renderer.resetState();}catch(e){}},false);\nif(!renderer.getContext())glNotice('這個瀏覽器無法建立立體畫面，請改用 Safari 或 Chrome 重新開啟。');\nconst scene=new THREE.Scene();\nconst HORIZON=0xe2a46a;\nscene.background=new THREE.Color(HORIZON);\nscene.fog=new THREE.Fog(HORIZON,70,200);\nconst camera=new THREE.PerspectiveCamera(50,1,.4,400);\nlet portrait=false;\nlet sky;\n{\n  const g=new TH .alive){\n    u.deadT+=dt;\n    if(u.flying){u.vy-=24*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.y+=u.vy*dt;u.tilt+=u.spin*dt;\n      if(u.y<=0&&u.vy<0){u.y=0;u.flying=false;u.tilt=-Math.PI/2;u.vx*=.2;u.vz*=.2;u.deadT=Math.min(u.deadT,.4);dust(u.x,u.z,3);}}\n    else{u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.004,dt);u.vx*=f;u.vz*=f;u.tilt+=(-Math.PI/2-u.tilt)*Math.min(1,dt*10);\n      if(u.deadT>2.6){u.y-=dt*.7;if(u.y<-.8)u.active=false;}}\n    return;\n  }\n  if(u.hidden)return;\n  if(u.cheer>0){u.cheer-=dt;u.y=Math.abs(Math.sin(u.cheer*9))*.35;u.moving=false;if(u.cheer<=0)u.y=0;return;}\n  if(u.air){u.vy-=24*dt;u.y+=u.vy*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.tilt=lerp(u.tilt,-.9,dt*6);\n    if(u.y<=0&&u.vy<0){u.y=0;u.air=false;u.down=.7;u.tilt=-Math.PI/2;dust(u.x,u.z,2);}return;}\n  if(u.down>0){u.down-=dt;u.tilt=-Math.PI/2;if(u.down<=0)u.rise=.4;return;}\n  if(u.rise>0){u.rise-=dt;u.tilt=-Math.PI/2*Math.max(0,u.rise/.4);return;}\n  u.cd-=dt;\n  if(u.stun>0){u.stun-=dt;u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.003,dt);u.vx*=f;u.vz*=f;u.tilt=-.45*Math.max(0,u.stun/.34);u.moving=false;return;}\n  u.tilt*=.82;\n  if(u.ai>0)u.ai-=dt;\n  const mv=(tx,tz,sp,face)=>{const ddx=tx-u.x,ddz=tz-u.z,dd=Math.hypot(ddx,ddz);if(dd<.05){u.moving=false;return true;}const s=Math.min(sp,dd/Math.max(dt,1e-4));\n    u.x+=ddx/dd*s*dt;u.z+=ddz/dd*s*dt;u.yaw=angLerp(u.yaw,face!=null?face:Math.atan2(ddx,ddz),dt*8);u.moving=s>.3;u.phase+=dt*s*2.8;return dd<.3;};\n  // 攻擊動作\n  if(u.atkT>0){\n    const prev=u.atkT;u.atkT-=dt;u.moving=false;const t=u.target;\n    if(t)u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*3);\n    if(prev>.28&&u.atkT<=.28&&!u.glinted){u.glinted=true;flash(u.x+Math.sin(u.yaw)*.9,1.7,u.z+Math.cos(u.yaw)*.9,.9,0xfff2c0,.25);}\n    if(prev>.13&&u.atkT<=.13&&t){\n      if(t===P){const d=Math.hypot(P.x-u.x,P.z-u.z);if(d<2.2){if(P.blocking&&facingTo(u.x,u.z)){snd('clang');sparks(P.x+(u.x-P.x)/d*.9,1.4,P.z+(u.z-P.z)/d*.9,10,false);u.stun=.5;u.vx=(u.x-P.x)/d*3;u.vz=(u.z-P.z)/d*3;u.atkT=0 ng=false;}\n      else u.moving=false;\n      return;}\n    case 'routTo':{u.noSpear=true;const d=Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z);mv(u.dest[0],u.dest[1],5);if(d<1.2){u.active=false;u.alive=false;}return;}\n    case 'guard':{\n      // 守兵：主將或我軍進入警戒範圍才迎戰，否則回原位\n      if(u.ai>0){u.moving=false;return;}\n      const foes=allies();const list=P.locked?foes:foes.concat([P]);\n      const t=nearestOf(u,list,u.leash||20);\n      if(t){u.mode='fight';u.target=t;}else if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6)mv(u.home[0],u.home[1],3);else{u.moving=false;if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*3);}\n      return;}\n    default:{ // fight\n      u.attn=false;\n      if(u.ai>0){u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*3);return;}\n      if(u.retarget<=0||!u.target||(u.target!==P&&!u.target.alive)){u.retarget=rand(.3,.6);const list=allies();if(!ST.cut)list.push(P);u.target=nearestOf(u,list,60)||P;}\n      const t=u.target;const d=Math.hypot(t.x-u.x,t.z-u.z);\n      if(d>1.7)mv(t.x,t.z,3.7);\n      else{u.moving=false;u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*8);if(u.cd<=0){u.atkT=.52;u.glinted=false;u.cd=rand(1.5,2.8);}}\n    }\n  }\n}\nfunction separate(){\n  for(let i=0;i<N;i++){const a=U[i];if(!a.active||!a.alive||a.hidden||a.air)continue;\n    for(let j=i+1;j<N;j++){const b=U[j];if(!b.active||!b.alive||b.hidden||b.air)continue;\n      const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz;if(d2<.72&&d2>1e-6){const d=Math.sqrt(d2),p=(.85-d)*.5/d;a.x-=dx*p;a.z-=dz*p;b.x+=dx*p;b.z+=dz*p;}}\n    const dx=a.x-P.x,dz=a.z-P.z,d2=dx*dx+dz*dz;if(d2<1.2&&d2>1e-6){const d=Math.sqrt(d2),p=(1.1-d)/d;a.x+=dx*p;a.z+=dz*p;}\n    if(!a.noClip)collideWalls(a,.4);\n    a.x=clamp(a.x,BND.x0-6,BND.x1+6);a.z=clamp(a.z,BND.z0-30,BND.z1+30);\n  }\n}\n/* ---------- 主將 ---------- */\nfunction startAttack(){\n  if(phase!=='play'||P.locked||P.mu)return;\n  if(P.clip&&CHAIN.includes(P.clip)){const c=HC[P.clip];if(c.chain&&P.ct<c.chain){P.queued=true;return;}if(P.lastAtk<3){nextAtk(P.lastAtk+1);}return;}\n  if(P.clip==='hurt'&&P.ct<200){P.queued=true;return;}\n  nextAtk(P.comboWin>0&&P.lastAtk>=0&&P.lastAtk<3?P.lastAtk+1:0);\n}\nfunction nextAtk(i){\n  P.lastAtk=i;P.queued=false;\n  let best=null,bd=6.5;for(const u of U){if(!u.active||!u.alive||u.hidden||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n  if(best)P.yaw=Math.atan2(best.x-P.x,best.z-P.z);\n  play(CHAIN[i]);snd('swing');\n}\nfunction startMusou(){\n  if(phase!=='play'||P.locked||P.mu||P.musou<100)return;\n  P.mu={ph:'gather',t:0,n:0,used:new Set(),dash:null};P.musou=100;play('mGather');\n  flash(P.x,1.6,P.z,5,0xffd27a,.5);shockRing(P.x,.15,P.z,0xffd27a,.6,.5);snd('boom');addShake(.25);\n}\nfunction updMusou(dt){\n  const M=P.mu;M.t+=dt;P.musou=Math.max(0,P.musou-dt*38);\n  if(M.ph==='gather'){\n    if(Math.random()<.8){const a=rand(0,TAU),r=rand(3,5);const i=spIdx++%SPN,d=spD[i];spPos[i*3]=P.x+Math.cos(a)*r;spPos[i*3+1]=rand(.3,2);spPos[i*3+2]=P.z+Math.sin(a)*r;\n      d.vx=-Math.cos(a)*r*2.2;d.vz=-Math.sin(a)*r*2.2;d.vy=2;d.life=d.max=.45;d.r=1;d.g=.85;d.b=.4;}\n    if(M.t>.48){M.ph='dash';M.t=0;M.dash=null;}\n    return;\n  }\n  if(M.ph==='dash'){\n    if(!M.dash){\n      let best=null,bd=11;for(const u of U){if(!u.active||!u.alive||u.hidden||M.used.has(u)||!isEnemyTeam(u.team)||u.passive)continue;const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<bd){bd=d;best=u;}}\n      let tx,tz;if(best){M.used.add(best);const a=Math.atan2(best.x-P.x,best.z-P.z);tx=best.x-Math.sin(a)*1.5;tz=best.z-Math.cos(a)*1.5;P.yaw=a;}\n      else{const a=P.yaw+(M.n%2?.9:-.9);tx=P.x+Math.sin(a)*3.5;tz=P.z+Math.cos(a)*3.5;P.yaw=a;}\n      tx=clamp(tx,BND.x0,BND.x1);tz=clamp(tz,BND.z0,BND.z1);\n      M.dash={fx:P.x,fz:P.z,tx,tz,t:0,hit:false};play(M.n%2?'mSlashB':'mSlashA');snd('swing');\n    }\n    const D=M.dash;D.t+=dt;const k=EASE.out(clamp(D.t/.085,0,1));\n    P.x=lerp(D.fx,D.tx,k);P.z=lerp(D.fz,D.tz,k);\n    if(D.t<.1&&Math.floor(D.t/.025)!==Math.floor((D.t-dt)/.025))spawnGhost();\n    if(!D.hit&&D.t>.1){D.hit=true;const n=heroHit({r:3,arc:1.6,dmg:3,kb:5,launch:7,fwd:.6});if(n){snd('hit');hitStop=.04;addShake(.12);}}\n    if(D.t>.17){M.n++;M.dash=null;if(M.n>=6){M.ph='leap';M.t=0;play('mLeap');trail.color.setHex(0xffd27a);}}\n    return;\n  }\n  if(M.ph==='leap'){\n    P.flip=-TAU*EASE.io(clamp(M.t/.5,0,1));if(Math.floor(M.t/.06)!==Math.floor((M.t-dt)/.06))spawnGhost(0xffb050);\n    if(M.t>.52){M.ph='slam';M.t=0;P.flip=0;play('mSlam');\n      heroHit({r:7.5,arc:Math.PI,dmg:6,kb:12,fly:true});\n      shockRing(P.x,.15,P.z,0xffb050,2.8,.6);shockRing(P.x,.2,P.z,0xffe6b0,1.6,.4);flash(P.x,1.5,P.z,13,0xffb060,.6);sparks(P.x,1,P.z,70,true,1.4);\n      crack.m.position.set(P.x,.05,P.z);crack.t=0;crack.m.visible=true;\n      pillars.forEach((p,i)=>{const a=i/pillars.length*TAU,r=i?rand(2.5,5.5):0;p.m.position.set(P.x+Math.cos(a)*r,0,P.z+Math.sin(a)*r);p.t=-i*.04;p.m.visible=true;});\n      dust(P.x,P.z,10,true);addShake(.8);hitStop=.12;snd('boom');}\n    return;\n  }\n  if(M.ph==='slam'&&M.t>.8){P.mu=null;P.musou=0;trail.color.setHex(0xd8f4ff);}\n}\nfunction inputVec(){\n  let x=joy.x,y=joy.y;\n  const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);\n  if(kx||ky){const l=Math.hypot(kx,ky);x=kx/l;y=ky/l;}\n  return [x,y];\n}\nfunction updHero(dt){\n  P.inv=Math.max(0,P.inv-dt);P.comboWin-=dt;\n  const [jx,jz]=ST.auto?ST.auto:(P.locked||phase!=='play'?[0,0]:inputVec());const mag=Math.min(1,Math.hypot(jx,jz));\n  if(P.mu)updMusou(dt);\n  // 格擋\n  if(!P.mu&&!P.locked&&blkHeld&&(!P.clip||P.clip==='guard'||P.clip==='hurt'&&P.ct>250)){if(P.clip!=='guard')play('guard');}\n  else if(P.clip==='guard'&&!blkHeld){P.clip=null;}\n  P.blocking=P.clip==='guard'&&P.ct>70;\n  // 移動\n  let speed=7*mag;\n  if(P.mu)speed=0;else if(P.clip==='guard')speed=1.4*mag;else if(P.clip&&P.clip!=='hurt')speed=0;else if(P.clip==='hurt')speed=0;\n  P.moving=speed>.4;\n  if(P.moving){P.yaw=angLerp(P.yaw,Math.atan2(jx,jz),dt*(P.clip==='guard'?4:15));P.x+=jx/mag*speed*dt;P.z+=jz/mag*speed*dt;}\n  P.speed=speed;\n  P.x+=P.kvx*dt;P.z+=P.kvz*dt;const f=Math.pow(.002,dt);P.kvx*=f;P.kvz*=f;\n  // 招式推進\n  if(P.clip){\n    P.ct+=dt*1000;const C=HC[P.clip];\n    if(C.adv&&P.ct>C.adv[0]&&P.ct-dt*1000<C.adv[1]){const a=Math.max(P.ct-dt*1000,C.adv[0]),b=Math.min(P.ct,C.adv[1]);const dist=C.adv[2]*(b-a)/(C.adv[1]-C.adv[0]);\n      let near=99;for(const u of U){if(u.active&&u.alive&&!u.hidden&&isEnemyTeam(u.team)){const d=Math.hypot(u.x-P.x,u.z-P.z);if(d<near&&Math.abs(angDiff(P.yaw,Math.atan2(u.x-P.x,u.z-P.z)))<1)near=d;}}\n      const k=near<1.5?.15:1;P.x+=Math.sin(P.yaw)*dist*k;P.z+=Math.cos(P.yaw)*dist*k;}\n    if(C.hit&&!P.hitDone&&P.ct>=C.hit[0]){P.hitDone=true;const h=C.hit[1];const n=heroHit(h);\n      if(n){snd('hit');hitStop=P.clip==='c4'?.08:.04;addShake(P.clip==='c4'?.35:.12);}}\n    if(C.slam&&!P.slamDone&&P.ct>=C.slam){P.slamDone=true;const fx=P.x+Math.sin(P.yaw)*1.9,fz=P.z+Math.cos(P.yaw)*1.9;\n      shockRing(fx,.12,fz,0xffe6b0,1.25,.4);dust(fx,fz,7,true);flash(fx,.6,fz,4,0xffc070,.3);sparks(fx,.4,fz,24,true);snd('boom');addShake(.25);}\n    if(CHAIN.includes(P.clip)){\n      if((P.queued||atkHeld)&&C.chain&&P.ct>=C.chain&&P.lastAtk<3){nextAtk(P.lastAtk+1);}\n    }\n    if(P.clip==='hurt'&&P.queued&&P.ct>=200){P.clip=null;nextAtk(0);}\n    const last=C.k[C.k.length-1][0];\n    if(P.clip&&!C.hold&&P.ct>=last){if(CHAIN.includes(P.clip)){P.comboWin=.3;if(P.lastAtk>=3)P.lastAtk=-1;}P.clip=null;}\n  }\n  // 範圍\n  collideWalls(P,.6);P.x=clamp(P.x,BND.x0,BND.x1);P.z=clamp(P.z,BND.z0,BND.z1);\n  P.vzN=lerp(P.vzN,(P.lastZ-P.z)/Math.max(dt,1e-4),Math.min(1,dt*10));P.lastZ=P.z;\n}\nconst vA=new THREE.Vector3(),vB=new THREE.Vector3();\nfunction poseHero(dt){\n  let p;\n  if(P.clip){p=evalClip(HC[P.clip],P.ct);}\n  else{\n    P.runW=lerp(P.runW,P.speed>.4?Math.min(1,P.speed/5):0,Math.min(1,dt*10));\n    const prevS=Math.sin(P.phase);P.phase+=dt*(4+P.speed*1.25);const s=Math.sin(P.phase);\n    if(P.runW>.5&&Math.sign(s)!==Math.sign(prevS)){puff(P.x+rand(-.3,.3),.2,P.z+rand(-.3,.3),.4,1.2,.5,.4,0,.6,0);}\n    const br=Math.sin(clock*1.8);const idle=Object.assign({},PD,{gy:PD.gy+br*.015,ux:PD.ux+br*.02,y:br*.01});\n    const run=Object.assign({},PD,POSE.run,{lL:s*.95,lR:-s*.95,y:Math.abs(Math.cos(P.phase))*.1,uy:POSE.run.uy+s*.15,uz:s*.05});\n    const target=lerpPose(idle,run,P.runW);\n    p=lerpPose(P.pose,target,Math.min(1,dt*16));\n  }\n  P.pose=p;\n  H.root.position.set(P.x,0,P.z);H.root.rotation.y=P.yaw;\n  H.body.position.y=(pv(p,'y')-pv(p,'cr')*.3)*S;\n  H.body.rotation.set(pv(p,'bx')+P.flip,pv(p,'by'),0);\n  H.upper.rotation.set(pv(p,'ux'),pv(p,'uy'),pv(p,'uz'));\n  H.legL.rotation.x=pv(p,'lL')-pv(p,'cr')*.6;H.legR.rotation.x=pv(p,'lR')+pv(p,'cr')*.6;\n  H.grip.position.set(pv(p,'gx'),pv(p,'gy'),pv(p,'gz'));H.grip.rotation.set(pv(p,'wx'),pv(p,'wy'),pv(p,'wz'));\n  H.cape.rotation.x=.18+P.runW*.55+Math.sin(clock*3.1)*.05+(P.clip&&P.clip!=='guard'?.12:0)+(P.mu?.35:0);\n  updFeathers(dt);\n  H.root.updateMatrixWorld(true);updTassel(dt);\n  H.grip.getWorldPosition(vA);H.armR.lookAt(vA);\n  const bowing=P.clip==='bow'&&!!P.aim;H.bow.visible=bowing;H.grip.visible=!bowing;\n  if(bowing){H.armL.lookAt(P.aim);H.armR.lookAt(vB.copy(P.aim).add({x:0,y:-.2,z:0}));}\n  else{H.grip.localToWorld(vB.set(0,0,-.58));H.armL.lookAt(vB);}\n  // 刀光\n  const C=P.clip&&HC[P.clip];\n  if(C&&C.trail&&P.ct>=C.trail[0]&&P.ct<=C.trail[1]){H.tipM.getWorldPosition(vA);H.baseM.getWorldPosition(vB);trail.push(vA,vB);}\n}\n\n/* ================= 三事：信 ================= */\nconst XIN_TEXT={\n  1:{saw:'懸賞：搬一根車轅到南門外，賜上田上宅；眾人不信',book:'信者，使人不惑於刑賞也。（杜牧注）',bookNote:'說了要賞就照賞，部下才不會懷疑你的賞罰。<br>史例：吳起為西河守，倚車轅於北門外，有徙之者，「遂賜之如令」；再置赤菽，「人爭徙之」。（《韓非子・內儲說上》）'},\n  2:{saw:'下令攻秦人小亭：「先登者，仕之國大夫，賜之上田宅」',book:'令素行以教其民，則民服；令不素行以教其民，則民不服。（〈行軍〉）',bookNote:'平時說話算話，打仗時號令才有人聽。<br>史例：吳起下令攻亭，「人爭趨之」，一朝而拔之。（《韓非子・內儲說上》）'},\n  3:{saw:'伐原，約定三日之糧；期滿時諜者報「原將降矣」',book:'信，國之寶也，民之所庇也。得原失信，何以庇之？（《左傳・僖公二十五年》）',bookNote:'對敵人也要守信。晉文公依約退兵，「退一舍而原降」。'},\n};\nconst inTownPt=p=>p.x>XIHE.w&&p.x<XIHE.e&&p.z>XIHE.n&&p.z<XIHE.s;\nconst sideOf=p=>inTownPt(p)?'in':(p.z<=XIHE.n?'N':p.z>=XIHE.s?'S':p.x>=XIHE.e?'E':'W');\nconst GATEPT={N:[[0,XIHE.n-2.4],[0,XIHE.n+2.4]],S:[[0,XIHE.s+2.4],[0,XIHE.s-2.4]],E:[[XIHE.e+2.4,5],[XIHE.e-2.4,5]],W:[[XIHE.w-2.4,5],[XIHE.w+2.4,5]]};\nfunction planPath(from,to){const a=sideOf(from),b=sideOf(to);if(a===b)return [[to.x,to.z]];\n  if(a==='in')return [GATEPT[b][1],GATEPT[b][0],[to.x,to.z]];\n  if(b==='in')return [GATEPT[a][0],GATEPT[a][1],[to.x,to.z]];\n  return [GATEPT[a][0],GATEPT[a][1],GATEPT[b][1],GATEPT[b][0],[to.x,to.z]];}\nfunction goTo(u,dest,mode,cb,spd){u.path=planPath(u,{x:dest[0],z:dest[1]});u.dest=u.path.shift();u.mode=mode;u.onArrive=cb||null;if(spd)u.cspd=spd;}\nconst FOCUS_T={x:0,z:0,y:1.2,hi:0};\nfunction focus(x,z,y,hi){if(x==null){camFocus=null;return;}FOCUS_T.x=x;FOCUS_T.z=z;FOCUS_T.y=y==null?1.2:y;FOCUS_T.hi=hi||0;camFocus=FOCUS_T;}\nconst ST={hardK:1,ch:0,step:'',t:0,st:0,log:{},morale:.15,orderReady:null,orderLabel:'',cut:false,day:0,night:0,look:0,chargeTo:null,auto:null,title:null};\nconst later={q:[],add(sec,fn){this.q.push({t:sec,fn});},tick(dt){for(let i=this.q.length-1;i>=0;i--){const e=this.q[i];e.t-=dt;if(e.t<=0){this.q.splice(i,1);try{e.fn();}catch(err){console.error(err);}}}},clear(){this.q.length=0;}};\nfunction updProg(){const sp=$('prog').children;for(let i=0;i<3;i++){const n=i+1,L=ST.log[n];sp[i].className=L?(L.good?'ok':'ng'):(ST.ch===n?'now':'');}}\nfunction harden(){ST.hardK=3;U.forEach(u=>{if(u.active&&u.alive&&isEnemyTeam(u.team)&&!u.hardened){u.hardened=true;u.hp*=3;u.keen=true;}});popText(P.x,3.4,P.z-2,'敵勢三倍','#ff8a66');snd('drum');hardenHero();}\nfunction stillNow(){return !P.moving&&(!P.clip||P.clip==='guard');}\nfunction setMorale(v){ST.morale=clamp(v,0,1);const on=Math.round(8*ST.morale);const el=$('morale').querySelectorAll('i');el.forEach((e,i)=>e.classList.toggle('on',i<on));}\nfunction setOrder(label,fn){ST.orderReady=fn;ST.orderLabel=label||'';const b=$('bOrd');b.hidden=!fn;$('ordL').textContent=label||'';}\nfunction doOrder(){if(ST.orderReady&&phase==='play'&&!paused){const fn=ST.orderReady;setOrder('',null);fn();}}\nfunction showOrder(text,sub,dur){const el=$('order');el.querySelector('.t').textContent=text;el.querySelector('.s').textContent=sub||'';\n  el.animate([{opacity:0,transform:'translateX(-50%) translateY(10px)'},{opacity:1,transform:'translateX(-50%) translateY(0)',offset:.08},{opacity:1,offset:.86},{opacity:0}],{duration:(dur||4.2)*1000,easing:'ease-out',fill:'forwards'});snd('drum');}\nfunction chapterTitle(main,sub){const el=$('ctitle');el.querySelector('.m').textContent=main;el.querySelector('.s').textContent=sub;\n  el.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:3600,fill:'forwards'});MUS.gong();}\nlet bubIdx=0;const bubs=[];\nfunction bubble(u,txt,dur){const el=$('bub'+(bubIdx++%6));el.textContent=txt;const old=bubs.find(b=>b.el===el);if(old)bubs.splice(bubs.indexOf(old),1);bubs.push({el,u,t:0,dur:dur||2});}\nfunction fadeTo(fn){const f=$('fade');f.animate([{opacity:0},{opacity:1}],{duration:650,fill:'forwards'});later.add(.7,()=>{fn();f.animate([{opacity:1},{opacity:0}],{duration:700,fill:'forwards'});});}\nfunction askChoice(kicker,q,opts){paused=true;$('chK').textContent=kicker;$('chQ').textContent=q;const box=$('chBtns');box.innerHTML='';\n  opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='chb'+(i?'':' main');b.textContent=o.t;b.addEventListener('click',()=>{$('choice').hidden=true;paused=false;o.fn();});box.appendChild(b);});$('choice').hidden=false;}\nfunction setDay(t){const el=$('day');if(!t){el.hidden=true;return;}el.hidden=false;el.textContent=t;}\nfunction clearUnits(){for(const u of U){u.active=false;u.alive=false;}flags.forEach(f=>{f.unit=null;f.fall=null;f.g.visible=false;});arrows.forEach(a=>{a.on=fals terTitle('一　倚轅立信','吳起守西河・《韓非子・內儲說上》');\n  setCap('西河守將吳起要拔掉秦人的小亭，但部下還不信他的號令。走到北門外的車轅旁下令。');\n}\nfunction ch1Update(dt){\n  const A=CH1.allies.filter(a=>a.alive);const sh=PROPS.shaft;\n  if(ST.step==='go'){\n    setMarker(sh.x,sh.z);\n    if(Math.hypot(P.x-sh.x,P.z-sh.z)<7&&!ST.orderReady)setOrder('懸賞',()=>{ST.step='wait1';ST.st=0;ST.cut=true;P.yaw=0;setMarker(null);\n      showOrder('有能徙此南門之外者，賜之上田上宅。','搬這根車轅到南門外，就賞上等田宅');focus(0,(P.z+14)/2+3,1.2,9);setCap('懸賞已下。眾人面面相覷……');});\n    else if(Math.hypot(P.x-sh.x,P.z-sh.z)>=7&&ST.orderReady)setOrder('',null);\n  }\n  else if(ST.step==='wait1'){ST.st+=dt;\n    if(ST.st>1.2&&ST.st<6.5&&Math.random()<dt*1.6){bubble(A[(Math.random()*A.length)|0],['一根車轅換田宅？','必是戲言','誰信？','莫非有詐','看看再說'][(Math.random()*5)|0]);}\n    if(ST.st>7){ST.step='carry1';const a=A[3];bubble(a,'我來試試。',2);setCap('終於有一個人走了出來。');\n      goTo(a,[sh.x+.8,sh.z+.8],'rush',(a)=>{sh.carrier=a;goTo(a,[0,XIHE.s+5],'carry',(a)=>{sh.carrier=null;sh.x=1.2;sh.z=XIHE.s+6;sh.g.position.set(1.2,.1,XIHE.s+6);sh.g.rotation.set(0,.3,0);a.mode='attn';a.home=[a.x,a.z];a.faceYaw=0;ST.step='choice1';ST.st=0;},4);},4.6);}\n  }\n  else if(ST.step==='carry1'){const a=A[3];if(a)focus(a.x,a.z,1.2,0);}\n  else if(ST.step==='choice1'){ST.st+=dt;if(ST.st>.8){ST.step='choosing';askChoice('他真的把車轅搬到了南門外','主簿在你耳邊說：「區區一根車轅，賜上田上宅未免太重了，給他幾枚錢打發就好。」',[\n      {t:'如令賜之：上田上宅',fn:()=>reward1(true)},{t:'給幾枚錢打發',fn:()=>reward1(false)}]);}}\n  else if(ST.step==='bean'){const b=PROPS.beans;setMarker(b.x,b.z);\n    if(Math.hypot(P.x-b.x,P.z-b.z)<7&&!ST.orderReady)setOrder('懸賞',()=>{ST.step='wait2';ST.st=0;ST.cut=true;ST.rush=false;setMarker(null);\n      showOrder('有能徙此赤菽於西門之外者，賜之如初。','搬這石赤豆到西門外，照上次一樣賞');focus(8,10,1.2,9);});\n    else if(Math.hypot(P.x-b.x,P.z-b.z)>=7&&ST.orderReady)setOrder('',null);\n  }\n  else if(ST.step==='wait2'){ST.st+=dt;const b=PROPS.beans;\n    if(CH1.trust){\n      if(!ST.rush&&ST.st>1){ST.rush=true;setCap('這一次，眾人爭先恐後。');\n        A.filter(a=>a!==A[3]).slice(0,7).forEach((a,i)=>{bubble(a,['我來！','讓我搬！','上田上宅！'][i%3],1.6);\n          goTo(a,[b.x+rand(-1.2,1.2)-1.5,b.z+rand(-1.2,1.2)],'rush',(a)=>{if(b.carrier){a.mode='attn';a.home=[a.x,a.z];return;}b.carrier=a;goTo(a,[XIHE.w-5,5],'carry',(a)=>{b.carrier=null;b.x=XIHE.w-6;b.z=6;b.g.position.set(b.x,0,b.z);a.cheer=1.4;a.mode='attn';a.home=[a.x,a.z];ST.step='reward2';ST.st=0;},4.4);},5+Math.random()*1.5);});}\n      if(b.carrier)focus(b.carrier.x,b.carrier.z,1.2,0);\n    }else{\n      if(ST.st>1&&ST.st<7&&Math.random()<dt*1.6)bubble(A[(Math.random()*A.length)|0],['上回不過給了幾枚錢','又是戲言','誰還信他','別白費力氣'][(Math.random()*4)|0]);\n      if(ST.st>8){ST.step='end1';setCap('人莫之徙。沒有人再理會這道命令。');ST.log[1]={did:'第一次搬完只給了幾枚錢',out:'第二次懸賞，無人理會',good:false};updProg();later.add(2.5,toAttackOrder);}\n    }\n  }\n  else if(ST.step==='reward2'){ST.st+=dt;if(ST.st>.3&&!ST.r2){ST.r2=true;popText(PROPS.beans.x,2.6,PROPS.beans.z,'賜之如初');MUS.gong();setMorale(ST.morale+.3);\n      A.forEach((a,i)=>{if(a.mode==='attn'||a.mode==='rush')later.add(i*.08,()=>{a.cheer=1.3;});});setCap('人爭徙之。軍心大振。');ST.log[1]={did:'第一次就如令賜之',out:'第二次懸賞，人爭徙之',good:true};updProg();later.add(2.6,toAttackOrder);}}\n}\nfunction reward1(full){const A=CH1.allies.filter(a=>a.alive);const a=A[3];ST.cut=false;focus(a.x,a.z,1.2,0);later.add(3,()=>{if(ST.step==='bean')focus(null);});\n  if(full){CH1.trust=true;setMorale(.5);popText(a.x,2.6,a.z,'賜上田上宅');MUS.gong();a.cheer=1.4;A.forEach((q,i)=>{if(q!==a)bubble(q,['真的給了！','說到做到！','原來是真的'][i%3],2);});setCap('他真的領到了上田上宅。眾人議論紛紛。');}\n  else{CH1.trust=false;setMorale(.05);popText(a.x,2.6,a.z,'賞錢三枚','#ff8a66');snd('drum');A.forEach((q,i)=>{if(q!==a)bubble(q,['果然是戲言','說的是田宅……','哼'][i%3],2);});setCap('他只領到幾枚錢。眾人搖頭散去。');}\n  ST.step='bean';ST.st=0;placeProp(PROPS.beans,XIHE.e+4.5,6);\n  later.add(2.2,()=>setCap('又在東門外放了一石赤豆。走過去，再下一次懸賞。'));\n}\nfunction toAttackOrder(){ST.cut=false;focus(null);setMarker(null);setCap('秦人在邊境有一座小亭。下令攻亭。');\n  setOrder('下令',()=>{showOrder('明日且攻亭，有能先登者，仕之國大夫，賜之上田宅。');ST.cut=true;later.add(3.2,()=>fadeTo(startCh2));});}\n\n/* ---------- 二、攻亭 ---------- */\nlet CH2=null;\nfunction startCh2(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=2;ST.step='order';ST.t=0;updProg();\n  BND={x0:-30,x1:30,z0:TING.z-6,z1:-120};\n  placeHero(0,-150,Math.PI);\n  const A=spawnAllies(12,0,-144,Math.PI,'follow','wei');\n  const n=Math.round(12*ST.morale);A.forEach((a,i)=>a.eager=i<n);\n  CH2={allies:A,eagerN:n,taken:false,climb:false,spent:false,vt:0,t0:0};\n  // 秦亭守兵與崖頂弓手\n  for(let i=0;i<22;i++){const a=rand(-1.2,1.2),r=rand(5,9.5);const x=TING.x+Math.sin(a)*r,z=TING.z+Math.cos(a)*r+2;\n    const u=spawnFoe(x,z,0,{team:0,group:'qin',mode:'guard',home:[x,z],leash:22,faceYaw:0,ai:.3+i*.1});if(u&&i%7===3)attachFlag(u,BMAT.qin);}\n  tingArchers().forEach(a=>{a.on=true;a.g.visible=true;a.glintOn=true;});\n  chapterTitle('二　攻亭','先登者賞・《韓非子・內儲說上》');\n  setCap('翌日清晨。按「令」下令攻亭：先登者賞。');\n  setOrder('攻亭',()=>{ST.step='fight';CH2.t0=elapsed;showOrder('攻亭！先登者，仕之國大夫，賜之上田宅。');ST.chargeTo=[TING.x,TING.z+4];\n    A.forEach((a,i)=>{if(a.eager){a.mode='charge';a.dest=[TING.x,TING.z+4];later.add(.2+i*.12,()=>bubble(a,['衝啊！','先登者賞！','跟上！','我先！'][i%4],1.5));}else{a.mode='hold';a.home=[a.x,a.z];a.faceYaw=Math.PI;later.add(1+i*.3,()=>bubble(a,['看看再說','誰知道賞不賞','上回……'][i%3],1.8));}});\n    if(n<7)harden();if(n>=7)setCap('人爭趨之：部下爭先衝向小亭。');else if(n>=3)setCap('只有少數人跟上，其餘的人遠遠觀望。');else setCap('沒有人跟上。你只能孤身攻亭。');});\n}\nfunction ch2Update(dt){\n  const C=CH2;if(ST.step!=='fight')return;\n  if(P.hp<=P.max*.1+.5&&!C.taken&&!C.spent){C.spent=true;ST.cut=true;C.allies.forEach(a=>{if(a.alive)a.mode='follow';});setCap('力戰不支，只能暫且退兵。');\n    later.add(1.6,()=>{judge(false,'孤軍苦戰','令素行以教其民，則民服。','部下不信你的賞，沒有人跟你衝');ST.log[2]={did:'下令「先登者賞」',out:'只有 '+C.eagerN+' 人跟上，力戰不支而退',good:false};updProg();later.add(4,()=>fadeTo(startCh3));});return;}\n  C.vt+=dt;if(C.vt>5.5&&Math.hypot(TING.x-P.x,TING.z-P.z)<32){C.vt=0;volleyFrom(tingArchers(),8);}\n  const guards=aliveG('qin');\n  if(guards.length===0&&!C.climb){C.climb=true;setCap('守兵已破。誰先登上小亭？');setMarker(TING.x,TING.z+4);\n    C.allies.filter(a=>a.alive&&a.eager).forEach(a=>{a.mode='rush';a.dest=[TING.x+rand(-1,1),TING.z+4.6];a.cspd=6;a.onArrive=(a)=>{if(!C.taken)takeTower(a);a.cheer=1.5;a.mode='attn';a.home=[a.x,a.z];};});}\n  if(C.climb&&!C.taken&&Math.hypot(P.x-TING.x,P.z-(TING.z+4))<2.2)takeTower(P);\n}\nfunction takeTower(who){const C=CH2;C.taken=true;setMarker(null);tingArchers().forEach(a=>{if(a.on&&!a.fall)archerHit(a);});tingFlag.f.cloth.material=BMAT.wei;\n  popText(TING.x,8,TING.z,who===P?'先登！':'先登！');flash(TING.x,6,TING.z,5,0xffd27a,.5);\n  const sec=elapsed-C.t0,n=C.eagerN,good=n>=7;\n  C.allies.forEach(a=>{if(a.alive){a.cheer=1.6;a.mode='attn';a.home=[a.x,a.z];}});\n  later.add(1.2,()=>{judge(good,good?'一朝而拔':'孤軍苦戰','令素行以教其民，則民服。',good?'部下信你的賞，人爭趨之':'部下不信你的賞，只能自己硬打');\n    ST.log[2]={did:'下令「先登者賞」',out:(good?n+' 人爭先跟上，'+Math.round(sec)+' 秒拔亭':'只有 '+n+' 人跟上，'+Math.round(sec)+' 秒才拔亭'),good};updProg();\n    later.add(4,()=>fadeTo(startCh3));});\n}\n\n/* ---------- 三、伐原守約 ---------- */\nlet CH3=null;\nfunction startCh3(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=3;ST.step='order';ST.t=0;ST.day=0;setMorale(.6);updProg();\n  BND={x0:-30,x1:30,z0:YUAN.z+4,z1:-230};\n  placeHero(0,-268,Math.PI);\n  const A=spawnAllies(8,0,-262,Math.PI,'follow','jin');A.forEach((a,i)=>a.eager=i<5);\n  CH3={allies:A,dt:0,nt:0,vt:0,spy:null,spyArr:false,sallied:false,d4done:false,turned:false};\n  yuanArchers().forEach(a=>{a.on=true;a.g.visible=true;a.glintOn=false;});\n  chapterTitle('三　伐原守約','晉文公伐原・《左傳・僖公二十五年》');\n  setCap('另一場戰事：晉文公伐原。走到原城下，按「令」宣告期限。');\n}\nfunction dayStart(){const C=CH3;C.dt=0;setDay('第'+'一二三四'[ST.day-1]+'日');\n  setCap('第'+'一二三四'[ST.day-1]+'日'+(ST.day===1?'：原人閉城不出，派兵出城試探。':ST.day===2?'：原人仍不肯降。':'：期限的最後一天。'));\n  const n=ST.day===3?9:6;yuanGate.open=1;\n  for(let i=0;i<n;i++)later.add(.8+i*.35,()=>{const u=spawnFoe(rand(-1.5,1.5),YUAN.z+3,0,{team:2,group:'yuan',mode:'fight',hp:7,ai:.6+i*.2,noC den><i></i><b>0</b><small></small></div>\n  <div id=\"day\" hidden></div>\n  <div id=\"cap\" hidden></div>\n  <div id=\"ctitle\"><div class=\"m\"></div><div class=\"s\"></div></div>\n  <div id=\"order\"><div class=\"t\"></div><div class=\"s\"></div></div>\n  <div id=\"judge\"><div class=\"t\"></div><div class=\"q\"></div><div class=\"g\"></div></div>\n  <div id=\"combo\"><b id=\"comboNum\">0</b><span>連擊</span></div>\n  <div class=\"pop\" id=\"pop0\"></div><div class=\"pop\" id=\"pop1\"></div><div class=\"pop\" id=\"pop2\"></div>\n  <div class=\"bub\" id=\"bub0\"></div><div class=\"bub\" id=\"bub1\"></div><div class=\"bub\" id=\"bub2\"></div><div class=\"bub\" id=\"bub3\"></div><div class=\"bub\" id=\"bub4\"></div><div class=\"bub\" id=\"bub5\"></div>\n  <div id=\"hurt\"></div>\n  <div id=\"fade\"></div>\n  <button class=\"btn\" id=\"bOrd\" type=\"button\" hidden><span id=\"ordB\">令</span><small id=\"ordL\"></small></button>\n  <button class=\"btn\" id=\"bMus\" type=\"button\">無雙</button>\n  <button class=\"btn\" id=\"bBlk\" type=\"button\">擋</button>\n  <button class=\"btn\" id=\"bAtk\" type=\"button\">攻</button>\n</div>\n\n<div class=\"over\" id=\"intro\">\n  <div class=\"card\">\n    <p class=\"kicker\">孫子論將・五德之三</p>\n    <h1>仁</h1>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>《孫子・計篇》</span></p>\n    <p>這一關看的是<b>你怎麼對待人</b>：自己的士卒、投降的敵人，還有戰場上正在渡河的敵軍。</p>\n    <p>左上的「<b>軍心</b>」會隨你的作為升降。軍心高，下令時部下爭先恐後；軍心低，他們只會在後面觀望。右下出現藍色的「<b>撫</b>」或「<b>令</b>」時按下。</p>\n    <ul class=\"keys\">\n      <li><b>移動</b>　左半邊螢幕拖曳 <kbd>WASD</kbd></li>\n      <li><b>攻</b>　連按四段 <kbd>J</kbd></li>\n      <li><b>擋</b>　按住格擋 <kbd>K</kbd></li>\n      <li><b>撫／令</b>　出現時按下 <kbd>O</kbd></li>\n      <li><b>無雙</b>　氣滿後按下 <kbd>L</kbd></li>\n    </ul>\n    <p id=\"glWarn\" hidden style=\"color:#ff8a66;font-weight:700\"></p>\n    <button type=\"button\" class=\"cta\" id=\"bStart\">出兵</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu\">回目錄</button>\n    <p class=\"hint port\">手機橫放，戰場看得比較廣。</p>\n  </div>\n</div>\n\n<div class=\"over\" id=\"book\" hidden>\n  <div class=\"card\">\n    <h2>兵書</h2>\n    <ol class=\"lines\">\n      <li><b>將者，智、信、仁、勇、嚴也。</b><span>〈計篇〉做將領要具備的五種德行，仁排第三。</span></li>\n      <li><b>仁者，愛人憫物，知勤勞也。</b><span>杜牧注〈計篇〉：仁，就是愛護人、體恤人，知道部下的辛勞。</span></li>\n      <li><b>視卒如嬰兒，故可與之赴深谿；視卒如愛子，故可與之俱死。</b><span>〈地形〉把士卒當成自己的孩子疼，他們才肯跟你赴險、與你同死。</span></li>\n      <li><b>卒善而養之，是謂勝敵而益強。</b><span>〈作戰〉善待俘虜、收為己用，打勝仗之後反而更強。</span></li>\n      <li><b>客絕水而來，勿迎之於水內，令半濟而擊之，利。</b><span>〈行軍〉敵軍渡河而來，等他渡到一半時出擊最有利。</span></li>\n      <li><b>厚而不能使，愛而不能令，亂而不能治，譬若驕子，不可用也。</b><span>〈地形〉仁也有界線：只愛不管，兵就像被寵壞的孩子，不能用。這是下一關「嚴」要談的。</span></li>\n    </ol>\n    <h3>史料</h3>\n    <ol class=\"lines\">\n      <li id=\"src-1\"><b>楚子伐蕭（挾纊）</b><span>《左傳・宣公十二年》：冬，楚子伐蕭……申公巫臣曰：「師人多寒。」王巡三軍，拊而勉之。三軍之士，皆如挾纊。遂傅於蕭。……明日，蕭潰。</span></li>\n      <li id=\"src-2\"><b>光武推心</b><span>《後漢書・光武帝紀》：降者更相語曰：「蕭王推赤心置人腹中，安得不投死乎！」</span></li>\n      <li id=\"src-3\"><b>宋襄公泓之戰</b><span>《左傳・僖公二十二年》：宋人既成列，楚人未既濟。司馬曰：「彼眾我寡，及其未既濟也，請擊之。」公曰：「不可。」既濟而未成列，又以告。公曰：「未可。」既陳而後擊之，宋師敗績。公傷股，門官殲焉。……公曰：「君子不重傷，不禽二毛。古之為軍也，不以阻隘也。寡人雖亡國之餘，不鼓不成列。」子魚曰：「君未知戰。……傷未及死，如何勿重？若愛重傷，則如勿傷；愛其二毛，則如服焉。」</span></li>\n    </ol>\n    <button type=\"button\" class=\"cta\" id=\"bBookClose\">回到戰場</button>\n  </div>\n</div>\n\n<div class=\"over choice\" id=\"choice\" hidden>\n  <div class=\"card\">\n    <p class=\"kicker\" id=\"chK\"></p>\n    <p id=\"chQ\" style=\"font-size:17px\"></p>\n    <div class=\"row\" id=\"chBtns\"></div>\n  </div>\n</div>\n\n<div class=\"over\" id=\"end\" hidden>\n  <div class=\"card wide\">\n    <p class=\"kicker\">關卡結算</p>\n    <h2>仁・三次抉擇　<span id=\"endScore\"></span></h2>\n    <div class=\"stats\"><div><small>擊破</small><b id=\"eKills\">0</b></div><div><small>最大連擊</small><b id=\"eCombo\">0</b></div><div><small>用時</small><b id=\"eTime\">0:00</b></div></div>\n    <div class=\"tw\"><table><thead><tr><th></th><th>情境</th><th>你怎麼做</th><th>結果</th><th>兵書怎麼說</th></tr></thead><tbody id=\"endRows\"></tbody></table></div>\n    <h3>什麼是「仁」</h3>\n    <p class=\"q\">「將者，智、信、仁、勇、嚴也。」<span>〈計篇〉</span></p>\n    <p class=\"q\">「仁者，愛人憫物，知勤勞也。」<span>杜牧注〈計篇〉</span></p>\n    <p class=\"q\">「視卒如愛子，故可與之俱死。」<span>〈地形〉</span></p>\n    <p class=\"q\">「愛而不能令……譬若驕子，不可用也。」<span>〈地形〉</span></p>\n    <p>這一關的三次抉擇，就是「仁」：冬夜冒雪巡營、拊而勉之，士卒才肯與你同死（<b>視卒如愛子</b>）；善待降卒，降卒就成了你的兵（<b>卒善而養之</b>）；但仁不是對交戰中的敵軍手軟，宋襄公「不鼓不成列」，賠上的是自己士卒的性命（<b>若愛重傷，則如勿傷</b>）。將之仁，是把士卒的性命放在心上。而只愛不管，兵就成了「驕子」：仁要有嚴來配，這是下一關。</p>\n    <button type=\"button\" class=\"cta\" id=\"bAgain\">再打一次</button>\n    <button type=\"button\" class=\"cta menu\" id=\"bMenu2\">回目錄</button>\n  </div>\n</div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst TAU=Math.PI*2;\nconst rand=(a,b)=>a+Math.random()*(b-a);\nconst lerp=(a,b,t)=>a+(b-a)*t;\nconst clamp=(v,a,b)=>v<a?a:v>b?b:v;\nconst angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};\nconst angLerp=(a,b,t)=>a+angDiff(a,b)*Math.min(1,t);\nconst EASE={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,snap:t=>1-Math.pow(1-t,4),sine:t=>.5-.5*Math.cos(Math.PI*t)};\nconst reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ================= 渲染器與場景 ================= */\nconst canvas=$('gl');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));\nfunction glNotice(t){const el=document.getElementById('cap');if(el){el.hidden=false;el.textContent=t;}const w=document.getElementById('glWarn');if(w){w.hidden=false;w.textContent=t;}}\ncanvas.addEventListener('webglcontextlost',e=>{e.preventDefault();glNotice('畫面資源被手機系統回收了（開太多頁面）。請關閉其他分頁後重新整理這一頁。');},false);\ncanvas.addEventListener('webglcontextrestored',()=>{try{renderer.resetState();}catch(e){}},false);\nif(!renderer.getContext())glNotice('這個瀏覽器無法建立立體畫面，請改用 Safari 或 Chrome 重新開啟。');\nconst scene=new THREE.Scene();\nconst HORIZON=0xe2a46a;\nscene.background=new THREE.Color(HORIZON);\nscene.fog=new THREE.Fog(HORIZON,70,200);\nconst camera=new THREE.PerspectiveCamera(50,1,.4,400);\nlet portrait=false;\nlet sky;\n{\n  const g=new THREE.SphereGeometry(260,24,14),p=g.attributes.position,cols=[];\n  const top=new THREE.Color(0x56577f),hor=new THREE.Color(HORIZON),low=new THREE.Color(0xb98058),c=new THREE.Color();\n  for(let i=0;i<p.count;i++){const y=p.getY(i)/260;if(y>=0)c.copy(hor).lerp(top,Math.pow(y,.55));else c.copy(hor).lerp(low,Math.min(1,-y*3));cols.push(c.r,c.g,c.b);}\n  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));\n  sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));\n  scene.add(sky);\n}\nconst hemi=new THREE.HemisphereLight(0xffe6c4,0x6a5040,.8);scene.add(hemi);\nconst sun=new THREE.DirectionalLight(0xffcf98,.95);sun.position.set(-30,45,22);scene.add(sun);\nconst matCache={};\nconst lam=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));\nfunction block(w,h,d,c,x,y,z,parent){const m=new THREE.Mesh(BOX,lam(c));m.scale.set(w,h,d);m.position.set(x,y,z);(parent||scene).add(m);return m;}\nconst BOX=new THREE.BoxGeometry(1,1,1);\nfunction noiseTex(base,amt,size,dots){\n  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');\n  g.fillStyle=base;g.fillRect(0,0,size,size);\n  for(let i=0;i<dots;i++){const v=Math.random()-.5,s=Math.random()<.15?4:2;g.fillStyle=v>0?`rgba(255,236,200,${v*amt})`:`rgba(40,22,10,${-v*amt})`;g.fillRect(Math.random()*size|0,Math.random()*size|0,s,s);}\n  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t;\n}\nfunction flashTexLater(){return flashTexLater.t||(flashTexLater.t=radialTex([[0,'rgba(255,255,240,1)'],[.25,'rgba(255,214,120,.9)'],[.55,'rgba(255,120,40,.35)'],[1,'rgba(255,80,20,0)']]));}\nfunction radialTex(s t('canvas');c.width=256;c.height=Math.round(256*h/w);const g=c.getContext('2d');\n  g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.strokeStyle=fg;g.lineWidth=6;g.strokeRect(8,8,c.width-16,c.height-16);\n  g.fillStyle=fg;g.font='900 '+(fs||120)+'px \"Noto Serif TC\",\"Songti TC\",\"PMingLiU\",serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,c.width/2,c.height/2+6);\n  const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshLambertMaterial({map:t,side:THREE.DoubleSide}));return m;\n}\nconst XGATES=[];\n{\n  const t=noiseTex('#8a8858',.5,128,2600);t.repeat.set(90,90);\n  const ground=new THREE.Mesh(new THREE.PlaneGeometry(420,420),new THREE.MeshLambertMaterial({map:t}));\n  ground.rotation.x=-Math.PI/2;ground.position.set(60,0,-60);scene.add(ground);\n  // 雪地：營區一帶鋪一層白\n  const st=noiseTex('#e8ecf0',.25,128,1500);st.repeat.set(30,40);\n  const snowG=new THREE.Mesh(new THREE.PlaneGeometry(110,150),new THREE.MeshLambertMaterial({map:st,transparent:true,opacity:.92}));\n  snowG.rotation.x=-Math.PI/2;snowG.position.set(0,.01,-45);scene.add(snowG);\n  const rt=noiseTex('#b89466',.45,64,700);rt.repeat.set(2,30);\n  const road=new THREE.Mesh(new THREE.PlaneGeometry(5,180),new THREE.MeshLambertMaterial({map:rt,transparent:true,opacity:.7}));\n  road.rotation.x=-Math.PI/2;road.position.set(0,.015,-45);scene.add(road);\n  const pt=[noiseTex('#7f6244',.5,64,900),noiseTex('#a3a24e',.45,64,900)];\n  for(let i=0;i<40;i++){const z=rand(-150,30),x=rand(60,230);const w=rand(4,12),d=rand(5,16);\n    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({map:pt[i%2],transparent:true,opacity:.5}));m.rotation.x=-Math.PI/2;m.rotation.z=rand(0,TAU);m.position.set(x,.006+i*.0002,z);scene.add(m);}\n}\nconst PM=new THREE.Matrix4(),CM=new THREE.Matrix4();\nfunction instParts(parts,places){\n  if(!places.length)return;const col=new THREE.Color();\n  for(const pt of parts){\n    const im=new THREE.Instance t){\n  const u=U.find(u=>!u.active);if(!u)return null;\n  Object.assign(u,{active:true,alive:true,x,z,y:0,yaw,hp:7,stun:0,atkT:0,cd:rand(.8,2),tilt:0,vx:0,vz:0,vy:0,air:false,down:0,rise:0,flying:false,deadT:0,\n    moving:false,phase:rand(0,TAU),group:'',team:0,mode:'fight',hidden:false,emerge:0,noSpear:false,ai:0,seed:rand(0,9),stopZ:0,flag:null,glinted:false,front:false,\n    home:null,leash:0,dest:null,onArrive:null,cspd:4,eager:false,cheer:0,kneel:false,attn:false,passive:false,target:null,retarget:0,fight:true,desert:false,src:null,srcMode:null,ox:0,oz:0,killed:false,huddle:false,warm:false,shield:false,heavy:false,stuck:false,sink:0,rank:0,officer:false,noAtk:false,path:null,bigShield:false,routed:false,wall:false,keen:false,hardened:false},opt||{});\n  if(isEnemyTeam(u.team)&&!u.passive&&!u.heavy&&!u.wall)u.hp*=FOE.hp;\n  if(isEnemyTeam(u.team)&&!u.passive&&ST.hardK>1&&!u.hardened){u.hardened=true;u.hp*=ST.hardK;u.keen=true;}\n  paintUnit(u.i,u.team);\n  return u;\n}\nconst dupOK=u=>isEnemyTeam(u.team)&&!u.passive&&!u.officer&&!u.champ&&!u.heavy&&!u.wall&&!u.src;\nfunction spawnFoe(x,z,yaw,opt){\n  const u=spawnFoe1(x,z,yaw,opt);if(!u||!dupOK(u)||(opt&&opt.noDup))return u;\n  FOE.acc+=FOE.n-1;\n  while(FOE.acc>=1){FOE.acc-=1;const a=rand(0,TAU),r=rand(.8,1.9),ox=Math.sin(a)*r,oz=Math.cos(a)*r;\n    const c=spawnFoe1(x+ox,z+oz,yaw,Object.assign({},opt||{},{flag:null}));if(!c)break;c.src=u;c.srcMode=u.mode;c.ox=ox;c.oz=oz;c.hp=u.hp;c.keen=u.keen;c.hardened=u.hardened;\n    if(u.dest)c.dest=[u.dest[0]+ox*.6,u.dest[1]+oz*.6];if(u.home)c.home=[u.home[0]+ox*.6,u.home[1]+oz*.6];}\n  return u;\n}\n/* 影從：跟著原單位切換行為（原單位被劇情改了模式、目的地、被動與否，影從也跟著改） */\nfunction syncDups(){\n  for(const c of U){if(!c.active||!c.alive||!c.src)continue;const s=c.src;\n    if(!s.active){if(!s.killed){c.active=false;c.alive=false;dropFlag(c);}c.src=null;continue;}\n    if(!s.alive){c.src=null;continue;}\n    if(s.mode!==c.srcMode){c.srcMode=s.mode;c.mode=s.mode;c.dest=s.dest?[s.dest[0]+c.ox*.6,s.dest[1]+c.oz*.6]:null;c.path=null;c.stopZ=s.stopZ;c.stun=0;c.onArrive=null;}\n    c.passive=s.passive;c.noAtk=s.noAtk;c.fight=s.fight;c.hidden=s.hidden;c.keen=s.keen||c.keen;c.front=s.front;c.noClip=s.noClip;c.routed=s.routed;c.spent=s.spent;\n    if(s.spd!==undefined)c.spd=s.spd;if(s.cspd!==undefined)c.cspd=s.cspd;if(s.home)c.home=[s.home[0]+c.ox*.6,s.home[1]+c.oz*.6];if(s.faceYaw!==undefined)c.faceYaw=s.faceYaw;}\n}\nconst allies=()=>U.filter(u=>u.active&&u.alive&&u.team===1);\nconst aliveG=g=>U.filter(u=>u.active&&u.alive&&u.group===g);\nconst enemiesAlive=()=>U.filter(u=>u.active&&u.alive&&!u.hidden&&isEnemyTeam(u.team)&&!u.passive);\nfunction attachFlag(u,mat){const f=flags.find(f=>!f.unit&&!f.fall);if(!f)return;f.unit=u;u.flag=f;f.cloth.material=mat||BMAT.qin;f.g.visible=true;f.g.rotation.set(0,0,0);}\nfunction dropFlag(u){const f=u.flag;if(!f)return;u.flag=null;f.unit=null;f.fall={t:0,dir:Math.random()<.5?1:-1,yaw:u.yaw+rand(-.6,.6)};}\nfunction hurtFoe(u,h,fx,fz){\n  if(!u.alive||u.hidden||u.passive)return;\n  const byPlayer=!h.src;\n  if(u.heavy){sparks(u.x,1.2,u.z,4,false);if(byPlayer){snd('clang');P.kvx=(P.x-u.x)*1.5;P.kvz=(P.z-u.z)*1.5;}return;}\n  u.hp-=h.dmg;\n  let dx=u.x-fx,dz=u.z-fz;const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;\n  sparks(u.x,1.1+u.y,u.z,byPlayer?6:2,false);if(byPlayer)flash(u.x,1.1+u.y,u.z,1.4,0xffe0a0,.18);\n  if(byPlayer){combo++;comboT=2.6;maxCombo=Math.max(maxCombo,combo);P.musou=Math.min(100,P.musou+1.1);}\n  if(u.atkT>0)u.atkT=0;\n  if(u.hp<=0){\n    u.alive=false;u.killed=true;u.deadT=0;u.stun=0;if(byPlayer)kills++;\n    if(h.fly||u.air||h.launch){u.flying=true;u.vy=Math.max(u.vy,rand(6,9));u.vx=dx*h.kb*1.2;u.vz=dz*h.kb*1.2;u.spin=-rand(8,14);u.y=Math.max(u.y,.02);}\n    else{u.flying=false;u.vx=dx*h.kb*.7;u.vz=dz*h.kb*.7;}\n    dropFlag(u);\n  }else if(h.launch){u.air=true;u.vy=h.launch;u.vx=dx*h.kb;u.vz=dz*h.kb;u.y=Math.max(u.y,.05);u.stun=0;}\n  else if(u.air){u.vy=Math.max(u.vy,3.5);u.vx=dx*2;u.vz=dz*2;}\n  else{u.stun=.34;u.vx=dx*h.kb;u.vz=dz*h.kb;}\n  if(u.mode==='hold'||u.mode==='guard')u.mode='fight';\n}\nfunction heroHit(h){\n  const fx=P.x+Math.sin(P.yaw)*(h.fwd||0),fz=P.z+Math.cos(P.yaw)*(h.fwd||0);let n=0;\n  for(const u of U){\n    if(!u.active||!u.alive||u.hidden||!isEnemyTeam(u.team)||u.passive)continue;\n    const dx=u.x-fx,dz=u.z-fz,d=Math.hypot(dx,dz);\n    if(d>h.r+.35)continue;\n    if(h.arc<Math.PI&&d>.7&&Math.abs(angDiff(P.yaw,Math.atan2(dx,dz)))>h.arc)continue;\n    hurtFoe(u,h,fx,fz);n++;\n  }\n  return n;\n}\nfunction hurtHero(dmg,fx,fz,kb){\n  if(P.inv>0||P.mu||phase!=='play'||ST.cut)return false;\n  P.hp=Math.max(P.max*.1,P.hp-dmg);P.inv=.35;\n  $('hurt').animate([{opacity:dmg>15?1:.55},{opacity:0}],{duration:dmg>15?600:320});\n  addShake(dmg>15?.45:.12);snd('hurt');\n  if(kb){let dx=P.x-fx,dz=P.z-fz;const d=Math.hypot(dx,dz)||1;P.kvx=dx/d*kb;P.kvz=dz/d*kb;}\n  if(!P.clip||P.clip==='guard'||P.clip==='hurt'||CHAIN.indexOf(P.clip)<2)play('hurt');\n  return true;\n}\nfunction facingTo(x,z,lim){return Math.abs(angDiff(P.yaw,Math.atan2(x-P.x,z-P.z)))<(lim||1.25);}\nfunction nearestOf(u,list,maxD){let best=null,bd=maxD;for(const t of list){if(t===u)continue;const d=Math.hypot(t.x-u.x,t.z-u.z);if(d<bd){bd=d;best=t;}}return best;}\nfunction slotPos(k){const row=(k/4)|0,col=k%4,back=2.6+row*1.5,side=(col-1.5)*1.5,s=Math.sin(P.yaw),c=Math.cos(P.yaw);return [P.x-s*back+c*side,P.z-c*back-s*side];}\n\nfunction updFoe(u,dt){\n  if(!u.active)return;\n  if(!u.alive){\n    u.deadT+=dt;\n    if(u.flying){u.vy-=24*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.y+=u.vy*dt;u.tilt+=u.spin*dt;\n      if(u.y<=0&&u.vy<0){u.y=0;u.flying=false;u.tilt=-Math.PI/2;u.vx*=.2;u.vz*=.2;u.deadT=Math.min(u.deadT,.4);dust(u.x,u.z,3);}}\n    else{u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.004,dt);u.vx*=f;u.vz*=f;u.tilt+=(-Math.PI/2-u.tilt)*Math.min(1,dt*10);\n      if(u.deadT>2.6){u.y-=dt*.7;if(u.y<-.8)u.active=false;}}\n    return;\n  }\n  if(u.hidden)return;\n  u.sink=lerp(u.sink,inWater(u.x,u.z)?.45:0,Math.min(1,dt*6));\n  if(u.cheer>0){u.cheer-=dt;u.y=Math.abs(Math.sin(u.cheer*9))*.35;u.moving=false;if(u.cheer<=0)u.y=0;return;}\n  if(u.air){u.vy-=24*dt;u.y+=u.vy*dt;u.x+=u.vx*dt;u.z+=u.vz*dt;u.tilt=lerp(u.tilt,-.9,dt*6);\n    if(u.y<=0&&u.vy<0){u.y=0;u.air=false;u.down=.7;u.tilt=-Math.PI/2;dust(u.x,u.z,2);}return;}\n  if(u.down>0){u.down-=dt;u.tilt=-Math.PI/2;if(u.down<=0)u.rise=.4;return;}\n  if(u.rise>0){u.rise-=dt;u.tilt=-Math.PI/2*Math.max(0,u.rise/.4);return;}\n  u.cd-=dt;\n  if(u.stun>0){u.stun-=dt;u.x+=u.vx*dt;u.z+=u.vz*dt;const f=Math.pow(.003,dt);u.vx*=f;u.vz*=f;u.tilt=-.45*Math.max(0,u.stun/.34);u.moving=false;return;}\n  u.tilt*=.82;\n  if(u.ai>0)u.ai-=dt;\n  const mv=(tx,tz,sp,face)=>{const ddx=tx-u.x,ddz=tz-u.z,dd=Math.hypot(ddx,ddz);if(dd<.05){u.moving=false;return true;}const s=Math.min(sp,dd/Math.max(dt,1e-4));\n    u.x+=ddx/dd*s*dt;u.z+=ddz/dd*s*dt;u.yaw=angLerp(u.yaw,face!=null?face:Math.atan2(ddx,ddz),dt*8);u.moving=s>.3;u.phase+=dt*s*2.8;return dd<.3;};\n  // 攻擊動作\n  if(u.atkT>0){\n    const prev=u.atkT;u.atkT-=dt;u.moving=false;const t=u.target;\n    if(t)u.yaw=angLerp(u.yaw,Math.atan2(t.x-u.x,t.z-u.z),dt*3);\n    if(prev>.28&&u.atkT<=.28&&!u.glinted){u.glinted=true;flash(u.x+Math.sin(u.yaw)*.9,1.7,u.z+Math.cos(u.yaw)*.9,.9,0xfff2c0,.25);}\n    if(prev>.13&&u.atkT<=.13&&t){\n      if(t===P){const d=Math.hypot(P.x-u.x,P.z-u.z);if(d<2.2){if(P.blocking&&facingTo(u.x,u.z)){snd('clang');sparks(P.x+(u.x-P.x)/d*.9,1.4,P.z+(u.z-P.z)/d*.9,10,false);u.stun=.5;u.vx=(u.x-P.x)/d*3;u.vz=(u.z-P.z)/d*3;u.atkT=0;}else hurtHero((u.keen?12:8)*FOE.dmg,u.x,u.z,3);}}\n      else if(t.alive&&Math.hypot(t.x-u.x,t.z-u.z)<2.2)hurtFoe(t,{dmg:u.team===1?2:1,kb:2.2,src:'unit'},u.x,u.z);\n    }\n    return;\n  }\n  u.retarget-=dt;\n  switch(u.mode){\n    case 'attn':case 'hold':{u.moving=false;u.attn=u.mode==='attn';if(u.home&&Math.hypot(u.home[0]-u.x,u.home[1]-u.z)>.6){u.attn=false;mv(u.home[0],u.home[1],3.2);}else if(u.faceYaw!=null)u.yaw=angLerp(u.yaw,u.faceYaw,dt*4);return;}\n    case 'rush':case 'carry':case 'walkTo':{\n      u.attn=false;if(!u.dest){u.mode='attn';return;}\n      const arrived=mv(u.dest[0],u.dest[1],(u.cspd||5)*(inWater(u.x,u.z)?.45:1));\n      if(arrived||Math.hypot(u.dest[0]-u.x,u.dest[1]-u.z)<.5){if(u.path&&u.path.length){u.dest=u.path.shift();return;}u.moving=false;const cb=u.onArrive;u.onArrive=null;u.dest=null;if(cb)cb(u);}\n      return;}\n    case 'kneel':{u.kneel=true;u.moving=false;return;}\n    case 'huddle':{u.huddle=true;u.moving=false;u.kneel=true;return;}\n    case 'rout':{u.noSpear=true;u.attn=false;const dx=u.x-P.x,dz=u.z-P.z,d=Math.hypot(dx,dz)||1;const a=Math.atan2(dx,dz)+Math.sin(clock*2.6+u.seed)*.6;\n      const sp=u.stuck?1.2:4.6;u.x+=Math.sin(a)*sp*dt;u.z+=Math.cos(a)*sp*dt;u.yaw=angLerp(u.yaw,a,dt*6);u.moving=true;u.phase+=dt*sp*2.8;if(d>44){u.active=false;u.alive=false;}return;}\n    case 'stuck':{u.moving=false;u.tilt=Math.sin(clock*3+u.seed)*.12;u.yaw=angLerp(u.yaw,Math.atan2(P.x-u.x,P.z-u.z),dt*2);return;}\n    case 'wall':{u.attn=false;const W=ST.wall;if(!W)return;const tx=W.x0+(u.rank%W.cols)*W.sp,tz=W.z+Math.floor(u.rank/W.cols)*-(W.rsp||1.3);\n      const d=Math.hypot(tx-u.x,tz-u.z);if(d>.15){mv(tx,tz,W.speed||1.2,0);u.phase+=dt*2;}else{u.moving=false;u.yaw=angLerp(u.yaw,0,dt*6);}\n      if(W.active&&u.cd<=0&&Math.hypot(P.x-u.x,P.z-u.z)<2.6){u.target=P;u.atkT=.52;u.glinted=false;u.cd=rand(1.2,2.2);}\n      return;}\n    case 'desert':{u.attn=false;u.noSpear=true;mv(u.x+Math.sign(u.x||1)*2,u.z+40,4.2);if(Math.hypot(u.x-P.x,u.z-P.z)>38){u.active=false;u.alive=false;}return;}\n    case 'follow':{\n      u.attn=false;const idx=allies().indexOf(u);const [sx,sz]=slotPos(Math.max(0,idx));\n      const ds=Math.hypot(sx-u.x,sz-u.z);if(ds>.4)mv(sx,sz,clamp(2+ds*1.1,2,6.5));else{u.moving=false;u.yaw=angLerp(u.yaw,P.yaw,dt*4);}\n      // 跟隨時若敵人逼近也會還手\n      if(u.fight&&!u.officer&&u.cd<=0){const e=nearestOf(u,enemiesAlive(),2.2);if(e){u.target=e;u.atkT=.52;u.glinted=false;u.cd=rand(1.4,2.4);}}\n  }\n    if(P.clip==='hurt'&&P.queued&&P.ct>=200){P.clip=null;nextAtk(0);}\n    const last=C.k[C.k.length-1][0];\n    if(P.clip&&!C.hold&&P.ct>=last){if(CHAIN.includes(P.clip)){P.comboWin=.3;if(P.lastAtk>=3)P.lastAtk=-1;}P.clip=null;}\n  }\n  // 範圍\n  collideWalls(P,.6);P.x=clamp(P.x,BND.x0,BND.x1);P.z=clamp(P.z,BND.z0,BND.z1);\n  P.vzN=lerp(P.vzN,(P.lastZ-P.z)/Math.max(dt,1e-4),Math.min(1,dt*10));P.lastZ=P.z;\n}\nconst vA=new THREE.Vector3(),vB=new THREE.Vector3();\nfunction poseHero(dt){\n  let p;\n  if(P.clip){p=evalClip(HC[P.clip],P.ct);}\n  else{\n    P.runW=lerp(P.runW,P.speed>.4?Math.min(1,P.speed/5):0,Math.min(1,dt*10));\n    const prevS=Math.sin(P.phase);P.phase+=dt*(4+P.speed*1.25);const s=Math.sin(P.phase);\n    if(P.runW>.5&&Math.sign(s)!==Math.sign(prevS)){puff(P.x+rand(-.3,.3),.2,P.z+rand(-.3,.3),.4,1.2,.5,.4,0,.6,0);}\n    const br=Math.sin(clock*1.8);const idle=Object.assign({},PD,{gy:PD.gy+br*.015,ux:PD.ux+br*.02,y:br*.01});\n    const run=Object.assign({},PD,POSE.run,{lL:s*.95,lR:-s*.95,y:Math.abs(Math.cos(P.phase))*.1,uy:POSE.run.uy+s*.15,uz:s*.05});\n    const target=lerpPose(idle,run,P.runW);\n    p=lerpPose(P.pose,target,Math.min(1,dt*16));\n  }\n  P.pose=p;\n  H.root.position.set(P.x,0,P.z);H.root.rotation.y=P.yaw;\n  H.body.position.y=(pv(p,'y')-pv(p,'cr')*.3)*S;\n  H.body.rotation.set(pv(p,'bx')+P.flip,pv(p,'by'),0);\n  H.upper.rotation.set(pv(p,'ux'),pv(p,'uy'),pv(p,'uz'));\n  H.legL.rotation.x=pv(p,'lL')-pv(p,'cr')*.6;H.legR.rotation.x=pv(p,'lR')+pv(p,'cr')*.6;\n  H.grip.position.set(pv(p,'gx'),pv(p,'gy'),pv(p,'gz'));H.grip.rotation.set(pv(p,'wx'),pv(p,'wy'),pv(p,'wz'));\n  H.cape.rotation.x=.18+P.runW*.55+Math.sin(clock*3.1)*.05+(P.clip&&P.clip!=='guard'?.12:0)+(P.mu?.35:0);\n  updFeathers(dt);\n  H.root.updateMatrixWorld(true);updTassel(dt);\n  H.grip.getWorldPosition(vA);H.armR.lookAt(vA);\n  const bowing=P.clip==='bow'&&!!P.aim;H.bow.visible=bowing;H.grip.visible=!bowing;\n  if(bowing){H.armL.lookAt(P.aim);H.armR.lookAt(vB.copy(P.aim).a 敵勢三倍','#ff8a66');snd('drum');hardenHero();}\nfunction stillNow(){return !P.moving&&(!P.clip||P.clip==='guard');}\nfunction setMorale(v){ST.morale=clamp(v,0,1);const on=Math.round(8*ST.morale);const el=$('morale').querySelectorAll('i');el.forEach((e,i)=>e.classList.toggle('on',i<on));}\nfunction setOrder(label,fn,big){ST.orderReady=fn;ST.orderLabel=label||'';const b=$('bOrd');b.hidden=!fn;$('ordL').textContent=label||'';$('ordB').textContent=big||'令';}\nfunction doOrder(){if(ST.orderReady&&phase==='play'&&!paused){const fn=ST.orderReady;setOrder('',null);fn();}}\nfunction showOrder(text,sub,dur){const el=$('order');el.querySelector('.t').textContent=text;el.querySelector('.s').textContent=sub||'';\n  el.animate([{opacity:0,transform:'translateX(-50%) translateY(10px)'},{opacity:1,transform:'translateX(-50%) translateY(0)',offset:.08},{opacity:1,offset:.86},{opacity:0}],{duration:(dur||4.2)*1000,easing:'ease-out',fill:'forwards'});snd('drum');}\nfunction chapterTitle(main,sub){const el=$('ctitle');el.querySelector('.m').textContent=main;el.querySelector('.s').textContent=sub;\n  el.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:3600,fill:'forwards'});MUS.gong();}\nlet bubIdx=0;const bubs=[];\nfunction bubble(u,txt,dur){const el=$('bub'+(bubIdx++%6));el.textContent=txt;const old=bubs.find(b=>b.el===el);if(old)bubs.splice(bubs.indexOf(old),1);bubs.push({el,u,t:0,dur:dur||2});}\nfunction fadeTo(fn){const f=$('fade');f.animate([{opacity:0},{opacity:1}],{duration:650,fill:'forwards'});later.add(.7,()=>{fn();f.animate([{opacity:1},{opacity:0}],{duration:700,fill:'forwards'});});}\nfunction askChoice(kicker,q,opts){paused=true;$('chK').textContent=kicker;$('chQ').textContent=q;const box=$('chBtns');box.innerHTML='';\n  opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='chb'+(i?'':' main');b.textContent=o.t;b.addEventListener('click',()=>{$('choice').hidden=true;paused=false;o.fn();});box.append tCh2));});\n}\n\n/* ---------- 二、養降 ---------- */\nlet CH2=null;\nfunction startCh2(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=2;ST.step='kneel';ST.t=0;ST.night=0;ST.snow=0;updProg();\n  BND={x0:-30,x1:72,z0:XIAO.z+4,z1:XIAO.z+70};\n  xiaoGate.open=1;xiaoGate.flags.forEach(f=>f.cloth.material=BMAT.white);\n  placeHero(0,XIAO.z+24,Math.PI);\n  const A=spawnAllies(6,0,XIAO.z+28,Math.PI,'hold','chu');A.forEach(a=>{a.eager=true;});if(A[0])attachFlag(A[0],BMAT.chu);\n  const off=spawnOfficer(3,XIAO.z+22,Math.PI);off.mode='attn';off.home=[3,XIAO.z+22];off.faceYaw=Math.PI;\n  const K=[];for(let i=0;i<6;i++){const x=(i-2.5)*2.2,z=XIAO.z+11+(i%2)*1.4;const k=spawnFoe(x,z,0,{team:3,group:'kneel',mode:'kneel',passive:true,noSpear:true,hp:99,faceYaw:0});if(k)K.push(k);\n    const s=dropSpears[i];s.visible=true;s.position.set(x+1.1,.05,z+.4);s.rotation.set(0,rand(-.4,.4),0);}\n  const R=[];for(let i=0;i<60;i++){const col=i%10,row=(i/10)|0;const x=54+col*2.1+rand(-.3,.3),z=XIAO.z+8+row*4+rand(-.5,.5);\n    const u=spawnFoe(x,z,-Math.PI/2,{team:4,group:'cai',hp:7,passive:true,mode:'walkTo',cspd:2.6,dest:[x-10,z],faceYaw:-Math.PI/2,ai:.5+(i%7)*.2});if(u){if(i%6===0)attachFlag(u,BMAT.cai);R.push(u);}}\n  CH2={allies:A,officer:off,captives:K,relief:R,kept:null,hard:false,t0:0,spawned:false,spent:false,won:false,ended:false,ws:0,waveMsg:false,reliefN:0};\n  ST.cut=true;P.locked=true;\n  chapterTitle('二　養降','卒善而養之・〈作戰〉');\n  setCap(ST.siegeFail?'圍城一月，蕭城糧盡，終於出降。守軍丟下兵器跪在城外。':'蕭人出降，丟下兵器跪在城外。');\n  later.add(2.4,()=>{makeDust('tall',XIAO.z+18,70);focus(52,XIAO.z+20,1.2,14,12);setCap('東邊揚起塵土——蔡人的援軍黑壓壓地往這裡趕來。');});\n  later.add(5.2,()=>{focus(null);bubble(off,'降卒太多，恐生變！',2.4);});\n  later.add(7.2,()=>askChoice('蕭人出降','降卒眾多，軍糧不多，援軍又要到了。部將說：「留著他們恐怕生變，不如盡坑之。」',[\n    {t:'卒善而養之',fn:()=>captive2(true)},{t:'盡坑之',fn:()=>captive2(false)}]));\n}\nfunction captive2(keep){const C=CH2;C.kept=keep;ST.cut=false;P.locked=false;\n  if(keep){setMorale(ST.morale+.2);showOrder('卒善而養之。','給降卒飯吃 C.spawned=true;});\n}\nfunction ch2Update(dt){const C=CH2;if(ST.step!=='fight')return;\n  if(C.hard&&elapsed-C.t0>=13&&!C.winClosed){C.winClosed=true;clearTimer();setCap('援軍不再湧入。把眼前的蔡兵打完！');}\n  if(C.hard&&C.spawned&&!C.spent&&elapsed-C.t0<13){C.ws+=dt;if(C.ws>.4&&aliveG('cai').length<80){C.ws=0;const u=spawnFoe(66+rand(0,6),XIAO.z+8+rand(0,24),-Math.PI/2,{team:4,group:'cai',hp:10,ai:.3,mode:'fight',cspd:4.5});if(u&&Math.random()<.2)attachFlag(u,BMAT.cai);}\n    if(!C.waveMsg&&elapsed-C.t0>7){C.waveMsg=true;setCap('援軍越殺越多——敵人知道投降也是死，人人拚命。');}}\n  if((P.hp<=P.max*.1+.5||(C.hard&&P.hp<=P.max*.3))&&!C.spent){C.spent=true;clearTimer();P.hp=Math.max(P.hp,P.max*.25);ST.cut=true;\n    if(C.hard){setCap('蔡人援軍源源不絕，你勢單力薄，只能收兵退走。');C.allies.forEach(a=>{if(a.alive)a.mode='follow';});ST.auto=[-.4,1];aliveG('cai').forEach(u=>{u.ai=99;});later.add(2.4,()=>{ST.auto=null;end2();});return;}\n    aliveG('cai').forEach(u=>{u.mode='rout';});setCap('力戰不支，蔡兵暫退。');}\n  if(!C.hard&&C.spawned&&aliveG('cai').length===0&&!C.won){C.won=true;end2();}\n  if(C.hard&&C.winClosed&&!C.spent&&aliveG('cai').length===0&&!C.won){C.won=true;setCap('蔡人援軍終於打退，但死傷慘重。');later.add(1.5,end2);}\n}\nfunction end2(){const C=CH2;if(C.ended)return;C.ended=true;ST.cut=true;clearTimer();const good=C.kept;\n  if(good)C.allies.forEach((a,i)=>{if(a.alive)later.add(i*.08,()=>{a.cheer=1.5;a.mode='attn';a.home=[a.x,a.z];});});\n  later.add(1.2,()=>{judge(good,good?'勝敵而益強':'勢單力薄','卒善而養之，是謂勝敵而益強。',good?'降卒吃了你的飯，替你打退了援軍':'殺了降卒，敵人知道投降也是死，人人死戰，援軍越打越多');\n    ST.log[2]={did:good?'卒善而養之，編入隊伍':'聽部將的話，盡坑降卒',out:good?'降卒並肩作戰，擊退援軍':(C.spent?'援軍源源不絕，勢單力薄而退':'援軍死戰不退，苦戰方退，死傷慘重'),good};updProg();\n    later.add(4.2,()=>fadeTo(startCh3));});\n}\n\n/* ---------- 三、泓水 ---------- */\nlet CH3=null;\nfunction startCh3(){\n  clearUnits();ST.hardK=1;resetHero();clearTimer();ST.ch=3;ST.step='cross';ST.t=0;ST.night=0;ST.snow=0;setMorale(.6);updProg();if(DUST){DUST=null;dustP.forEach(d=>d.sp.visible=false);}\n  BND={x0:RV.X-28,x1:RV.X+28,z0:-100,z1:-8};\n  placeHero(RV.X,-26,Math.PI);\n  const A=spawnAllies(5,RV.X,-33,Math.PI,'hold','song');A.forEach(a=>{a.eager=true;a.fight=true;});if(A[0])attachFlag(A[0],BMAT.song);\n  const off=spawnOfficer(RV.X+3,-27,Math.PI);off.mode='attn';off.home=[RV.X+3,-27];off.faceYaw=Math.PI;\n  const E=[];\n  for(let i=0;i<36;i++){const col=i%6,row=(i/6)|0;const x=RV.X+(col-2.5)*3.2+rand(-.4,.4),z=-76-row*3.2;\n    const u=spawnFoe(x,z,0,{team:5,group:'chu',hp:7,passive:true,shield:true,mode:'walkTo',cspd:2.2,dest:[x+rand(-.6,.6),-49+row*1.6],faceYaw:0,ai:.9+(i%9)*.2});\n    if(u){u.routed=false;if(i%6===2)attachFlag(u,BMAT.chuR);E.push(u);}}\n  CH3={allies:A,officer:off,chu:E,strikeAt:null,t0:0,spent:false,won:false,askedB:false,c2t:0,formT:0,charged:false,thr:0,lost:false,wallMsg:false,ended:false};\n  ST.cut=true;P.locked=true;focus(RV.X,-43,1.2,20,22);\n  chapterTitle('三　泓水','宋襄公・《左傳・僖公二十二年》');\n  setCap('楚人渡泓水而來。彼眾我寡。');\n  later.add(4,()=>bubble(off,'彼眾我寡，請擊之！',2.6));\n  later.add(6.2,()=>askChoice('楚人正在渡河','司馬說：「彼眾我寡，及其未既濟也，請擊之。」',[\n    {t:'擊之：趁他們渡到一半',fn:()=>strike3('half')},{t:'不可：君子不困人於阨',fn:()=>wait3('A')}]));\n}\nconst chuLive=()=>aliveG('chu');\nfunction routChu(u){if(!u.alive)return;u.routed=true;u.passive=true;u.mode='rout';u.shield=false;dropFlag(u);}\nfunction strike3(kind){const C=CH3;C.strikeAt=kind;ST.step='fight';ST.cut=false;P.locked=false;focus(null);if(C.officer)C.officer.mode='follow';C.t0=elapsed;ST.chargeTo=[RV.X,-56];\n  showOrder(kind==='half'?'及其未既濟，擊之！':'及其未成列，擊之！',kind==='half'?'半濟而擊':'趁楚軍還沒排好陣');\n  C.allies.forEach(a=>{if(a.alive){a.mode='charge';a.dest=[RV.X,-50];}});\n  chuLive().forEach((u,i)=>{u.dest=null;u.path=null;\n    if(kind==='half'){const inW=u.z>RV.z0-1.5&&u.z<RV.z1;\n      if(inW){u.mode='stuck';u.stuck=true;u.noAtk=true;u.passive=false;u.hp=3*FOE.hp;}\n      else if(u.z<=RV.z0-1.5){later.add(1.2+Math.random()*.8,()=>routChu(u));}\n      else{u.passive=false;u.mode='fight';}}\n    else{if(i%5<3)later.add(.6+Math.random()*1.2,()=>rou
